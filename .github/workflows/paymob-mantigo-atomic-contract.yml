name: MantiGO Paymob Atomic RPC Contract

on:
  pull_request:
    paths:
      - "supabase/functions/paymob-webhook/index.ts"
      - "supabase/functions/digital-page-payment-intent/index.ts"
      - "supabase/migrations/20261009130000_rc426_digital_page_provider_order_binding.sql"
      - "supabase/migrations/20261009120000_rc425_atomic_mantigo_paymob_payment.sql"
      - "scripts/tests/paymob_mantigo_atomic_contract.py"
      - "scripts/validate-digital-pages-boundaries.mjs"
      - "supabase/functions/digital-page-order-create/index.ts"
      - "supabase/migrations/20261009010000_rc424_atomic_digital_page_payment_webhook.sql"
      - ".github/workflows/paymob-mantigo-atomic-contract.yml"
  push:
    branches:
      - "fix/paymob-mantigo-webhook-atomic-rc425-20261016"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify webhook-to-RPC contract
        run: python scripts/tests/paymob_mantigo_atomic_contract.py
      - name: Verify digital-page trusted finalization boundary
        run: node scripts/validate-digital-pages-boundaries.mjs
