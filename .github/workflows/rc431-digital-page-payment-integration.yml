name: RC431 Digital Page Payment Binding Integration

on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql"
      - "supabase/tests/rc431_digital_page_payment_fixture.sql"
      - "supabase/tests/rc431_digital_page_payment_integration.sql"
      - ".github/workflows/rc431-digital-page-payment-integration.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql"
      - "supabase/tests/rc431_digital_page_payment_fixture.sql"
      - "supabase/tests/rc431_digital_page_payment_integration.sql"
      - ".github/workflows/rc431-digital-page-payment-integration.yml"

permissions:
  contents: read

jobs:
  rc431-payment-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc431_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc431_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Create Supabase role stand-ins in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc431_test -v ON_ERROR_STOP=1 -c "create role anon; create role authenticated; create role service_role;"
      - name: Apply fixture, RC431, and payment integrity assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc431_digital_page_payment_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql "$pg_container:/tmp/rc431.sql"
          docker cp supabase/tests/rc431_digital_page_payment_integration.sql "$pg_container:/tmp/test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc431_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc431_test -v ON_ERROR_STOP=1 -f /tmp/rc431.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc431_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
