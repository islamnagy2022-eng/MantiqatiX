name: Combined Candidate Forward Migration Replay

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/baselines/**"
      - "supabase/tests/rc571_menu_scope_bypass.sql"
      - "scripts/verify-tenant-isolation.sql"
      - "scripts/verify-digital-page-self-service-rls.sql"
      - ".github/workflows/combined-candidate-forward-replay.yml"

permissions:
  contents: read
  pull-requests: read

jobs:
  combined-forward-replay:
    if: github.event.pull_request.number == 374
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact digital-page candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Resolve and pin the current candidate PR heads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr86_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/86" --jq '.head.sha')"
          pr282_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/282" --jq '.head.sha')"
          pr374_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/374" --jq '.head.sha')"
          test "$(git rev-parse HEAD)" = "$pr374_sha" || {
            echo "PR #374 head changed during workflow setup; rerun against the new exact head." >&2
            exit 1
          }
          git fetch origin refs/pull/86/head:refs/remotes/origin/pr-86
          git fetch origin refs/pull/282/head:refs/remotes/origin/pr-282
          git fetch origin refs/pull/374/head:refs/remotes/origin/pr-374
          test "$(git rev-parse refs/remotes/origin/pr-86)" = "$pr86_sha"
          test "$(git rev-parse refs/remotes/origin/pr-282)" = "$pr282_sha"
          test "$(git rev-parse refs/remotes/origin/pr-374)" = "$pr374_sha"
          {
            echo "PR86_SHA=$pr86_sha"
            echo "PR282_SHA=$pr282_sha"
            echo "PR374_SHA=$pr374_sha"
          } >> "$GITHUB_ENV"
          echo "Combined replay source commits:"
          echo "PR #86:  $pr86_sha"
          echo "PR #282: $pr282_sha"
          echo "PR #374: $pr374_sha"

      - name: Compose migration candidates from changed files only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          candidate_dir="$(mktemp -d)"
          echo "MNTY_COMBINED_MIGRATIONS=$candidate_dir" >> "$GITHUB_ENV"
          cp supabase/migrations/*.sql "$candidate_dir/"

          for pr in 86 282; do
            ref="refs/remotes/origin/pr-$pr"
            while IFS= read -r path; do
              [[ "$path" == supabase/migrations/*.sql ]] || continue
              filename="$(basename "$path")"
              source_file="$(mktemp)"
              git show "$ref:$path" > "$source_file"
              target="$candidate_dir/$filename"
              if [ -e "$target" ]; then
                if ! cmp -s "$source_file" "$target"; then
                  echo "Conflicting migration source for $filename across PR #$pr and PR #374; stop for explicit reconciliation." >&2
                  exit 1
                fi
              else
                cp "$source_file" "$target"
                echo "ADDED_CANDIDATE_MIGRATION=PR#$pr:$filename"
              fi
              rm -f "$source_file"
            done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$pr/files" --jq '.[].filename')
          done

          versions_file="$(mktemp)"
          for path in "$candidate_dir"/*.sql; do
            filename="$(basename "$path")"
            version="${filename%%_*}"
            [[ "$version" =~ ^[0-9]{14}$ ]] || {
              echo "Invalid migration version: $filename" >&2
              exit 1
            }
            printf '%s %s\n' "$version" "$filename" >> "$versions_file"
          done
          duplicate="$(awk '{print $1}' "$versions_file" | sort | uniq -d | head -n 1)"
          if [ -n "$duplicate" ]; then
            echo "Duplicate migration timestamp in composed candidate set: $duplicate" >&2
            grep "^$duplicate " "$versions_file" >&2
            exit 1
          fi
          echo "COMBINED_MIGRATION_FILE_COUNT=$(find "$candidate_dir" -maxdepth 1 -type f -name '*.sql' | wc -l)"
          rm -f "$versions_file"

      - name: Validate production checkpoint baseline
        run: node scripts/tests/production-schema-baseline-static-audit.mjs

      - name: Start isolated Supabase with no repository migrations
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          echo "MNTY_REPLAY_TEST_DIR=$test_dir" >> "$GITHUB_ENV"
          cd "$test_dir"
          supabase init
          supabase start -x studio,edge-runtime,logflare,vector

      - name: Restore production schema checkpoint and replay combined chain
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(cd "$MNTY_REPLAY_TEST_DIR" && supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$db_url"
          checkpoint="$(node -e 'const m=require("./supabase/tests/baselines/production_schema_snapshot.manifest.json"); process.stdout.write(m.last_applied_migration_version)')"
          [[ "$checkpoint" =~ ^[0-9]{14}$ ]]
          echo "BASELINE_CHECKPOINT=$checkpoint"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/production_schema_snapshot.sql

          migration_count=0
          while IFS= read -r migration; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            [[ "$version" =~ ^[0-9]{14}$ ]] || { echo "Invalid migration version: $filename" >&2; exit 1; }
            if [[ "$version" > "$checkpoint" ]]; then
              echo "REPLAY_COMBINED_MIGRATION=$filename"
              psql "$db_url" -v ON_ERROR_STOP=1 -f "$migration"
              migration_count=$((migration_count + 1))
            fi
          done < <(find "$MNTY_COMBINED_MIGRATIONS" -maxdepth 1 -type f -name '*.sql' -print | sort)

          test "$migration_count" -gt 0
          echo "COMBINED_FORWARD_MIGRATIONS_APPLIED=$migration_count"
          psql "$db_url" -v ON_ERROR_STOP=1 -v mantiqati_disposable=on -f supabase/tests/baselines/tenant_isolation_two_tenant_fixture.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/verify-tenant-isolation.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -v mantiqati_disposable=on -f scripts/verify-digital-page-self-service-rls.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc571_menu_scope_bypass.sql

      - name: Stop isolated Supabase instance
        if: always()
        shell: bash
        run: |
          if [ -n "${MNTY_REPLAY_TEST_DIR:-}" ] && [ -d "$MNTY_REPLAY_TEST_DIR" ]; then
            cd "$MNTY_REPLAY_TEST_DIR"
            supabase stop --no-backup || true
          fi
