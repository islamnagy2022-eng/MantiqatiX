name: Marketing CRM Tenant Scope
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/20261010210000_rc452_marketing_crm_tenant_scope.sql"
      - "supabase/migrations/20261015010000_rc526_marketing_services_platform_scope.sql"
      - "supabase/migrations/20261015020000_rc527_marketing_platform_permission_boolean_hardening.sql"
      - "supabase/tests/rc452_marketing_crm_scope_*.sql"
      - "scripts/validate-marketing-crm-tenant-scope.mjs"
      - ".github/workflows/marketing-crm-tenant-scope.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261010210000_rc452_marketing_crm_tenant_scope.sql"
      - "supabase/migrations/20261015010000_rc526_marketing_services_platform_scope.sql"
      - "supabase/migrations/20261015020000_rc527_marketing_platform_permission_boolean_hardening.sql"
      - "supabase/tests/rc452_marketing_crm_scope_*.sql"
      - "scripts/validate-marketing-crm-tenant-scope.mjs"
      - ".github/workflows/marketing-crm-tenant-scope.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-marketing-crm-tenant-scope.mjs

  marketing-crm-tenant-scope-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc452_marketing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc452_marketing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply fixture, migration, and cross-tenant behavior tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc452_marketing_crm_scope_fixture.sql "$pg_container:/tmp/rc452_fixture.sql"
          docker cp supabase/migrations/20261010210000_rc452_marketing_crm_tenant_scope.sql "$pg_container:/tmp/rc452_migration.sql"
          docker cp supabase/migrations/20261015010000_rc526_marketing_services_platform_scope.sql "$pg_container:/tmp/rc526_migration.sql"
          docker cp supabase/migrations/20261015020000_rc527_marketing_platform_permission_boolean_hardening.sql "$pg_container:/tmp/rc527_migration.sql"
          docker cp supabase/tests/rc452_marketing_crm_scope_integration.sql "$pg_container:/tmp/rc452_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc452_marketing_test -v ON_ERROR_STOP=1 -f /tmp/rc452_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc452_marketing_test -v ON_ERROR_STOP=1 -f /tmp/rc452_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc452_marketing_test -v ON_ERROR_STOP=1 -f /tmp/rc526_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc452_marketing_test -v ON_ERROR_STOP=1 -f /tmp/rc527_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc452_marketing_test -v ON_ERROR_STOP=1 -f /tmp/rc452_test.sql
