name: SMM Wallet Exactly-Once Contract
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/20261012110000_rc458_smm_wallet_exactly_once.sql"
      - "supabase/tests/rc456_smm_service_role_fixture.sql"
      - "supabase/tests/rc458_smm_wallet_idempotency.sql"
      - ".github/workflows/smm-wallet-exactly-once.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261012110000_rc458_smm_wallet_exactly_once.sql"
      - "supabase/tests/rc456_smm_service_role_fixture.sql"
      - "supabase/tests/rc458_smm_wallet_idempotency.sql"
      - ".github/workflows/smm-wallet-exactly-once.yml"
permissions:
  contents: read
jobs:
  wallet-exactly-once:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_smm_wallet_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_smm_wallet_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply disposable fixture and RC458 contract
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          export PGHOST=127.0.0.1 PGPORT=5432 PGUSER=postgres PGDATABASE=mantiqatix_smm_wallet_test
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rc456_smm_service_role_fixture.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261011010000_rc456_smm_service_role_access_boundary.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012100000_rc457_smm_order_idempotency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261012110000_rc458_smm_wallet_exactly_once.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/rc458_smm_wallet_idempotency.sql
