name: RC470 digital-page Paymob webhook forward repair

on:
  push:
    branches: ["security/rc470-digital-page-webhook-forward-repair-20261117"]
    paths:
      - "supabase/migrations/20261117020000_rc470_digital_page_webhook_forward_repair.sql"
      - "supabase/tests/rc431_digital_page_payment_fixture.sql"
      - "supabase/tests/rc470_live_rc424_processor_fixture.sql"
      - "supabase/tests/rc431_digital_page_payment_integration.sql"
      - "supabase/tests/rc470_digital_page_webhook_forward_repair.sql"
      - "scripts/validate-rc470-digital-page-webhook-forward-repair.mjs"
      - ".github/workflows/rc470-digital-page-webhook-forward-repair.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/20261117020000_rc470_digital_page_webhook_forward_repair.sql"
      - "supabase/tests/rc431_digital_page_payment_fixture.sql"
      - "supabase/tests/rc470_live_rc424_processor_fixture.sql"
      - "supabase/tests/rc431_digital_page_payment_integration.sql"
      - "supabase/tests/rc470_digital_page_webhook_forward_repair.sql"
      - "scripts/validate-rc470-digital-page-webhook-forward-repair.mjs"
      - ".github/workflows/rc470-digital-page-webhook-forward-repair.yml"

permissions:
  contents: read

jobs:
  rc470-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc470_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc470_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate RC470 source contract
        run: node scripts/validate-rc470-digital-page-webhook-forward-repair.mjs
      - name: Apply legacy fixture and RC424 body, then run RC470
        env:
          PGPASSWORD: postgres
        shell: bash
        run: |
          set -euo pipefail
          db="postgresql://postgres:postgres@127.0.0.1:5432/mantiqatix_rc470_test"
          psql "$db" -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role;"
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/tests/rc431_digital_page_payment_fixture.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/tests/rc470_live_rc424_processor_fixture.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/migrations/20261117020000_rc470_digital_page_webhook_forward_repair.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/tests/rc470_digital_page_webhook_forward_repair.sql
          psql "$db" -v ON_ERROR_STOP=1 -f supabase/tests/rc431_digital_page_payment_integration.sql
