name: RC922 CLI-generated medical provider-scope validation

on:
  push:
    branches:
      - "fix/rc922-medical-tenant-wide-provider-membership-20261123"
    paths:
      - ".github/workflows/rc922-cli-generation-proof.yml"
      - "scripts/generate-rc922-medical-appointment-migration.mjs"
      - "scripts/validate-rc922-medical-tenant-wide-provider-scope.mjs"
      - "supabase/tests/rc921_medical_status_fixture.sql"
      - "supabase/tests/rc921_medical_status_integration.sql"
      - "supabase/tests/rc922_medical_status_fixture.sql"
      - "supabase/tests/rc922_medical_status_integration.sql"
      - "scripts/test-rc921-medical-status-concurrency.sh"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  generate-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc922_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rc922_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate timestamped migration with Supabase CLI
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new rc922_medical_appointment_tenant_wide_provider_scope
          node scripts/generate-rc922-medical-appointment-migration.mjs
          migration="$(find supabase/migrations -maxdepth 1 -type f -name '*_rc922_medical_appointment_tenant_wide_provider_scope.sql' -print)"
          test -n "$migration"
          test "$(printf '%s\n' "$migration" | wc -l)" -eq 1
          echo "RC922_GENERATED_MIGRATION=$migration" >> "$GITHUB_ENV"

      - name: Validate RC922 source contract
        run: node scripts/validate-rc922-medical-tenant-wide-provider-scope.mjs

      - name: Run RC921 and RC922 behavior plus concurrency tests on disposable PostgreSQL 17
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d rc922_test -v ON_ERROR_STOP=1 -f supabase/tests/rc922_medical_status_fixture.sql
          psql -h 127.0.0.1 -U postgres -d rc922_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261123010000_rc921_medical_appointment_provider_state_machine.sql
          psql -h 127.0.0.1 -U postgres -d rc922_test -v ON_ERROR_STOP=1 -f "$RC922_GENERATED_MIGRATION"
          psql -h 127.0.0.1 -U postgres -d rc922_test -v ON_ERROR_STOP=1 -f supabase/tests/rc921_medical_status_integration.sql
          psql -h 127.0.0.1 -U postgres -d rc922_test -v ON_ERROR_STOP=1 -f supabase/tests/rc922_medical_status_integration.sql
          bash scripts/test-rc921-medical-status-concurrency.sh

      - name: Upload CLI-generated migration for reviewed source commit
        uses: actions/upload-artifact@v4
        with:
          name: rc922-cli-generated-migration-${{ github.run_id }}
          path: ${{ env.RC922_GENERATED_MIGRATION }}
          if-no-files-found: error
          retention-days: 3
