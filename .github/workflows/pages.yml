name: Deploy MantiqatiX Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check web/app.js
          node --check web/smm.js
          node --check web/home.js
          node scripts/validate-web-assets.mjs
          node scripts/validate-production-security.mjs
          node scripts/validate-auth-flow.mjs
          node scripts/validate-module-catalog.mjs
          node scripts/validate-public-web-secrets.mjs
      - name: Required web files
        run: |
          test -f web/index.html
          test -f web/config.js
          test -f web/styles.css
          test -f web/home.css
          test -f web/app.js
          test -f web/home.js
          test -f web/smm.html
          for asset in web/assets/activity/*.svg; do test -f "$asset"; done
          test -f web/smm.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          grep -q "mx-whatsapp-float" web/home.js
          grep -q "MNTY_SUPPORT" web/config.js
          grep -q "MNTY_SUPPORT" web/home.js

  deploy:
    needs: validate
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL" | grep -Eq "Mantiqati X|MNTY"
          for asset in config.js styles.css app.js home.js home.css manifest.webmanifest sw.js smm.html smm.js; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --head "$PAGE_URL$asset" >/dev/null
          done
          APP_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL/app.js")"
          HOME_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL/home.js")"
          echo "$APP_JS" | grep -q 'id="go-public-home"'
          echo "$HOME_JS" | grep -q "openPlatform"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}config.js" | grep -q "moyhiluyhjsujhwlyeuu.supabase.co"
          echo "Production smoke verification passed for $PAGE_URL"
