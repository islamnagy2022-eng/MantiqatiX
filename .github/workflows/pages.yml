name: Deploy MantiqatiX Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build and type-check replacement catalog frontend
        working-directory: apps/catalog-frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run lint
          npm run build
          test -s dist/index.html
          test -s dist/config.js
          test -d dist/assets
          grep -q '/MantiqatiX/catalog-app/assets/' dist/index.html
      - name: Smoke test production Google OAuth redirect
        working-directory: apps/catalog-frontend
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('public/config.js','utf8');const m=s.match(/supabaseUrl:\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          SUPABASE_ANON_KEY="$(node -e "const s=require('fs').readFileSync('public/config.js','utf8');const m=s.match(/supabaseKey:\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          REDIRECT_URL="https://islamnagy2022-eng.github.io/MantiqatiX/catalog-app/"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/catalog-oauth-smoke.json --dump-header /tmp/catalog-oauth-smoke.headers --write-out '%{http_code}' --get --data-urlencode 'provider=google' --data-urlencode "redirect_to=${REDIRECT_URL}" --header "apikey: ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/auth/v1/authorize")"
          if [ "${HTTP_CODE}" != "302" ] && [ "${HTTP_CODE}" != "303" ]; then
            echo "Google OAuth initiation failed with HTTP ${HTTP_CODE}"
            cat /tmp/catalog-oauth-smoke.json
            exit 1
          fi
          grep -Eiq '^location: https://accounts\.google\.com/' /tmp/catalog-oauth-smoke.headers
          echo "PRODUCTION_GOOGLE_OAUTH_HANDSHAKE=PASS"
            - name: Install web runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor Supabase browser SDK
        run: |
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Assert Pages deployment requires full production gate
        run: node scripts/validate-pages-production-deploy-gate.mjs
      - name: Production verification engine
        run: npm run verify:production
      - name: Syntax check
        run: |
          node --check web/rbac.js
          node --check web/feature-flags.js
          node --check web/app.js
          node scripts/validate-order-detail-contract.mjs
          node --check web/catalog-module.js
          node --check web/catalog/catalog.js
          ! grep -Eq "from\\(['\"]marketing_leads['\"]\\)\\.insert|from\\(['\"]marketing_leads['\"]\\).*\\.insert" web/app.js
          grep -q "sb.functions.invoke('marketing-lead-create'" web/app.js
          ! grep -REq "from\\(['\"](orders|payment_intents|user_memberships|notifications|marketing_projects|advertisements)['\"]\\)\\.(insert|update|delete)" web --include='*.js'
          ! grep -REq "from\\(['\"](orders|payment_intents|user_memberships|notifications|marketing_projects|advertisements)['\"]\\).*\\.(insert|update|delete)" web --include='*.js'
          ! grep -Eq 'signInWithOtp|verifyOtp|sendOtp|resend-otp|one-time-code|رمز التحقق|رمز البريد' web/app.js
          grep -q 'signInWithGoogle' web/app.js
          grep -q 'id="google-auth"' web/app.js
          node scripts/validate-smm-deferred-ui.mjs
          node --check web/home.js
          node --check web/android-parity-catalog.js
          node --check web/provider-onboarding-module.js
          node --check web/reverse-bidding-module.js
          node --check web/restaurant-module.js
          ! grep -REq 'customer@example\\.com|\\+201000000000' supabase/functions --include='*.ts'
          node --check web/sector-modules.js
          node --check web/operations-modules.js
          test -f supabase/functions/business-branch-admin/index.ts
          node scripts/validate-web-assets.mjs
          node scripts/validate-location-service.mjs
          node scripts/validate-preview-navigation.mjs
          node scripts/validate-public-brand.mjs
          node scripts/validate-production-security.mjs
          node scripts/validate-auth-flow.mjs
          node scripts/validate-platform-feature-flags.mjs
          node scripts/validate-module-catalog.mjs
          node scripts/validate-android-parity-catalog.mjs
          node scripts/validate-public-web-secrets.mjs
          node scripts/validate-web-config.mjs
          node scripts/validate-booking-payment-flow.mjs
          node scripts/validate-release-preflight.mjs
          node scripts/validate-admin-workspace.mjs
          node scripts/validate-rbac-workspace.mjs
          node scripts/validate-rbac-contract.mjs
          node scripts/validate-security-definer-contract.mjs
          node scripts/validate-mantigo-high-risk-definers.mjs
          node scripts/validate-mantigo-rate-limits.mjs
          node scripts/validate-mantigo-security-test-contract.mjs
          node scripts/validate-public-security-definer-search-path.mjs
          node scripts/validate-production-gate-contract.mjs
          node scripts/validate-production-migration-chain-gate.mjs
          node scripts/validate-finance-boundaries.mjs
          node scripts/validate-digital-pages-boundaries.mjs
          node scripts/test-digital-page-runtime.mjs
          node scripts/validate-1000-stage-gates.mjs
          node scripts/validate-sector-rendering.mjs
          node scripts/validate-module-runtime-coverage.mjs
          node scripts/validate-module-runtime-contracts.mjs
          node scripts/validate-provider-services-contract.mjs
          node scripts/validate-restaurant-module-contract.mjs
          node scripts/validate-sensitive-module-writes.mjs
          node scripts/validate-catalog-production-module.mjs
          node scripts/validate-owner-profile-persistence.mjs
          node scripts/validate-home-sponsored-ads.mjs
          node scripts/validate-home-production-content.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-verification/production-verification.json
          if-no-files-found: warn
      - name: Required web files
        run: |
          test -f web/index.html
          test -s web/vendor/supabase.js
          test -f web/config.js
          test -f web/rbac.js
          test -f web/feature-flags.js
          test -f web/styles.css
          test -f web/home.css
          test -f web/app.js
          test -f web/catalog/index.html
          test -f web/catalog/catalog.css
          test -f web/catalog/catalog.js
          test -f web/catalog-module.js
          test -f supabase/functions/catalog-admin/index.ts
          test -f supabase/functions/public-catalog/index.ts
          test -f supabase/migrations/20261026092940_rc107_catalog_manager_business_branch_scope.sql
          test -f web/home.js
          test -f web/smm.html
          test -f web/digital-page.html
          test -f web/digital-page.css
          test -f web/digital-page.js
          test -f web/digital-page-editor.html
          test -f web/digital-page-editor.css
          test -f web/digital-page-editor.js
          for asset in web/assets/activity/*.svg; do test -f "$asset"; done
          for asset in web/assets/activities/*.svg; do test -f "$asset"; done
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f web/android-parity-catalog.js
          test -f web/provider-onboarding-module.js
          test -f supabase/functions/api/index.ts
          test -f supabase/functions/order-create/index.ts
          test -f supabase/functions/order-status-update/index.ts
          test -f supabase/functions/mnty-registration-review/index.ts
          test -f supabase/functions/mnty-customer-registration/index.ts
          test -f supabase/functions/business-branch-admin/index.ts
          test -f supabase/functions/payment-intent/index.ts
          test -f supabase/functions/settlement-create/index.ts
          grep -q '/api/v1/catalog' supabase/functions/api/index.ts
          grep -q 'update_order_status_backend' supabase/functions/order-status-update/index.ts
          grep -q 'create_order_backend' supabase/functions/order-create/index.ts
          grep -q 'review_registration_request_atomic' supabase/functions/mnty-registration-review/index.ts
          grep -q 'activate_customer_registration_atomic' supabase/functions/mnty-customer-registration/index.ts
          grep -q 'business-branch-admin' web/provider-onboarding-module.js
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/payment-intent/index.ts
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/settlement-create/index.ts
          grep -q "mx-whatsapp-float" web/home.js
          grep -q "MNTY_SUPPORT" web/config.js
          grep -q "MNTY_SUPPORT" web/home.js
          grep -q "mx-catalog-branch" web/app.js
          grep -q "if(!branchId)" web/app.js
          grep -Fq 'branches: branches ?? []' supabase/functions/api/index.ts

      - name: Compose existing platform root with catalog as a separate module
        run: |
          set -euo pipefail
          SITE_DIR="\${RUNNER_TEMP}/mantiqatix-composed-site"
          rm -rf "\${SITE_DIR}"
          mkdir -p "\${SITE_DIR}/catalog-app"
          cp -a web/. "\${SITE_DIR}/"
          cp -a apps/catalog-frontend/dist/. "\${SITE_DIR}/catalog-app/"
          test -s "\${SITE_DIR}/index.html"
          test -s "\${SITE_DIR}/config.js"
          test -s "\${SITE_DIR}/catalog-app/index.html"
          grep -Fq 'home.js' "\${SITE_DIR}/index.html"
          grep -Fq '/MantiqatiX/catalog-app/assets/' "\${SITE_DIR}/catalog-app/index.html"
          grep -Fq '/MantiqatiX/config.js' "\${SITE_DIR}/catalog-app/index.html"
          echo "PAGES_COMPOSITION=PASS: existing platform root preserved; catalog mounted at /catalog-app/"
      - name: Upload composed MantiqatiX site
        uses: actions/upload-artifact@v4
        with:
          name: mantiqatix-composed-pages-site
          path: \${{RUNNER_TEMP}}/mantiqatix-composed-site
          if-no-files-found: error

  # This narrow path publishes only reviewed public-shell changes when the
  # broader production certification gate is still blocked. It cannot publish
  # backend, schema, auth, finance, payment, or workflow changes.
  validate_public_only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history for exact push diff
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require public-shell-only changed paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              web/home.js|web/home.css|web/index.html|web/sw.js|scripts/validate-home-production-content.mjs|scripts/validate-sector-rendering.mjs|scripts/validate-marketing-campaign-ui.mjs|web/preview/restaurant-order.html|scripts/validate-preview-navigation.mjs) ;;
              *) echo "Refusing public-only deployment because this path is outside the allowlist: $path"; exit 1 ;;
            esac
          done < /tmp/changed-files.txt
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install web runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor Supabase browser SDK
        run: |
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Validate public-shell-only release
        run: |
          set -euo pipefail
          node --check web/home.js
          node scripts/validate-home-production-content.mjs
          node scripts/validate-sector-rendering.mjs
          node scripts/validate-marketing-campaign-ui.mjs
          node scripts/validate-preview-navigation.mjs
          node scripts/validate-public-web-secrets.mjs
          node scripts/validate-web-config.mjs
          node scripts/validate-web-assets.mjs
          echo "PUBLIC_SHELL_RELEASE=PASS"
          echo "This gate does not certify backend, auth, database, payment, or financial production readiness."

  deploy:
    # The old MantiqatiX sources remain in /web; this publishes the new React frontend
    # to the single GitHub Pages slot, so the new UI becomes the production root.
    needs: [validate, validate_public_only]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.validate.result == 'success'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download the composed platform site
        uses: actions/download-artifact@v4
        with:
          name: mantiqatix-composed-pages-site
          path: ./site
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload replacement frontend as the Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify deployed primary frontend
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          ROOT_URL="${PAGE_URL%/}/"
          TMP_PAGE="$(mktemp)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${ROOT_URL}" -o "${TMP_PAGE}"
          grep -Fq "MantiqatiX | منصة الخدمات ومقدميها" "\${TMP_PAGE}"
          grep -Fq "home.js" "\${TMP_PAGE}"
          grep -Fq "config.js" "\${TMP_PAGE}"
          CATALOG_URL="\${ROOT_URL}catalog-app/"
          TMP_CATALOG="$(mktemp)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "\${CATALOG_URL}" -o "\${TMP_CATALOG}"
          grep -Fq "/MantiqatiX/catalog-app/assets/" "\${TMP_CATALOG}"
          grep -Fq "/MantiqatiX/config.js" "\${TMP_CATALOG}"
          CONFIG_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "\${ROOT_URL}config.js")"
          grep -Fq "moyhiluyhjsujhwlyeuu.supabase.co" <<<"\${CONFIG_JS}"
          JS_ASSET="$(grep -oE '/MantiqatiX/catalog-app/assets/[^" ]+\.js' "\${TMP_CATALOG}" | head -n 1)"
          CSS_ASSET="$(grep -oE '/MantiqatiX/catalog-app/assets/[^" ]+\.css' "\${TMP_CATALOG}" | head -n 1)"
          test -n "\${JS_ASSET}"
          test -n "\${CSS_ASSET}"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --head "\${PAGE_URL%/}/\${JS_ASSET#/MantiqatiX/}" >/dev/null
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --head "\${PAGE_URL%/}/\${CSS_ASSET#/MantiqatiX/}" >/dev/null
          echo "MANTIQATIX_ROOT_AND_CATALOG_MODULE_DEPLOY=PASS: \${ROOT_URL}"
