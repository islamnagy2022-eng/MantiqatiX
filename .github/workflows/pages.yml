name: Deploy MantiqatiX Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check web/app.js
          node --check web/smm.js
          node scripts/validate-web-assets.mjs
          node scripts/validate-production-security.mjs
      - name: Required web files
        run: |
          test -f web/index.html
          test -f web/config.js
          test -f web/styles.css
          test -f web/app.js
          test -f web/smm.html
          test -f web/smm.js
          test -f web/manifest.webmanifest
          test -f web/sw.js

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL" | grep -q "MNTY"
