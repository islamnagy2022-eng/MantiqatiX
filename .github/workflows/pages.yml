name: Deploy MantiqatiX Web
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install web runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor Supabase browser SDK
        run: |
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Production verification engine
        run: npm run verify:production
      - name: Syntax check
        run: |
          node --check web/rbac.js
          node --check web/app.js
          ! grep -Eq "from\\(['\"]marketing_leads['\"]\\)\\.insert|from\\(['\"]marketing_leads['\"]\\).*\\.insert" web/app.js
          grep -q "sb.functions.invoke('marketing-lead-create'" web/app.js
          ! grep -REq "from\\(['\"](orders|payment_intents|user_memberships|notifications|marketing_projects|advertisements)['\"]\\)\\.(insert|update|delete)" web --include='*.js'
          ! grep -REq "from\\(['\"](orders|payment_intents|user_memberships|notifications|marketing_projects|advertisements)['\"]\\).*\\.(insert|update|delete)" web --include='*.js'
          ! grep -Eq 'signInWithOtp|verifyOtp|sendOtp|resend-otp|one-time-code|رمز التحقق|رمز البريد' web/app.js
          grep -q 'signInWithGoogle' web/app.js
          grep -q 'id="google-auth"' web/app.js
          node --check web/smm.js
          node --check web/home.js
          node --check web/android-parity-catalog.js
          node --check web/provider-onboarding-module.js
          node --check web/reverse-bidding-module.js
          node --check web/restaurant-module.js
          node --check web/catalog-experience-engine.js
          node --check web/digital-page-self-service.js
          node --check web/digital-page-editor.js
          node --check web/digital-page.js
          node --check web/marketing-services.js
          ! grep -REq 'customer@example\\.com|\\+201000000000' supabase/functions --include='*.ts'
          node --check web/sector-modules.js
          node --check web/operations-modules.js
          test -f supabase/functions/business-branch-admin/index.ts
          node scripts/validate-web-assets.mjs
          node scripts/validate-location-service.mjs
          node scripts/validate-preview-navigation.mjs
          node scripts/validate-public-brand.mjs
          node scripts/validate-production-security.mjs
          node scripts/validate-auth-flow.mjs
          node scripts/validate-module-catalog.mjs
          node scripts/validate-android-parity-catalog.mjs
          node scripts/validate-public-web-secrets.mjs
          node scripts/validate-web-config.mjs
          node scripts/validate-booking-payment-flow.mjs
          node scripts/validate-release-preflight.mjs
          node scripts/validate-admin-workspace.mjs
          node scripts/validate-rbac-workspace.mjs
          node scripts/validate-rbac-contract.mjs
          node scripts/validate-security-definer-contract.mjs
          node scripts/validate-mantigo-high-risk-definers.mjs
          node scripts/validate-mantigo-rate-limits.mjs
          node scripts/validate-mantigo-security-test-contract.mjs
          node scripts/validate-public-security-definer-search-path.mjs
          node scripts/validate-production-gate-contract.mjs
          node scripts/validate-production-migration-chain-gate.mjs
          node scripts/validate-finance-boundaries.mjs
          node scripts/validate-digital-pages-boundaries.mjs
          node scripts/validate-digital-page-manual-activation.mjs
          node scripts/validate-digital-page-menu-subscription.mjs
          node scripts/validate-rc571-menu-scope-bypass-fix.mjs
          node scripts/validate-catalog-experience-engine.mjs
          node scripts/validate-subscription-reminders.mjs
          node scripts/validate-paymob-launch-gate.mjs
          node scripts/validate-marketing-services-page.mjs
          node scripts/test-digital-page-runtime.mjs
          node scripts/validate-1000-stage-gates.mjs
          node scripts/validate-sector-rendering.mjs
          node scripts/validate-module-runtime-coverage.mjs
          node scripts/validate-module-runtime-contracts.mjs
          node scripts/validate-provider-services-contract.mjs
          node scripts/validate-restaurant-module-contract.mjs
          node scripts/validate-restaurant-menu-whatsapp-sync.mjs
          node scripts/validate-sensitive-module-writes.mjs
          node scripts/validate-home-sponsored-ads.mjs
          node scripts/validate-home-production-content.mjs
          node scripts/validate-layer-l1-homepage.mjs
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-verification/production-verification.json
          if-no-files-found: warn
      - name: Required web files
        run: |
          test -f web/index.html
          test -s web/vendor/supabase.js
          test -f web/config.js
          test -f web/rbac.js
          test -f web/styles.css
          test -f web/home.css
          test -f web/app.js
          test -f web/home.js
          test -f web/smm.html
          test -f web/digital-page.html
          test -f web/digital-page.css
          test -f web/digital-page.js
          test -f web/digital-page-editor.html
          test -f web/digital-page-editor.css
          test -f web/digital-page-self-service.html
          test -f web/digital-page-self-service.css
          test -f web/catalog-experience-engine.js
          test -f web/digital-page-self-service.js
          test -f scripts/validate-catalog-experience-engine.mjs
          test -f web/marketing-services.html
          test -f web/marketing-services.css
          test -f web/marketing-services.js
          test -f web/digital-page-editor.js
          for asset in web/assets/activity/*.svg; do test -f "$asset"; done
          for asset in web/assets/activities/*.svg; do test -f "$asset"; done
          test -f web/smm.js
          test -f web/manifest.webmanifest
          test -f web/sw.js
          test -f web/android-parity-catalog.js
          test -f web/provider-onboarding-module.js
          test -f supabase/functions/api/index.ts
          test -f supabase/functions/order-create/index.ts
          test -f supabase/functions/order-status-update/index.ts
          test -f supabase/functions/mnty-registration-review/index.ts
          test -f supabase/functions/mnty-customer-registration/index.ts
          test -f supabase/functions/business-branch-admin/index.ts
          test -f supabase/functions/payment-intent/index.ts
          test -f supabase/functions/settlement-create/index.ts
          grep -q '/api/v1/catalog' supabase/functions/api/index.ts
          grep -q 'update_order_status_backend' supabase/functions/order-status-update/index.ts
          grep -q 'create_order_backend' supabase/functions/order-create/index.ts
          grep -q 'review_registration_request_atomic' supabase/functions/mnty-registration-review/index.ts
          grep -q 'activate_customer_registration_atomic' supabase/functions/mnty-customer-registration/index.ts
          grep -q 'business-branch-admin' web/provider-onboarding-module.js
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/payment-intent/index.ts
          grep -q 'SUPABASE_SERVICE_ROLE_KEY' supabase/functions/settlement-create/index.ts
          grep -q "mx-whatsapp-float" web/home.js
          grep -q "MNTY_SUPPORT" web/config.js
          grep -q "MNTY_SUPPORT" web/home.js
          grep -q "mx-catalog-branch" web/app.js
          grep -q "if(!branchId)" web/app.js
          grep -q "branches: branches ?? \[\]" supabase/functions/api/index.ts

  # This narrow path publishes only reviewed public-shell changes when the
  # broader production certification gate is still blocked. It cannot publish
  # backend, schema, auth, finance, payment, or workflow changes.
  validate_public_only:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout full history for exact push diff
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require public-shell-only changed paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > /tmp/changed-files.txt
          test -s /tmp/changed-files.txt
          cat /tmp/changed-files.txt
          while IFS= read -r path; do
            case "$path" in
              web/home.js|web/home.css|web/index.html|web/sw.js|scripts/validate-home-production-content.mjs|scripts/validate-sector-rendering.mjs|scripts/validate-marketing-campaign-ui.mjs|web/preview/restaurant-order.html|scripts/validate-preview-navigation.mjs) ;;
              *) echo "Refusing public-only deployment because this path is outside the allowlist: $path"; exit 1 ;;
            esac
          done < /tmp/changed-files.txt
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install web runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor Supabase browser SDK
        run: |
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Validate public-shell-only release
        run: |
          set -euo pipefail
          node --check web/home.js
          node scripts/validate-home-production-content.mjs
          node scripts/validate-sector-rendering.mjs
          node scripts/validate-marketing-campaign-ui.mjs
          node scripts/validate-preview-navigation.mjs
          node scripts/validate-public-web-secrets.mjs
          node scripts/validate-web-config.mjs
          node scripts/validate-web-assets.mjs
          echo "PUBLIC_SHELL_RELEASE=PASS"
          echo "This gate does not certify backend, auth, database, payment, or financial production readiness."

  deploy:
    # Never publish a feature branch by manually dispatching the production Pages workflow.
    needs: [validate, validate_public_only]
    if: always() && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (needs.validate.result == 'success' || needs.validate_public_only.result == 'success')
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install web runtime dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Vendor Supabase browser SDK
        run: |
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./web
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          TMP_PAGE="$(mktemp)"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL" -o "$TMP_PAGE"
          grep -Fq "MantiqatiX" "$TMP_PAGE"
          for asset in config.js rbac.js vendor/supabase.js styles.css app.js android-parity-catalog.js provider-onboarding-module.js home.js home.css manifest.webmanifest sw.js smm.html smm.js digital-page.html digital-page.css digital-page.js digital-page-editor.html digital-page-editor.css digital-page-editor.js digital-page-self-service.html digital-page-self-service.css digital-page-self-service.js marketing-services.html marketing-services.css; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --head "$PAGE_URL$asset" >/dev/null
          done
          APP_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL/app.js")"
          HOME_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "$PAGE_URL/home.js")"
          CONFIG_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}config.js")"
          DIGITAL_PAGE_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page.html")"
          DIGITAL_PAGE_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page.js")"
          DIGITAL_EDITOR_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page-editor.html")"
          DIGITAL_EDITOR_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page-editor.js")"
          DIGITAL_SELF_SERVICE_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page-self-service.html")"
          DIGITAL_SELF_SERVICE_JS="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}digital-page-self-service.js")"
          MARKETING_SERVICES_HTML="$(curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}marketing-services.html")"
          grep -Fq 'id="go-public-home"' <<<"$APP_JS"
          grep -Fq "mnty-customer-registration" <<<"$APP_JS"
          grep -Fq "tenant_id:'MNTY-PLATFORM'" <<<"$APP_JS"
          grep -Fq "openPlatform" <<<"$HOME_JS"
          grep -Fq "mx-category-filter-input" <<<"$HOME_JS"
          grep -Fq "mx-category-service-details" <<<"$HOME_JS"
          grep -Fq "PUBLIC_CATEGORY_ALIASES" <<<"$HOME_JS"
          grep -Fq "mx-profile-sector-services" <<<"$HOME_JS"
          grep -Eq 'home\.js\?v=[A-Za-z0-9._-]+' "$TMP_PAGE"
          grep -Eq 'home\.css\?v=[A-Za-z0-9._-]+' "$TMP_PAGE"
          grep -Fq 'app.js?v=catalog-first-1' "$TMP_PAGE"
          grep -Fq 'sw.js?v=mnty-web-v142-https-images' "$TMP_PAGE"
          grep -Fq "moyhiluyhjsujhwlyeuu.supabase.co" <<<"$CONFIG_JS"
          grep -Fq "MNTY_DATA_SOURCE='WEBSITE_SUPABASE'" <<<"$CONFIG_JS"
          PREVIEW_ENTRY="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL%/}/preview/")"
          PREVIEW_DASHBOARD="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL%/}/preview/dashboard.html")"
          PREVIEW_RESTAURANTS="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL%/}/preview/restaurants.html")"
          PREVIEW_RESTAURANT_ORDER="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL%/}/preview/restaurant-order.html?restaurant=zaeem")"
          PREVIEW_HOME="$(curl --fail --silent --show-error --retry 5 --retry-delay 3 "${PAGE_URL%/}/preview/index.html")"
          # The preview root is the actual interactive demo homepage, not a redirect stub.
          grep -Fq 'معاينة تفاعلية' <<<"$PREVIEW_ENTRY"
          grep -Fq 'href="dashboard.html"' <<<"$PREVIEW_ENTRY"
          grep -Fq 'كل موديولات MantiqatiX' <<<"$PREVIEW_DASHBOARD"
          grep -Fq 'وضع تجريبي فقط' <<<"$PREVIEW_ENTRY"
          grep -Fq 'مطاعم وكافيهات' <<<"$PREVIEW_HOME"
          grep -Fq "if(selected==='FOOD'){window.location.href='restaurants.html';return;}" <<<"$PREVIEW_HOME"
          grep -Fq 'مطعم الزعيم' <<<"$PREVIEW_RESTAURANTS"
          grep -Fq 'مطعم أولاد جابر' <<<"$PREVIEW_RESTAURANTS"
          grep -Fq 'الأصلي' <<<"$PREVIEW_RESTAURANTS"
          grep -Fq 'تأكيد الطلب التجريبي' <<<"$PREVIEW_RESTAURANT_ORDER"
          grep -Fq 'digital-page.js' <<<"$DIGITAL_PAGE_HTML"
          grep -Fq 'digital-page.css' <<<"$DIGITAL_PAGE_HTML"
          grep -Fq "eq('status','PUBLISHED')" <<<"$DIGITAL_PAGE_JS"
          grep -Fq 'fulfill_digital_page_publish' <<<"$DIGITAL_EDITOR_JS"
          grep -Fq 'digital-page-editor.js' <<<"$DIGITAL_EDITOR_HTML"
          grep -Fq 'digital-page-self-service.js' <<<"$DIGITAL_SELF_SERVICE_HTML"
          grep -Fq 'لن يتم تحصيل أي دفع إلكتروني من هذه الصفحة حاليًا' <<<"$DIGITAL_SELF_SERVICE_JS"
          ! grep -Eq 'digital-page-payment-intent|checkoutUrl' <<<"$DIGITAL_SELF_SERVICE_JS"
          grep -Fq "sb.functions.invoke('digital-page-order-create'" <<<"$DIGITAL_SELF_SERVICE_JS"
          grep -Fq 'mnty_admin_activate_digital_page_subscription' supabase/migrations/20261025200000_rc568_digital_page_manual_activation.sql
          grep -Fq 'اطلب المنتج عبر واتساب' <<<"$DIGITAL_PAGE_JS"
          grep -Fq 'الخدمات التسويقية تحت الإنشاء' <<<"$MARKETING_SERVICES_HTML"
          grep -Fq 'noindex,nofollow' <<<"$MARKETING_SERVICES_HTML"
          ! grep -Fq 'id="request-form"' <<<"$MARKETING_SERVICES_HTML"
          ! grep -Fq 'marketing-services.js' <<<"$MARKETING_SERVICES_HTML"
          ! grep -Fq 'href="marketing-services.html"' <<<"$APP_JS"
          ! grep -Fq 'href="marketing-services.html"' <<<"$HOME_JS"
          echo "Production smoke verification passed for $PAGE_URL"
