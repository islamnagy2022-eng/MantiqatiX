name: RC463 Platform Admin Live Hardening

on:
  pull_request:
    paths:
      - "supabase/migrations/20261113214500_rc463_platform_admin_live_registry_hardening.sql"
      - "supabase/tests/rc463_platform_admin_live_baseline.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_fixture.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_integration.sql"
      - "scripts/validate-rc463-platform-admin-live-hardening.mjs"
      - ".github/workflows/rc463-platform-admin-live-hardening.yml"
  push:
    branches:
      - "security/platform-admin-live-hardening-20261113"
    paths:
      - "supabase/migrations/20261113214500_rc463_platform_admin_live_registry_hardening.sql"
      - "supabase/tests/rc463_platform_admin_live_baseline.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_fixture.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_integration.sql"
      - "scripts/validate-rc463-platform-admin-live-hardening.mjs"
      - ".github/workflows/rc463-platform-admin-live-hardening.yml"

permissions:
  contents: read

jobs:
  rc463-platform-admin-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc463_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc463_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify source contract
        run: node scripts/validate-rc463-platform-admin-live-hardening.mjs
      - name: Reproduce the live authorization gap, then apply RC463 and test the hardened boundary
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc449_mantigo_platform_admin_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/tests/rc463_platform_admin_live_baseline.sql "$pg_container:/tmp/live-baseline.sql"
          docker cp supabase/migrations/20261113214500_rc463_platform_admin_live_registry_hardening.sql "$pg_container:/tmp/rc463.sql"
          docker cp supabase/tests/rc449_mantigo_platform_admin_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc463_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc463_test -v ON_ERROR_STOP=1 -f /tmp/live-baseline.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc463_test -v ON_ERROR_STOP=1 -f /tmp/rc463.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc463_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
