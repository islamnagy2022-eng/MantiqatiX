name: MantiGO Open Ride Privacy Boundary
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mantigo-open-ride-privacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc443_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc443_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Run RC443 privacy integration tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc443_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc443_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker cp supabase/tests/rc443_mantigo_open_ride_fixture.sql "$pg_container:/tmp/rc443_fixture.sql"
          docker cp supabase/migrations/20261010060000_rc443_mantigo_open_ride_privacy_boundary.sql "$pg_container:/tmp/rc443_migration.sql"
          docker cp supabase/tests/rc443_mantigo_open_ride_integration.sql "$pg_container:/tmp/rc443_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc443_test -v ON_ERROR_STOP=1 -f /tmp/rc443_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc443_test -v ON_ERROR_STOP=1 -f /tmp/rc443_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc443_test -v ON_ERROR_STOP=1 -f /tmp/rc443_test.sql
