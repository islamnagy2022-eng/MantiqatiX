name: MantiGO Open Ride Privacy Boundary
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  mantigo-open-ride-privacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc446_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc446_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Validate RC477 customer bid contact privacy contract
        run: node scripts/validate-rc477-mantigo-customer-bid-contact-privacy.mjs
      - name: Validate RC478 open-ride forward privacy contract
        run: node scripts/validate-rc478-mantigo-open-ride-forward-privacy.mjs
      - name: Run RC446, RC477 and RC478 privacy integration tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker cp supabase/tests/rc446_mantigo_open_ride_fixture.sql "$pg_container:/tmp/rc446_fixture.sql"
          docker cp supabase/migrations/20261010060000_rc446_mantigo_open_ride_privacy_boundary.sql "$pg_container:/tmp/rc446_migration.sql"
          docker cp supabase/tests/rc446_mantigo_open_ride_integration.sql "$pg_container:/tmp/rc446_test.sql"
          docker cp supabase/migrations/20261118060000_rc477_mantigo_customer_bid_contact_privacy.sql "$pg_container:/tmp/rc477_migration.sql"
          docker cp supabase/tests/rc477_mantigo_customer_bid_contact_privacy_integration.sql "$pg_container:/tmp/rc477_test.sql"
          docker cp supabase/migrations/20261118070000_rc478_mantigo_open_ride_privacy_forward_repair.sql "$pg_container:/tmp/rc478_migration.sql"
          docker cp supabase/tests/rc478_mantigo_open_ride_forward_privacy_integration.sql "$pg_container:/tmp/rc478_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc446_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc446_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc446_test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc477_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc477_test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc478_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc446_test -v ON_ERROR_STOP=1 -f /tmp/rc478_test.sql
