  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/baselines/production_schema_snapshot.sql"
      - "supabase/tests/baselines/production_schema_snapshot.manifest.json"
      - "supabase/tests/baselines/production_schema_migration_versions.txt"
      - "supabase/tests/baselines/production_data_prerequisites_fixture.sql"
      - "supabase/tests/baselines/production_live_trigger_overlay_fixture.sql"
      - "supabase/tests/baselines/production_live_order_status_history_acl_overlay_fixture.sql"
      - "supabase/tests/baselines/production_live_business_branch_anon_acl_overlay_fixture.sql"
      - "supabase/tests/baselines/rc484_live_storage_policy_overlay_fixture.sql"
      - "supabase/tests/baselines/tenant_isolation_two_tenant_fixture.sql"
