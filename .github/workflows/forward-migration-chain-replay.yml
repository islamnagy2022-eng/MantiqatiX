      - "supabase/tests/baselines/rc469_live_shared_helper_search_path_overlay.sql"
      - "scripts/validate-rc469-shared-platform-admin-caller-search-path.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/production/verify-production.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - "scripts/validate-r7-platform-admin-migration.mjs"
      - "scripts/validate-rc476-captain-earnings-live-columns.mjs"
      - "scripts/validate-mantigo-high-risk-definers.mjs"
      - "scripts/validate-rc482-legal-platform-admin-registry.mjs"
      - "scripts/validate-rc483-atomic-legal-cms-create-audit.mjs"
      - "scripts/validate-rc485-catalog-rpc-registry-root.mjs"
      - "supabase/tests/rc485_catalog_rpc_registry_root_integration.sql"
      - "supabase/tests/rc482_legal_platform_admin_registry_fixture.sql"
      - "supabase/tests/rc482_legal_platform_admin_registry_integration.sql"
      - "supabase/tests/rc483_atomic_legal_cms_create_audit_fixture.sql"
      - "supabase/tests/rc483_atomic_legal_cms_create_audit_integration.sql"
      - "docs/release/production-migration-reconciliation.json"
      - ".github/workflows/forward-migration-chain-replay.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  replay-forward-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout candidate source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Validate captured checkpoint and static schema inventory
        run: node scripts/tests/production-schema-baseline-static-audit.mjs

      - name: Validate RC467 commission authorization contract
        run: node scripts/validate-rc467-commission-scope.mjs

      - name: Validate RC469 shared caller search_path contract
        run: node scripts/validate-rc469-shared-platform-admin-caller-search-path.mjs

      - name: Validate strict Production release gate and exact 72-version contract
        run: node scripts/validate-production-migration-chain-gate.mjs

      - name: Validate MantiGO platform-admin and financial source contracts
        run: |
          node scripts/validate-r7-platform-admin-migration.mjs
          node scripts/validate-rc476-captain-earnings-live-columns.mjs
          node scripts/validate-mantigo-high-risk-definers.mjs

      - name: Validate Legal platform-admin and atomic audit source contracts
        run: |
          node scripts/validate-rc482-legal-platform-admin-registry.mjs
          node scripts/validate-rc483-atomic-legal-cms-create-audit.mjs

      - name: Validate RC485 catalog RPC registry-root authorization contract
        run: node scripts/validate-rc485-catalog-rpc-registry-root.mjs

      - name: Validate RC486 catalog price version serialization contract
        run: node scripts/validate-rc486-catalog-price-version-serialization.mjs

      - name: Validate RC487 SMM first-user bootstrap removal contract
        run: node scripts/validate-rc487-smm-first-user-bootstrap-removal.mjs

      - name: Validate RC488 Storage anonymous Auth write-guard contract
        run: node scripts/validate-rc488-storage-anonymous-auth-write-guard.mjs

      - name: Validate RC489 financial anonymous Auth read guard contract
        run: node scripts/validate-rc489-financial-anonymous-auth-read-guard.mjs

      - name: Validate RC490 medical anonymous Auth read guard contract
        run: node scripts/validate-rc490-medical-anonymous-auth-read-guard.mjs

      - name: Validate RC491 support anonymous Auth boundary contract
        run: node scripts/validate-rc491-support-anonymous-auth-boundary.mjs

      - name: Validate RC492 InDrive anonymous Auth write guard contract
        run: node scripts/validate-rc492-indrive-anonymous-auth-write-guard.mjs

      - name: Start isolated Supabase instance with no repository migrations
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          echo "MNTY_REPLAY_TEST_DIR=$test_dir" >> "$GITHUB_ENV"
          cd "$test_dir"
          supabase init
          supabase start -x studio,edge-runtime,logflare,vector

      - name: Restore checkpoint and apply every later migration in timestamp order
        shell: bash
        run: |
          set -euo pipefail
          db_url="$(cd "$MNTY_REPLAY_TEST_DIR" && supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$db_url"
          case "$db_url" in
            *127.0.0.1*|*localhost*) ;;
            *) echo "Refusing forward replay against a non-local database URL." >&2; exit 1 ;;
          esac
          checkpoint="$(node -e 'const m=require("./supabase/tests/baselines/production_schema_snapshot.manifest.json"); process.stdout.write(m.last_applied_migration_version)')"
          [[ "$checkpoint" =~ ^[0-9]{14}$ ]]
          echo "BASELINE_CHECKPOINT=$checkpoint"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/production_schema_snapshot.sql

          echo "RESTORE_SCHEMA_ONLY_CHECKPOINT_DATA_PREREQUISITES"
          psql "$db_url" -v ON_ERROR_STOP=1 -v mantiqati_disposable=on -f supabase/tests/baselines/production_data_prerequisites_fixture.sql

          migration_count=0
          while IFS= read -r migration; do
            filename="$(basename "$migration")"
            version="${filename%%_*}"
            [[ "$version" =~ ^[0-9]{14}$ ]] || { echo "Invalid migration version: $filename" >&2; exit 1; }
            if [[ "$version" > "$checkpoint" ]]; then
              if [[ "$filename" == "20261031100000_rc463_trigger_only_security_definer_acl.sql" ]]; then
                echo "RESTORE_TEST_ONLY_KNOWN_LIVE_TRIGGER_OVERLAY"
                psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/production_live_trigger_overlay_fixture.sql
              fi
              if [[ "$filename" == "20261114010000_rc465_orders_read_scope_hardening.sql" ]]; then
                echo "RESTORE_TEST_ONLY_KNOWN_LIVE_ORDER_HISTORY_ACL_OVERLAY"
                psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/production_live_order_status_history_acl_overlay_fixture.sql
              fi
              if [[ "$filename" == "20261114020000_rc466_business_branch_read_scope_hardening.sql" ]]; then
                echo "RESTORE_TEST_ONLY_KNOWN_LIVE_BUSINESS_BRANCH_ANON_ACL_OVERLAY"
                psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/production_live_business_branch_anon_acl_overlay_fixture.sql
              fi
              if [[ "$filename" == "20261117010000_rc469_shared_platform_admin_caller_search_path.sql" ]]; then
                echo "RESTORE_TEST_ONLY_KNOWN_LIVE_SHARED_CALLER_SEARCH_PATH_AND_ACL_OVERLAY"
                psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/rc469_live_shared_helper_search_path_overlay.sql
              fi
              if [[ "$filename" == "20261119040000_rc484_registry_backed_is_platform_admin.sql" ]]; then
                echo "RESTORE_TEST_ONLY_KNOWN_LIVE_RC484_STORAGE_POLICY_OVERLAY"
                psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/baselines/rc484_live_storage_policy_overlay_fixture.sql
              fi
              echo "REPLAY_MIGRATION=$filename"
              psql "$db_url" -v ON_ERROR_STOP=1 -f "$migration"
              migration_count=$((migration_count + 1))
            fi
          done < <(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -print | sort)

          test "$migration_count" -gt 0
          echo "FORWARD_MIGRATIONS_APPLIED=$migration_count"

          echo "RC485_CATALOG_RPC_REGISTRY_ROOT_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc485_catalog_rpc_registry_root_integration.sql

          echo "RC486_CATALOG_PRICE_VERSION_SERIALIZATION_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc486_catalog_price_version_serialization_integration.sql

          echo "RC487_SMM_FIRST_USER_BOOTSTRAP_REMOVAL_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc487_smm_first_user_bootstrap_removal_integration.sql

          echo "RC488_STORAGE_ANONYMOUS_AUTH_WRITE_GUARD_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc488_storage_anonymous_auth_write_guard_integration.sql

          echo "RC489_FINANCIAL_ANONYMOUS_AUTH_READ_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc489_financial_anonymous_auth_read_integration.sql

          echo "RC490_MEDICAL_ANONYMOUS_AUTH_READ_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc490_medical_anonymous_auth_read_integration.sql

          echo "RC491_SUPPORT_ANONYMOUS_AUTH_BOUNDARY_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc491_support_anonymous_auth_boundary_integration.sql

          echo "RC492_INDRIVE_ANONYMOUS_AUTH_WRITE_GUARD_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc492_indrive_anonymous_auth_write_guard_integration.sql

          echo "RC117_DEFAULT_IMAGES_AND_ACTIVITY_ADMIN_CONTRACT"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc117_default_images_and_activity_admin_contract.sql

          echo "OWNER_PROFILE_PERSISTENCE_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/owner_profile_persistence_integration.sql

          echo "RC455_COMMISSION_PREVIEW_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc455_commission_preview_integration.sql

          echo "RC456_COMMISSION_RESOLUTION_PREVIEW_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc456_commission_resolution_preview_integration.sql

          echo "RC467_COMMISSION_SCOPE_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc467_commission_scope_integration.sql

          echo "RC469_SHARED_PLATFORM_ADMIN_CALLER_SEARCH_PATH"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc469_shared_platform_admin_caller_search_path.sql

          echo "RC468_DIGITAL_PAGE_PAYMENT_CLAIM_INTEGRATION"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc468_digital_page_payment_claim_integration.sql

          echo "RC470_DIGITAL_PAGE_WEBHOOK_FORWARD_REPAIR"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/rc470_digital_page_webhook_forward_repair.sql

          psql "$db_url" -v ON_ERROR_STOP=1 -v mantiqati_disposable=on -f supabase/tests/baselines/tenant_isolation_two_tenant_fixture.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -f scripts/verify-tenant-isolation.sql

      - name: Stop isolated Supabase instance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${MNTY_REPLAY_TEST_DIR:-}" ] && [ -d "$MNTY_REPLAY_TEST_DIR" ]; then
            cd "$MNTY_REPLAY_TEST_DIR"
            supabase stop --no-backup || true
          fi