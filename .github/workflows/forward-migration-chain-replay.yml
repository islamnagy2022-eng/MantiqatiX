      - "supabase/tests/rc483_atomic_legal_cms_create_audit_integration.sql"
      # Keep RC488 static validator and both fixture contracts in the PR replay trigger.
      - "scripts/validate-rc488-storage-anonymous-auth-write-guard.mjs"
      - "supabase/tests/rc488_storage_anonymous_auth_write_guard_fixture.sql"
      - "supabase/tests/rc488_storage_anonymous_auth_write_guard_integration.sql"
