name: ERP Runtime Gateway Integration
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/api/index.ts"
      - "web/app.js"
      - "web/operations-modules.js"
      - "scripts/validate-backend-only-module-boundary.mjs"
      - "scripts/validate-cash-only-launch-flow.mjs"
      - "supabase/migrations/20261020150000_rc461_erp_runtime_service_gateway.sql"
      - "supabase/tests/rc461_erp_runtime_gateway_*.sql"
      - "supabase/migrations/20261020160000_rc463_erp_supplier_master.sql"
      - "supabase/migrations/20261020170000_rc464_erp_supplier_update_backend.sql"
      - "supabase/migrations/20261020180000_rc465_erp_purchase_order_lines.sql"
      - "supabase/tests/rc465_erp_purchase_order_lines_integration.sql"
      - "supabase/tests/rc464_erp_supplier_update_integration.sql"
      - "supabase/migrations/20261020180000_rc465_erp_purchase_order_lines.sql"
      - "supabase/tests/rc465_erp_purchase_order_lines_integration.sql"
      - "supabase/tests/rc463_erp_supplier_master_integration.sql"
      - ".github/workflows/erp-runtime-gateway.yml"
  pull_request:
    branches: [main, "fix/medical-appointment-state-machine-20261019"]
    paths:
      - "supabase/functions/erp-runtime/**"
      - "supabase/functions/api/index.ts"
      - "supabase/migrations/20261020150000_rc461_erp_runtime_service_gateway.sql"
      - "supabase/tests/rc461_erp_runtime_gateway_*.sql"
      - "supabase/migrations/20261020160000_rc463_erp_supplier_master.sql"
      - "supabase/tests/rc463_erp_supplier_master_integration.sql"
      - ".github/workflows/erp-runtime-gateway.yml"
permissions:
  contents: read
jobs:
  erp-runtime-gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc461_erp_gateway_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc461_erp_gateway_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check authenticated ERP API gateway
        run: deno check --no-lock supabase/functions/api/index.ts
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply gateway fixture and migration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc461_erp_runtime_gateway_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261020150000_rc461_erp_runtime_service_gateway.sql "$pg_container:/tmp/migration.sql"
          docker cp supabase/tests/rc461_erp_runtime_gateway_integration.sql "$pg_container:/tmp/test.sql"
          docker cp supabase/migrations/20261020160000_rc463_erp_supplier_master.sql "$pg_container:/tmp/rc463.sql"
          docker cp supabase/tests/rc463_erp_supplier_master_integration.sql "$pg_container:/tmp/rc463-test.sql"
          docker cp supabase/migrations/20261020170000_rc464_erp_supplier_update_backend.sql "$pg_container:/tmp/rc464.sql"
          docker cp supabase/tests/rc464_erp_supplier_update_integration.sql "$pg_container:/tmp/rc464-test.sql"
          docker cp supabase/migrations/20261020180000_rc465_erp_purchase_order_lines.sql "$pg_container:/tmp/rc465.sql"
          docker cp supabase/tests/rc465_erp_purchase_order_lines_integration.sql "$pg_container:/tmp/rc465-test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc463.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc464.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc465.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc463-test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc464-test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc461_erp_gateway_test -v ON_ERROR_STOP=1 -f /tmp/rc465-test.sql
