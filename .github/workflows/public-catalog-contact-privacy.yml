name: Public Catalog Contact Privacy
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/functions/_shared/public-contact-visibility.mjs"
      - "supabase/functions/_shared/public-contact-visibility.test.mjs"
      - "supabase/functions/public-catalog/index.ts"
      - "supabase/functions/public-catalog-directory/index.ts"
      - "apps/catalog-frontend/src/lib/production.ts"
      - "scripts/validate-public-contact-visibility.mjs"
      - "scripts/validate-business-social-links.mjs"
      - "supabase/functions/_shared/public-directory-pagination.mjs"
      - "supabase/functions/_shared/public-directory-pagination.test.mjs"
      - "scripts/validate-public-directory-pagination.mjs"
      - ".github/workflows/public-catalog-contact-privacy.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/public-contact-visibility.mjs"
      - "supabase/functions/_shared/public-contact-visibility.test.mjs"
      - "supabase/functions/public-catalog/index.ts"
      - "supabase/functions/public-catalog-directory/index.ts"
      - "apps/catalog-frontend/src/lib/production.ts"
      - "scripts/validate-public-contact-visibility.mjs"
      - "scripts/validate-business-social-links.mjs"
      - "supabase/functions/_shared/public-directory-pagination.mjs"
      - "supabase/functions/_shared/public-directory-pagination.test.mjs"
      - "scripts/validate-public-directory-pagination.mjs"
      - "scripts/validate-production-catalog-real-state.mjs"
      - ".github/workflows/public-catalog-contact-privacy.yml"
permissions:
  contents: read
jobs:
  public-contact-privacy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate public contact boundary
        run: node scripts/validate-public-contact-visibility.mjs
      - name: Test explicit contact projection
        run: node --test supabase/functions/_shared/public-contact-visibility.test.mjs
      - name: Validate public directory keyset pagination boundary
        run: node scripts/validate-public-directory-pagination.mjs
      - name: Test signed public directory cursor
        run: node --test supabase/functions/_shared/public-directory-pagination.test.mjs
      - name: Type-check public Supabase Edge Functions with Deno
        run: deno check supabase/functions/public-catalog-directory/index.ts supabase/functions/public-catalog/index.ts
