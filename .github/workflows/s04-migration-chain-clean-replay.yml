name: S04 Migration Chain Clean Replay
on:
  push:
    branches:
      - 's04/**'
    paths:
      - 'supabase/migrations/**'
      - 'supabase/recovered-migrations/**'
      - 'scripts/verify-migration-source-chain.mjs'
      - 'scripts/replay-migration-chain-clean.sh'
      - '.github/workflows/s04-migration-chain-clean-replay.yml'
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/recovered-migrations/**'
      - 'scripts/verify-migration-source-chain.mjs'
      - 'scripts/replay-migration-chain-clean.sh'
      - '.github/workflows/s04-migration-chain-clean-replay.yml'
permissions:
  contents: read
jobs:
  clean-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_clean_replay
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_clean_replay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/mantiqatix_clean_replay
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Run source preflight and chronological clean replay
        shell: bash
        run: bash scripts/replay-migration-chain-clean.sh
      - name: Upload source and replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s04-migration-chain-clean-replay
          path: artifacts/
          if-no-files-found: warn
