name: S04 Migration Replay with Test-Only Baselines (Not Clean Replay)
on:
  pull_request:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
      - 'supabase/recovered-migrations/**'
      - 'scripts/audit-migration-chain-s04.mjs'
      - 'docs/release/s04-migration-chain-clean-replay-report.md'
      - '.github/workflows/s04-migration-chain-clean-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  clean-replay:
    name: Disposable Supabase clean replay and source audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Audit sources and attempt clean replay
        id: replay
        shell: bash
        run: |
          set +e
          mkdir -p s04-replay-evidence
          echo "MANTIQATIX S04 REPLAY WITH TEST-ONLY BASELINES — NOT CLEAN REPLAY" > s04-replay-evidence/report.txt
          echo "test_baselines_used=true" >> s04-replay-evidence/report.txt
          echo "clean_replay_certified=false" >> s04-replay-evidence/report.txt
          echo "tested_commit=${GITHUB_SHA}" >> s04-replay-evidence/report.txt
          echo "tested_ref=${GITHUB_REF}" >> s04-replay-evidence/report.txt
          echo "timestamp_utc=$(date -u +%FT%TZ)" >> s04-replay-evidence/report.txt
          echo "production_touched=false" >> s04-replay-evidence/report.txt

          node scripts/audit-migration-chain-s04.mjs > s04-replay-evidence/source-audit.json 2> s04-replay-evidence/source-audit.stderr
          audit_rc=$?
          echo "source_audit_exit=$audit_rc" | tee -a s04-replay-evidence/report.txt

          # These compatibility fixtures are injected only into this disposable runner.
          # They are not source migrations and must never be committed under supabase/migrations.
          baseline_rc=125
          admins_baseline="supabase/tests/baselines/smm_admins.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          provider_onboarding_baseline="supabase/tests/baselines/provider_onboarding_requests.sql"
          admins_migration="supabase/migrations/20260927033923_test_only_approved_smm_admins_baseline.sql"
          providers_migration="supabase/migrations/20260927074158_test_only_approved_smm_providers_baseline.sql"
          credentials_migration="supabase/migrations/20260927074159_test_only_approved_smm_provider_credentials_baseline.sql"
          provider_onboarding_migration="supabase/migrations/20261001085000_test_only_approved_provider_onboarding_requests_baseline.sql"
          node scripts/validate-smm-replay-baselines.mjs > s04-replay-evidence/test-baseline-validation.log 2>&1
          baseline_rc=$?
          echo "test_baseline_validation_exit=$baseline_rc" | tee -a s04-replay-evidence/report.txt
          if [ "$baseline_rc" -eq 0 ]; then
            for file in "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"; do test ! -e "$file"; done
            cp "$admins_baseline" "$admins_migration"
            cp "$providers_baseline" "$providers_migration"
            cp "$credentials_baseline" "$credentials_migration"
            cp "$provider_onboarding_baseline" "$provider_onboarding_migration"
            cmp -s "$admins_baseline" "$admins_migration"
            cmp -s "$providers_baseline" "$providers_migration"
            cmp -s "$credentials_baseline" "$credentials_migration"
            cmp -s "$provider_onboarding_baseline" "$provider_onboarding_migration"
            for file in "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"; do ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; done
            ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|update[[:space:]]+public\.|delete[[:space:]]+from|copy[[:space:]]+(public|private)\.)' "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"
            echo "temporary_test_baselines_injected=true" | tee -a s04-replay-evidence/report.txt
            echo "provider_onboarding_order_gap=known; replay is not clean-install certification" | tee -a s04-replay-evidence/report.txt
            echo "temporary_smm_baselines_injected=true" | tee -a s04-replay-evidence/report.txt
          else
            echo "temporary_smm_baselines_injected=false" | tee -a s04-replay-evidence/report.txt
          fi

          supabase init --force > s04-replay-evidence/supabase-init.log 2>&1
          init_rc=$?
          echo "supabase_init_exit=$init_rc" | tee -a s04-replay-evidence/report.txt
          start_rc=125
          replay_rc=125
          if [ "$init_rc" -eq 0 ]; then
            supabase start > s04-replay-evidence/supabase-start.log 2>&1
            start_rc=$?
          fi
          echo "supabase_start_exit=$start_rc" | tee -a s04-replay-evidence/report.txt

          if [ "$start_rc" -eq 0 ]; then
            supabase db reset --local --debug > s04-replay-evidence/clean-replay.log 2>&1
            replay_rc=$?
            echo "clean_replay_exit=$replay_rc" | tee -a s04-replay-evidence/report.txt
            rm -f "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"
            error_line=$(grep -n -m1 -E 'ERROR:|Error:|duplicate migration version|failed to apply' s04-replay-evidence/clean-replay.log | cut -d: -f1)
            if [ -n "$error_line" ]; then
              first_failed_migration=$(head -n "$error_line" s04-replay-evidence/clean-replay.log | grep -E 'Applying migration|Applying:' | tail -n 1)
              if [ -z "$first_failed_migration" ]; then
                first_failed_migration="No migration application line precedes the first reported error; likely CLI/preflight failure."
              fi
              echo "first_failure=$first_failed_migration" | tee -a s04-replay-evidence/report.txt
              echo "first_error=$(sed -n "${error_line}p" s04-replay-evidence/clean-replay.log)" | tee -a s04-replay-evidence/report.txt
            else
              echo "first_failure=No matching error marker detected; inspect full clean-replay.log and exit code." | tee -a s04-replay-evidence/report.txt
            fi
          else
            startup_error_line=$(grep -n -m1 -E 'ERROR:|Error:|SQLSTATE|duplicate migration version|does not exist' s04-replay-evidence/supabase-start.log | cut -d: -f1)
            if [ -n "$startup_error_line" ]; then
              first_failed_migration=$(head -n "$startup_error_line" s04-replay-evidence/supabase-start.log | grep -E 'Applying migration' | tail -n 1)
              if [ -z "$first_failed_migration" ]; then
                first_failed_migration="Supabase startup/preflight failed before a migration application line."
              fi
              echo "clean_replay_exit=FAILED_DURING_SUPABASE_START" | tee -a s04-replay-evidence/report.txt
              echo "first_failure=$first_failed_migration" | tee -a s04-replay-evidence/report.txt
              echo "first_error=$(sed -n "${startup_error_line}p" s04-replay-evidence/supabase-start.log)" | tee -a s04-replay-evidence/report.txt
            else
              echo "clean_replay_exit=FAILED_DURING_SUPABASE_START" | tee -a s04-replay-evidence/report.txt
              echo "first_failure=Supabase local stack did not start; inspect init/start logs." | tee -a s04-replay-evidence/report.txt
            fi
          fi

          rm -f "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"
          if [ "$audit_rc" -ne 0 ] || [ "$baseline_rc" -ne 0 ] || [ "$init_rc" -ne 0 ] || [ "$start_rc" -ne 0 ] || [ "$replay_rc" -ne 0 ]; then
            echo "status=FAIL_BLOCKED" | tee -a s04-replay-evidence/report.txt
            echo "S04_RESULT=FAIL_BLOCKED" >> "$GITHUB_STEP_SUMMARY"
            cat s04-replay-evidence/report.txt >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "status=PASS_WITH_TEST_BASELINES_NOT_CLEAN" | tee -a s04-replay-evidence/report.txt
          echo "S04_RESULT=BLOCKED_TEST_BASELINE_USED — not a clean replay or release certification" >> "$GITHUB_STEP_SUMMARY"
          cat s04-replay-evidence/report.txt >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - name: Upload independent S04 replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s04-clean-replay-evidence-${{ github.sha }}
          path: s04-replay-evidence/
          if-no-files-found: warn
          retention-days: 30
