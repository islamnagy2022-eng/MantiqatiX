name: MantiGO Payment Intent Persistence Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/mantigo-payment-intent/index.ts"
      - "scripts/validate-mantigo-payment-intent-persistence.mjs"
      - ".github/workflows/mantigo-payment-intent-persistence.yml"
  push:
    branches: [main]
    paths:
      - "supabase/functions/mantigo-payment-intent/index.ts"
      - "scripts/validate-mantigo-payment-intent-persistence.mjs"
      - ".github/workflows/mantigo-payment-intent-persistence.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate fail-closed intent persistence contract
        run: node scripts/validate-mantigo-payment-intent-persistence.mjs
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check MantiGO payment intent
        run: deno check --no-lock supabase/functions/mantigo-payment-intent/index.ts
