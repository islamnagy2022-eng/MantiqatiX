name: Audit Log Append-only ACL
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/20261013190000_rc522_audit_log_append_only.sql"
      - "supabase/tests/rc522_audit_log_*"
      - ".github/workflows/audit-log-append-only.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261013190000_rc522_audit_log_append_only.sql"
      - "supabase/tests/rc522_audit_log_*"
      - ".github/workflows/audit-log-append-only.yml"
permissions:
  contents: read
jobs:
  audit-log-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_audit_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_audit_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply disposable fixture, migration, and assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc522_audit_log_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261013190000_rc522_audit_log_append_only.sql "$pg_container:/tmp/migration.sql"
          docker cp supabase/tests/rc522_audit_log_integration.sql "$pg_container:/tmp/test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_audit_acl_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_audit_acl_test -v ON_ERROR_STOP=1 -f /tmp/migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_audit_acl_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
