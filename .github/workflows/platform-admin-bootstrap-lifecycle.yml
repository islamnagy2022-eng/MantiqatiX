name: Platform Admin Bootstrap Lifecycle
on:
  pull_request:
    paths:
      - "supabase/migrations/20261031145200_rc463_platform_admin_bootstrap_recovery.sql"
      - "supabase/functions/platform-admin-lifecycle/**"
      - "supabase/tests/rc463_platform_admin_lifecycle_*.sql"
      - "scripts/validate-platform-admin-lifecycle.mjs"
      - ".github/workflows/platform-admin-bootstrap-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261031145200_rc463_platform_admin_bootstrap_recovery.sql"
      - "supabase/functions/platform-admin-lifecycle/**"
      - "supabase/tests/rc463_platform_admin_lifecycle_*.sql"
      - "scripts/validate-platform-admin-lifecycle.mjs"
      - ".github/workflows/platform-admin-bootstrap-lifecycle.yml"

jobs:
  platform-admin-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: platform_admin_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d platform_admin_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate static authorization and lifecycle contract
        run: node scripts/validate-platform-admin-lifecycle.mjs
      - name: Apply disposable PostgreSQL fixture and RC463 migration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc463_platform_admin_lifecycle_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261031145200_rc463_platform_admin_bootstrap_recovery.sql "$pg_container:/tmp/rc463.sql"
          docker cp supabase/tests/rc463_platform_admin_lifecycle_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d platform_admin_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d platform_admin_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/rc463.sql
          docker exec "$pg_container" psql -U postgres -d platform_admin_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
