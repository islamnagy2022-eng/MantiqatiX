name: Retired Preview Publisher

# Experimental preview assets remain in the repository for historical reference,
# but this workflow must never publish them to the shared GitHub Pages slot.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Confirm preview publishing is retired
        run: |
          echo "PREVIEW_PUBLISHING=DISABLED"
          echo "No preview/demo artifacts are built or deployed by this workflow."
