name: Validate deferred preview sources (not published)

on:
  push:
    branches: [main]
    paths:
      - "web/preview/**"
      - ".github/workflows/preview-pages.yml"
      - ".github/workflows/preview-demo-validation.yml"
      - "scripts/validate-preview-navigation.mjs"
      - "scripts/validate-smm-deferred-ui.mjs"
  pull_request:
    branches: [main]
    paths:
      - "web/preview/**"
      - ".github/workflows/preview-pages.yml"
      - ".github/workflows/preview-demo-validation.yml"
      - "scripts/validate-preview-navigation.mjs"
      - "scripts/validate-smm-deferred-ui.mjs"

permissions:
  contents: read

concurrency:
  group: preview-source-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-preview-source:
    name: Validate preview source without publishing
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Validate preview-only source contracts
        run: node scripts/validate-preview-navigation.mjs
      - name: Verify SMM stays deferred and non-interactive
        run: node scripts/validate-smm-deferred-ui.mjs
      - name: Validate four-sector demo source without deployment
        run: |
          set -euo pipefail
          test -s web/preview/four-sector-demo/index.html
          test -s web/preview/four-sector-demo/demo.css
          test -s web/preview/four-sector-demo/demo.js
          node --check web/preview/four-sector-demo/demo.js
          grep -Fq 'MANTIQATIX_DEMO_DB_V1' web/preview/four-sector-demo/demo.js
          grep -Fq 'MANTIQATIX_DEMO_SESSION_V1' web/preview/four-sector-demo/demo.js
          for sector in 'مطاعم وكافيهات' 'صيدليات' 'أطباء وعيادات' 'متاجر'; do
            grep -Fq "$sector" web/preview/four-sector-demo/demo.js
          done
          grep -Fq 'لا يوجد اتصال بـ Supabase أو بقاعدة الإنتاج' web/preview/four-sector-demo/index.html
          ! grep -Eq 'fetch[[:space:]]*\\(|XMLHttpRequest|WebSocket|createClient[[:space:]]*\\(|supabase\\.co|signInWithOtp' web/preview/four-sector-demo/index.html web/preview/four-sector-demo/demo.js web/preview/four-sector-demo/demo.css
          echo "PREVIEW_SOURCE_ONLY=PASS; no Pages artifact or deployment produced"
