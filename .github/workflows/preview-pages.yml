name: Deploy MantiqaTiX Preview Route

on:
  push:
    branches: [main]
    paths:
      - "web/preview/**"
      - "web/404.html"
      - ".github/workflows/preview-pages.yml"

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  validate-preview-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout current main commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Ensure this commit changes only the preview route and recovery page
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              web/preview/*|web/404.html|.github/workflows/preview-pages.yml|.github/workflows/preview-demo-validation.yml|scripts/validate-preview-navigation.mjs) ;;
              *) echo "Refusing preview-only deployment: unexpected changed path: $path"; exit 1 ;;
            esac
          done <<< "$changed"
          test -s web/preview/index.html
          grep -Fq 'معاينة تفاعلية' web/preview/index.html
          grep -Fq 'لا يوجد اتصال بالـ Backend' web/preview/index.html
          test -s web/404.html
      - name: Validate demo, route, and recovery contracts
        run: node scripts/validate-preview-navigation.mjs
      - name: Find the last successfully deployed Pages baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/preview-pages.yml/runs?branch=main&per_page=100")"
          baseline_sha="$(jq -r --arg current "$GITHUB_SHA" '[.workflow_runs[] | select(.conclusion == "success" and .head_sha != $current)][0].head_sha // empty' <<< "$response")"
          if [[ ! "$baseline_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "No prior successful preview Pages deployment found; refusing to replace the current site."
            exit 1
          fi
          git fetch --no-tags origin "$baseline_sha"
          if ! git merge-base --is-ancestor "$baseline_sha" "$GITHUB_SHA"; then
            echo "Last successful Pages baseline is not an ancestor of this commit; refusing deployment."
            exit 1
          fi
          baseline_dir="$RUNNER_TEMP/mntx-pages-baseline"
          git worktree add --detach "$baseline_dir" "$baseline_sha"
          test -s "$baseline_dir/web/index.html"
          test -s "$baseline_dir/web/assets/mantiqatix-logo.svg"
          # Preserve every non-preview file from the last successful deployment.
          # Only the isolated demo route and the root 404 recovery page are overlaid.
          rm -rf "$baseline_dir/web/preview"
          mkdir -p "$baseline_dir/web/preview"
          cp -a web/preview/. "$baseline_dir/web/preview/"
          cp web/404.html "$baseline_dir/web/404.html"
          echo "sha=$baseline_sha" >> "$GITHUB_OUTPUT"
          echo "site_dir=$baseline_dir/web" >> "$GITHUB_OUTPUT"
          echo "Prepared preview-only overlay on deployed baseline $baseline_sha"
      - name: Build browser SDK for the preserved site baseline
        env:
          SITE_DIR: ${{ steps.baseline.outputs.site_dir }}
        shell: bash
        run: |
          set -euo pipefail
          repo_root="$(dirname "$SITE_DIR")"
          cd "$repo_root"
          npm install --ignore-scripts --no-audit --no-fund
          mkdir -p "$SITE_DIR/vendor"
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile="$SITE_DIR/vendor/supabase.js" --minify
          test -s "$SITE_DIR/vendor/supabase.js"
      - name: Upload preserved site plus isolated preview overlay
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.baseline.outputs.site_dir }}
      - name: Deploy preview route
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-preview-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify deployed preview and 404 recovery
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}preview/" -o /tmp/preview.html
          grep -Fq 'id="heroTitle"' /tmp/preview.html
          grep -Fq 'id="categoryGrid"' /tmp/preview.html
          grep -Fq 'id="serviceCards"' /tmp/preview.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}preview/dashboard.html" -o /tmp/preview-dashboard.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}preview/admin.html" -o /tmp/preview-admin.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}preview/login.html" -o /tmp/preview-login.html
          curl --fail --silent --show-error --location --retry 5 --retry-delay 3 "${PAGE_URL}404.html" -o /tmp/404.html
          grep -Fq 'MantiqatiX' /tmp/preview.html
          grep -Fq 'dashboard.html' /tmp/preview.html
          grep -Fq 'كل موديولات MantiqatiX' /tmp/preview-dashboard.html
          grep -Fq 'وضع تجريبي فقط' /tmp/preview.html
          grep -Fq 'لوحة الإدارة الشاملة' /tmp/preview-admin.html
          grep -Fq 'Demo Administration Center' /tmp/preview-admin.html
          grep -Fq 'AUTHENTICATION UI DEMO' /tmp/preview-login.html
          grep -Fq 'رمز التحقق التجريبي الثابت 123456' /tmp/preview-login.html
          grep -Fq 'href="/MantiqatiX/preview/"' /tmp/404.html
          grep -Fq 'href="/MantiqatiX/preview/dashboard.html"' /tmp/404.html
          missing_status="$(curl --silent --show-error --location --output /tmp/not-found.html --write-out '%{http_code}' "${PAGE_URL}preview/__mnty_route_probe_not_found__")"
          test "$missing_status" = "404"
          grep -Fq 'href="/MantiqatiX/preview/"' /tmp/not-found.html
          echo "Preview routes and 404 recovery verified at ${PAGE_URL}preview/ using baseline ${{ steps.baseline.outputs.sha }}"
