name: RC458 Digital Page Payment RPC Search Path

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/20261030120000_rc458_digital_page_payment_rpc_empty_search_path.sql"
      - "supabase/tests/rc458_digital_page_payment_rpc_fixture.sql"
      - "supabase/tests/rc458_digital_page_payment_rpc_integration.sql"
      - ".github/workflows/rc458-digital-page-payment-rpc-search-path.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261030120000_rc458_digital_page_payment_rpc_empty_search_path.sql"
      - "supabase/tests/rc458_digital_page_payment_rpc_fixture.sql"
      - "supabase/tests/rc458_digital_page_payment_rpc_integration.sql"
      - ".github/workflows/rc458-digital-page-payment-rpc-search-path.yml"

permissions:
  contents: read

jobs:
  rc458-digital-page-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc458_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc458_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Create isolated Supabase role stand-ins
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc458_test -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
      - name: Apply fixture, RC458 forward migration and boundary assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc458_digital_page_payment_rpc_fixture.sql "$pg_container:/tmp/rc458_fixture.sql"
          docker cp supabase/migrations/20261030120000_rc458_digital_page_payment_rpc_empty_search_path.sql "$pg_container:/tmp/rc458_migration.sql"
          docker cp supabase/tests/rc458_digital_page_payment_rpc_integration.sql "$pg_container:/tmp/rc458_integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc458_test -v ON_ERROR_STOP=1 -f /tmp/rc458_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc458_test -v ON_ERROR_STOP=1 -f /tmp/rc458_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc458_test -v ON_ERROR_STOP=1 -f /tmp/rc458_integration.sql
