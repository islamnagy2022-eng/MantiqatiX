name: Digital Pages Payment Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/digital-page-order-create/index.ts"
      - "supabase/functions/digital-page-payment-intent/index.ts"
      - "supabase/functions/paymob-webhook/index.ts"
      - "supabase/migrations/20261009010000_rc424_atomic_digital_page_payment_webhook.sql"
      - "supabase/migrations/20261009130000_rc426_digital_page_provider_order_binding.sql"
      - "supabase/migrations/20261009140000_rc427_one_active_payment_intent_per_order.sql"
      - "supabase/migrations/20261009150000_rc428_atomic_provider_failure_webhook.sql"
      - "supabase/migrations/20261009160000_rc429_atomic_subscription_failure_webhook.sql"
      - "supabase/migrations/20261009170000_rc430_atomic_subscription_success_webhook.sql"
      - "supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql"
      - "scripts/validate-digital-pages-boundaries.mjs"
      - ".github/workflows/digital-pages-payment-source-contract.yml"
  push:
    branches:
      - "recovery/verified-rc425-441-sources-20261014"
    paths:
      - "supabase/functions/digital-page-order-create/index.ts"
      - "supabase/functions/digital-page-payment-intent/index.ts"
      - "supabase/functions/paymob-webhook/index.ts"
      - "supabase/migrations/20261009010000_rc424_atomic_digital_page_payment_webhook.sql"
      - "supabase/migrations/20261009130000_rc426_digital_page_provider_order_binding.sql"
      - "supabase/migrations/20261009140000_rc427_one_active_payment_intent_per_order.sql"
      - "supabase/migrations/20261009150000_rc428_atomic_provider_failure_webhook.sql"
      - "supabase/migrations/20261009160000_rc429_atomic_subscription_failure_webhook.sql"
      - "supabase/migrations/20261009170000_rc430_atomic_subscription_success_webhook.sql"
      - "supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql"
      - "scripts/validate-digital-pages-boundaries.mjs"
      - ".github/workflows/digital-pages-payment-source-contract.yml"

permissions:
  contents: read

concurrency:
  group: digital-pages-payment-source-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate payment and webhook source contracts
        run: node scripts/validate-digital-pages-boundaries.mjs
