name: RC499 Cash Confirmation Business and Branch Scope
on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261122030000_rc499_cash_confirmation_business_branch_scope.sql"
      - "supabase/tests/rc499_cash_confirmation_business_branch_scope_fixture.sql"
      - "supabase/tests/rc499_cash_confirmation_business_branch_scope_integration.sql"
      - "supabase/functions/api/index.ts"
      - "scripts/validate-rc499-cash-confirm-scope.mjs"
      - ".github/workflows/rc499-cash-confirmation-business-branch-scope.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261122030000_rc499_cash_confirmation_business_branch_scope.sql"
      - "supabase/tests/rc499_cash_confirmation_business_branch_scope_fixture.sql"
      - "supabase/tests/rc499_cash_confirmation_business_branch_scope_integration.sql"
      - "supabase/functions/api/index.ts"
      - "scripts/validate-rc499-cash-confirm-scope.mjs"
      - ".github/workflows/rc499-cash-confirmation-business-branch-scope.yml"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  rc499-cash-confirmation-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc499_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc499_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Static RC499 cash confirmation contract
        run: node scripts/validate-rc499-cash-confirm-scope.mjs
      - name: Apply disposable fixture, RC499 and behavior tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc499_cash_confirmation_business_branch_scope_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261122030000_rc499_cash_confirmation_business_branch_scope.sql "$pg_container:/tmp/rc499.sql"
          docker cp supabase/tests/rc499_cash_confirmation_business_branch_scope_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc499_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc499_test -v ON_ERROR_STOP=1 -f /tmp/rc499.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc499_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
