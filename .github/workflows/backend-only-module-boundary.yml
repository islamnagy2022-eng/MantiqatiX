name: Backend-only Module Boundary
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --check web/app.js
      - run: node scripts/validate-backend-only-module-boundary.mjs
      - run: node scripts/validate-module-runtime-contracts.mjs
      - run: node scripts/validate-sensitive-module-writes.mjs
      - run: node scripts/validate-financial-journal-service-role.mjs

  financial-journal-rc564-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc564_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc564_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply RC564 to disposable PostgreSQL and run behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc564_financial_journal_fixture.sql "$pg_container:/tmp/rc564_fixture.sql"
          docker cp supabase/migrations/20261010050000_rc564_financial_journal_service_role_boundary.sql "$pg_container:/tmp/rc564_migration.sql"
          docker cp supabase/tests/rc564_financial_journal_integration.sql "$pg_container:/tmp/rc564_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc564_test -v ON_ERROR_STOP=1 -f /tmp/rc564_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc564_test -v ON_ERROR_STOP=1 -f /tmp/rc564_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc564_test -v ON_ERROR_STOP=1 -f /tmp/rc564_test.sql
