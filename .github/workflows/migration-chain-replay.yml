name: Disposable Supabase Migration Chain Replay

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-chain-replay-${{ github.event.pull_request.number || github.ref }}
  # Let an in-flight replay finish; it remains evidence only for its exact commit.
  cancel-in-progress: false

jobs:
  replay-all-migrations:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fail closed if the historical schema baseline is missing
        run: node scripts/validate-historical-schema-baseline.mjs

      - name: Inject verified test-only compatibility baselines into disposable replay only
        shell: bash
        run: |
          set -euo pipefail
          legacy_businesses_baseline="supabase/tests/baselines/legacy_businesses.sql"
          legacy_products_baseline="supabase/tests/baselines/legacy_products.sql"
          legacy_orders_baseline="supabase/tests/baselines/legacy_orders.sql"
          registration_baseline="supabase/tests/baselines/account_registration_requests_schema.sql"
          registration_security_baseline="supabase/tests/baselines/account_registration_requests.sql"
          profiles_baseline="supabase/tests/baselines/marketing_provider_profiles.sql"
          marketing_leads_baseline="supabase/tests/baselines/marketing_leads.sql"
          admins_baseline="supabase/tests/baselines/smm_admins.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          provider_onboarding_baseline="supabase/tests/baselines/provider_onboarding_requests.sql"
          digital_page_products_baseline="supabase/tests/baselines/digital_page_products.sql"
          digital_page_orders_baseline="supabase/tests/baselines/digital_page_orders.sql"
          bookings_baseline="supabase/tests/baselines/bookings.sql"
          approval_policy_baseline="supabase/tests/baselines/approval_requests_scoped_read.sql"
          commission_policy_baseline="supabase/tests/baselines/commission_transactions_finance_read.sql"
          marketing_schema_baseline="supabase/tests/baselines/marketing_commission_schema.sql"
          journal_finance_policy_baseline="supabase/tests/baselines/journal_finance_read_policies.sql"
          general_ledger_policy_baseline="supabase/tests/baselines/general_ledger_finance_read.sql"
