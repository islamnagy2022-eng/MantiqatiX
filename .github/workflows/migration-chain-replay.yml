name: Disposable Supabase Migration Chain Replay

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-chain-replay-${{ github.event.pull_request.number || github.ref }}
  # Let an in-flight replay finish; it remains evidence only for its exact commit.
  cancel-in-progress: false

jobs:
  replay-all-migrations:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fail closed if the historical schema baseline is missing
        run: node scripts/validate-historical-schema-baseline.mjs

      - name: Inject verified test-only compatibility baselines into disposable replay only
        shell: bash
        run: |
          set -euo pipefail
          legacy_businesses_baseline="supabase/tests/baselines/legacy_businesses.sql"
          legacy_products_baseline="supabase/tests/baselines/legacy_products.sql"
          legacy_orders_baseline="supabase/tests/baselines/legacy_orders.sql"
          registration_baseline="supabase/tests/baselines/account_registration_requests_schema.sql"
          registration_security_baseline="supabase/tests/baselines/account_registration_requests.sql"
          profiles_baseline="supabase/tests/baselines/marketing_provider_profiles.sql"
          marketing_leads_baseline="supabase/tests/baselines/marketing_leads.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          bookings_baseline="supabase/tests/baselines/bookings.sql"
          approval_policy_baseline="supabase/tests/baselines/approval_requests_scoped_read.sql"
          commission_policy_baseline="supabase/tests/baselines/commission_transactions_finance_read.sql"
          marketing_schema_baseline="supabase/tests/baselines/marketing_commission_schema.sql"
          journal_finance_policy_baseline="supabase/tests/baselines/journal_finance_read_policies.sql"
          general_ledger_policy_baseline="supabase/tests/baselines/general_ledger_finance_read.sql"
          legacy_functions_baseline="supabase/tests/baselines/legacy_security_definer_functions.sql"
          smm_bootstrap_baseline="supabase/tests/baselines/smm_bootstrap_first_admin.sql"
          settlement_baseline="supabase/tests/baselines/settlement_backend_10arg.sql"
          settlement_attempts_baseline="supabase/tests/baselines/settlement_attempts.sql"
          credit_policies_baseline="supabase/tests/baselines/credit_policies.sql"
          credit_accounts_baseline="supabase/tests/baselines/credit_accounts.sql"
          credit_periods_baseline="supabase/tests/baselines/credit_periods.sql"
          payment_provider_events_baseline="supabase/tests/baselines/payment_provider_events.sql"
          payment_events_policy_baseline="supabase/tests/baselines/payment_events_finance_read.sql"
          legacy_businesses_migration="supabase/migrations/20260807999997_test_only_legacy_businesses_baseline.sql"
          legacy_products_migration="supabase/migrations/20260807999998_test_only_legacy_products_baseline.sql"
          legacy_orders_migration="supabase/migrations/20260807999999_test_only_legacy_orders_baseline.sql"
          registration_migration="supabase/migrations/20260927065246_test_only_live_derived_registration_schema_baseline.sql"
          registration_security_migration="supabase/migrations/20260927074155_test_only_live_derived_registration_security_baseline.sql"
          profiles_migration="supabase/migrations/20260927074156_test_only_live_derived_provider_profiles_baseline.sql"
          marketing_leads_migration="supabase/migrations/20260927140496_test_only_live_derived_marketing_leads.sql"
          providers_migration="supabase/migrations/20260927074158_test_only_approved_smm_providers_baseline.sql"
          credentials_migration="supabase/migrations/20260927074159_test_only_approved_smm_provider_credentials_baseline.sql"
          bookings_migration="supabase/migrations/20260919233424_test_only_approved_bookings_baseline.sql"
          approval_policy_migration="supabase/migrations/20260927140499_test_only_live_derived_approval_requests_scoped_read.sql"
          commission_policy_migration="supabase/migrations/20260927140498_test_only_live_derived_commission_transactions_finance_read.sql"
          marketing_schema_migration="supabase/migrations/20260927140494_test_only_live_derived_marketing_commission_schema.sql"
          journal_finance_policy_migration="supabase/migrations/20260927140495_test_only_live_derived_journal_finance_read_policies.sql"
          general_ledger_policy_migration="supabase/migrations/20260927140497_test_only_live_derived_general_ledger_finance_read.sql"
          legacy_functions_migration="supabase/migrations/20260927074160_test_only_live_derived_security_definer_baseline.sql"
          smm_bootstrap_migration="supabase/migrations/20260927033924_test_only_live_derived_smm_bootstrap_first_admin.sql"
          settlement_migration="supabase/migrations/20260920095705_test_only_live_derived_settlement_baseline.sql"
          settlement_attempts_migration="supabase/migrations/20260920211715_test_only_live_derived_settlement_attempts_baseline.sql"
          credit_policies_migration="supabase/migrations/20260920155450_test_only_live_derived_credit_policies_baseline.sql"
          credit_accounts_migration="supabase/migrations/20260920155451_test_only_live_derived_credit_accounts_baseline.sql"
          credit_periods_migration="supabase/migrations/20260920155452_test_only_live_derived_credit_periods_baseline.sql"
          payment_provider_events_migration="supabase/migrations/20260920211716_test_only_live_derived_payment_provider_events_baseline.sql"
          payment_events_policy_migration="supabase/migrations/20260927140493_test_only_live_derived_payment_events_finance_read.sql"
          for file in "$legacy_businesses_baseline" "$legacy_products_baseline" "$legacy_orders_baseline" "$registration_baseline" "$registration_security_baseline" "$profiles_baseline" "$marketing_leads_baseline" "$providers_baseline" "$credentials_baseline" "$bookings_baseline" "$approval_policy_baseline" "$marketing_schema_baseline" "$journal_finance_policy_baseline" "$general_ledger_policy_baseline" "$commission_policy_baseline" "$legacy_functions_baseline" "$smm_bootstrap_baseline" "$settlement_baseline" "$settlement_attempts_baseline" "$credit_policies_baseline" "$credit_accounts_baseline" "$credit_periods_baseline" "$payment_provider_events_baseline" "$payment_events_policy_baseline"; do test -f "$file"; done
          for file in "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$registration_security_migration" "$profiles_migration" "$marketing_leads_migration" "$providers_migration" "$credentials_migration" "$bookings_migration" "$approval_policy_migration" "$marketing_schema_migration" "$journal_finance_policy_migration" "$general_ledger_policy_migration" "$commission_policy_migration" "$legacy_functions_migration" "$smm_bootstrap_migration" "$settlement_migration" "$settlement_attempts_migration" "$credit_policies_migration" "$credit_accounts_migration" "$credit_periods_migration" "$payment_provider_events_migration" "$payment_events_policy_migration"; do test ! -e "$file"; done
          cp "$legacy_businesses_baseline" "$legacy_businesses_migration"
          cp "$legacy_products_baseline" "$legacy_products_migration"
          cp "$legacy_orders_baseline" "$legacy_orders_migration"
          cp "$registration_baseline" "$registration_migration"
          cp "$registration_security_baseline" "$registration_security_migration"
          cp "$profiles_baseline" "$profiles_migration"
          cp "$marketing_leads_baseline" "$marketing_leads_migration"
          cp "$providers_baseline" "$providers_migration"
          cp "$credentials_baseline" "$credentials_migration"
          cp "$bookings_baseline" "$bookings_migration"
          cp "$approval_policy_baseline" "$approval_policy_migration"
          cp "$marketing_schema_baseline" "$marketing_schema_migration"
          cp "$journal_finance_policy_baseline" "$journal_finance_policy_migration"
          cp "$general_ledger_policy_baseline" "$general_ledger_policy_migration"
          cp "$commission_policy_baseline" "$commission_policy_migration"
          cp "$legacy_functions_baseline" "$legacy_functions_migration"
          cp "$smm_bootstrap_baseline" "$smm_bootstrap_migration"
          cp "$settlement_baseline" "$settlement_migration"
          cp "$settlement_attempts_baseline" "$settlement_attempts_migration"
          cp "$credit_policies_baseline" "$credit_policies_migration"
          cp "$credit_accounts_baseline" "$credit_accounts_migration"
          cp "$credit_periods_baseline" "$credit_periods_migration"
          cp "$payment_provider_events_baseline" "$payment_provider_events_migration"
          cp "$payment_events_policy_baseline" "$payment_events_policy_migration"
          echo "Injected catalog-verified test-only compatibility baselines into disposable CI only."
          echo "These are not historical creation migrations and must never be applied to production."

      - name: Verify temporary baselines are exact copies and untracked
        shell: bash
        run: |
          set -euo pipefail
          legacy_businesses_baseline="supabase/tests/baselines/legacy_businesses.sql"
          legacy_products_baseline="supabase/tests/baselines/legacy_products.sql"
          legacy_orders_baseline="supabase/tests/baselines/legacy_orders.sql"
          registration_baseline="supabase/tests/baselines/account_registration_requests_schema.sql"
          registration_security_baseline="supabase/tests/baselines/account_registration_requests.sql"
          profiles_baseline="supabase/tests/baselines/marketing_provider_profiles.sql"
          marketing_leads_baseline="supabase/tests/baselines/marketing_leads.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          bookings_baseline="supabase/tests/baselines/bookings.sql"
          approval_policy_baseline="supabase/tests/baselines/approval_requests_scoped_read.sql"
          commission_policy_baseline="supabase/tests/baselines/commission_transactions_finance_read.sql"
          marketing_schema_baseline="supabase/tests/baselines/marketing_commission_schema.sql"
          journal_finance_policy_baseline="supabase/tests/baselines/journal_finance_read_policies.sql"
          general_ledger_policy_baseline="supabase/tests/baselines/general_ledger_finance_read.sql"
          legacy_functions_baseline="supabase/tests/baselines/legacy_security_definer_functions.sql"
          smm_bootstrap_baseline="supabase/tests/baselines/smm_bootstrap_first_admin.sql"
          settlement_baseline="supabase/tests/baselines/settlement_backend_10arg.sql"
          settlement_attempts_baseline="supabase/tests/baselines/settlement_attempts.sql"
          credit_policies_baseline="supabase/tests/baselines/credit_policies.sql"
          credit_accounts_baseline="supabase/tests/baselines/credit_accounts.sql"
          credit_periods_baseline="supabase/tests/baselines/credit_periods.sql"
          payment_provider_events_baseline="supabase/tests/baselines/payment_provider_events.sql"
          legacy_businesses_migration="supabase/migrations/20260807999997_test_only_legacy_businesses_baseline.sql"
          legacy_products_migration="supabase/migrations/20260807999998_test_only_legacy_products_baseline.sql"
          legacy_orders_migration="supabase/migrations/20260807999999_test_only_legacy_orders_baseline.sql"
          registration_migration="supabase/migrations/20260927065246_test_only_live_derived_registration_schema_baseline.sql"
          registration_security_migration="supabase/migrations/20260927074155_test_only_live_derived_registration_security_baseline.sql"
          profiles_migration="supabase/migrations/20260927074156_test_only_live_derived_provider_profiles_baseline.sql"
          marketing_leads_migration="supabase/migrations/20260927140496_test_only_live_derived_marketing_leads.sql"
          providers_migration="supabase/migrations/20260927074158_test_only_approved_smm_providers_baseline.sql"
          credentials_migration="supabase/migrations/20260927074159_test_only_approved_smm_provider_credentials_baseline.sql"
          bookings_migration="supabase/migrations/20260919233424_test_only_approved_bookings_baseline.sql"
          approval_policy_migration="supabase/migrations/20260927140499_test_only_live_derived_approval_requests_scoped_read.sql"
          commission_policy_migration="supabase/migrations/20260927140498_test_only_live_derived_commission_transactions_finance_read.sql"
          marketing_schema_migration="supabase/migrations/20260927140494_test_only_live_derived_marketing_commission_schema.sql"
          journal_finance_policy_migration="supabase/migrations/20260927140495_test_only_live_derived_journal_finance_read_policies.sql"
          general_ledger_policy_migration="supabase/migrations/20260927140497_test_only_live_derived_general_ledger_finance_read.sql"
          legacy_functions_migration="supabase/migrations/20260927074160_test_only_live_derived_security_definer_baseline.sql"
          smm_bootstrap_migration="supabase/migrations/20260927033924_test_only_live_derived_smm_bootstrap_first_admin.sql"
          settlement_migration="supabase/migrations/20260920095705_test_only_live_derived_settlement_baseline.sql"
          settlement_attempts_migration="supabase/migrations/20260920211715_test_only_live_derived_settlement_attempts_baseline.sql"
          credit_policies_migration="supabase/migrations/20260920155450_test_only_live_derived_credit_policies_baseline.sql"
          credit_accounts_migration="supabase/migrations/20260920155451_test_only_live_derived_credit_accounts_baseline.sql"
          credit_periods_migration="supabase/migrations/20260920155452_test_only_live_derived_credit_periods_baseline.sql"
          payment_provider_events_migration="supabase/migrations/20260920211716_test_only_live_derived_payment_provider_events_baseline.sql"
          cmp -s "$legacy_businesses_baseline" "$legacy_businesses_migration"
          cmp -s "$legacy_products_baseline" "$legacy_products_migration"
          cmp -s "$legacy_orders_baseline" "$legacy_orders_migration"
          cmp -s "$registration_baseline" "$registration_migration"
          cmp -s "$registration_security_baseline" "$registration_security_migration"
          cmp -s "$profiles_baseline" "$profiles_migration"
          cmp -s "$marketing_leads_baseline" "$marketing_leads_migration"
          cmp -s "$providers_baseline" "$providers_migration"
          cmp -s "$credentials_baseline" "$credentials_migration"
          cmp -s "$bookings_baseline" "$bookings_migration"
          cmp -s "$approval_policy_baseline" "$approval_policy_migration"
          cmp -s "$marketing_schema_baseline" "$marketing_schema_migration"
          cmp -s "$journal_finance_policy_baseline" "$journal_finance_policy_migration"
          cmp -s "$general_ledger_policy_baseline" "$general_ledger_policy_migration"
          cmp -s "$commission_policy_baseline" "$commission_policy_migration"
          cmp -s "$legacy_functions_baseline" "$legacy_functions_migration"
          cmp -s "$smm_bootstrap_baseline" "$smm_bootstrap_migration"
          cmp -s "$settlement_baseline" "$settlement_migration"
          cmp -s "$settlement_attempts_baseline" "$settlement_attempts_migration"
          cmp -s "$credit_policies_baseline" "$credit_policies_migration"
          cmp -s "$credit_accounts_baseline" "$credit_accounts_migration"
          cmp -s "$credit_periods_baseline" "$credit_periods_migration"
          cmp -s "$payment_provider_events_baseline" "$payment_provider_events_migration"
          cmp -s "$payment_events_policy_baseline" "$payment_events_policy_migration"
          for file in "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$registration_security_migration" "$profiles_migration" "$marketing_leads_migration" "$providers_migration" "$credentials_migration" "$bookings_migration" "$approval_policy_migration" "$marketing_schema_migration" "$journal_finance_policy_migration" "$general_ledger_policy_migration" "$commission_policy_migration" "$legacy_functions_migration" "$smm_bootstrap_migration" "$settlement_migration" "$settlement_attempts_migration" "$credit_policies_migration" "$credit_accounts_migration" "$credit_periods_migration" "$payment_provider_events_migration" "$payment_events_policy_migration"; do ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; done
          ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|copy[[:space:]]+(public|private)\.)' "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$registration_security_migration" "$profiles_migration" "$marketing_leads_migration" "$providers_migration" "$credentials_migration" "$bookings_migration" "$approval_policy_migration" "$marketing_schema_migration" "$journal_finance_policy_migration" "$general_ledger_policy_migration" "$commission_policy_migration" "$settlement_attempts_migration" "$credit_policies_migration" "$credit_accounts_migration" "$credit_periods_migration" "$payment_provider_events_migration" "$payment_events_policy_migration"
          echo "PASS: exact untracked temporary baseline copies; no production rows are imported. Function fixtures are definition-only and are never invoked by replay."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create disposable local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/config.toml <<'TOML'
          project_id = "mantiqatix-migration-ci"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 1000

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 15

          [db.migrations]
          enabled = true
          schema_paths = []

          [db.seed]
          enabled = false

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:3000"
          additional_redirect_urls = ["http://127.0.0.1:3000"]
          jwt_expiry = 3600
          enable_signup = true

          [studio]
          enabled = false
          TOML

      - name: Login to Docker Hub when credentials are configured
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start disposable Supabase services without replaying migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_stash="$(mktemp -d)"
          restore_migrations() {
            shopt -s nullglob
            for file in "$migration_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$migration_stash" 2>/dev/null || true
          }
          trap restore_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            mv "$file" "$migration_stash/"
          done
          for attempt in 1 2 3 4; do
            if timeout --kill-after=15s 180s supabase start -x studio,edge-runtime,logflare,vector,supavisor; then
              restore_migrations
              trap - EXIT
              echo "Disposable services started; all migration SQL files restored for the dedicated replay step."
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              supabase stop --no-backup || true
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase local stack failed after four attempts." >&2
          exit 1

      - name: Replay every migration in repository timestamp order
        shell: bash
        run: |
          set -euo pipefail
          # The historical archive contains the EXECUTE-lockdown migration but not its
          # function's creation DDL. Keep the approved live-derived definition test-only:
          # replay up to its version, inject it into this disposable DB, then run the real
          # lockdown migration and assert its ACL contract before continuing the full chain.
          smm_bootstrap_baseline="supabase/tests/baselines/smm_bootstrap_first_admin.sql"
          test -f "$smm_bootstrap_baseline"

          supabase db reset --local --version 20260927033924

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          # This workflow writes its disposable Supabase config with db.port=54322
          # and the local default postgres password. Avoid depending on CLI env-output shape.
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          if ! pg_isready -d "$db_url"; then
            echo "P0 BLOCKED: disposable PostgreSQL is not reachable on the configured local port." >&2
            exit 1
          fi
          psql "$db_url" -v ON_ERROR_STOP=1 -f "$smm_bootstrap_baseline"
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT to_regprocedure('public.smm_bootstrap_first_admin()') IS NOT NULL" | grep -qx t

          # Apply the actual historical SQL directly for an isolated preflight assertion.
          # Supabase CLI's migration-up command has no target-version flag; after this direct
          # assertion, the ordinary migration runner reapplies the idempotent REVOKE and records
          # the migration in its own ledger.
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260927033925_harden_smm_bootstrap_trigger_execute_privilege.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT NOT has_function_privilege('anon', p.oid, 'EXECUTE') AND NOT has_function_privilege('authenticated', p.oid, 'EXECUTE') AND NOT EXISTS (SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a WHERE a.grantee = 0 AND a.privilege_type = 'EXECUTE') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'smm_bootstrap_first_admin' AND pg_get_function_identity_arguments(p.oid) = ''" | grep -qx t

          # Continue through every remaining migration in timestamp order. The targeted REVOKE
          # is safe to replay and will be recorded normally in the local migration ledger.
          supabase migration up --local

      - name: Record local migration ledger
        run: supabase migration list --local

      - name: Verify replay completed
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
          echo "Full disposable Supabase migration replay completed."
