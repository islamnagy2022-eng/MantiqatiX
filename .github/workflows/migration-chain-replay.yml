          # below match the read-only live Supabase migration ledger. Never rename source
          # migrations in Git; this normalization exists only on the disposable CI runner.
          rename_legacy_alias() {
            local source="$1"
            local target="$2"
            local source_path="supabase/migrations/$source"
            local target_path="supabase/migrations/$target"
            test -f "$source_path"
