          for file in "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$registration_security_migration" "$profiles_migration" "$marketing_leads_migration" "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration" "$digital_page_products_migration" "$digital_page_orders_migration" "$bookings_migration" "$approval_policy_migration" "$marketing_schema_migration" "$journal_finance_policy_migration" "$general_ledger_policy_migration" "$commission_policy_migration" "$legacy_functions_migration" "$smm_bootstrap_migration" "$settlement_migration" "$settlement_attempts_migration" "$credit_policies_migration" "$credit_accounts_migration" "$credit_periods_migration" "$payment_provider_events_migration" "$payment_events_policy_migration" "$settlement_transactions_policy_migration" "$wallet_accounts_policy_migration" "$wallet_transactions_policy_migration" "$smm_order_events_migration"; do ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; done
          ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|copy[[:space:]]+(public|private)\.)' "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$registration_security_migration" "$profiles_migration" "$marketing_leads_migration" "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration" "$digital_page_products_migration" "$digital_page_orders_migration" "$bookings_migration" "$approval_policy_migration" "$marketing_schema_migration" "$journal_finance_policy_migration" "$general_ledger_policy_migration" "$commission_policy_migration" "$settlement_attempts_migration" "$credit_policies_migration" "$credit_accounts_migration" "$credit_periods_migration" "$payment_provider_events_migration" "$payment_events_policy_migration" "$settlement_transactions_policy_migration" "$wallet_accounts_policy_migration" "$wallet_transactions_policy_migration" "$smm_order_events_migration"
          # SMM/onboarding fixtures are schema-only, not data seed baselines.
          ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|update[[:space:]]+(public\\.)?|delete[[:space:]]+from|copy[[:space:]]+(public|private)\\.)' "$admins_migration" "$providers_migration" "$credentials_migration" "$provider_onboarding_migration"
          echo "PASS: exact untracked temporary baseline copies; no production rows are imported. Function fixtures are definition-only and are never invoked by replay."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create disposable local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/config.toml <<'TOML'
          project_id = "mantiqatix-migration-ci"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 1000

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 15

          [db.migrations]
          enabled = true
          schema_paths = []

          [db.seed]
          enabled = false

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:3000"
          additional_redirect_urls = ["http://127.0.0.1:3000"]
          jwt_expiry = 3600
          enable_signup = true

          [studio]
          enabled = false
          TOML

      - name: Login to Docker Hub when credentials are configured
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start disposable Supabase services without replaying migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_stash="$(mktemp -d)"
          restore_migrations() {
            shopt -s nullglob
            for file in "$migration_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$migration_stash" 2>/dev/null || true
          }
          trap restore_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            mv "$file" "$migration_stash/"
          done
          for attempt in 1 2 3 4; do
            if timeout --kill-after=15s 180s supabase start -x studio,edge-runtime,logflare,vector,supavisor; then
              restore_migrations
              trap - EXIT
              echo "Disposable services started; all migration SQL files restored for the dedicated replay step."
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              supabase stop --no-backup || true
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase local stack failed after four attempts." >&2
          exit 1

      - name: Normalize known legacy migration aliases in disposable replay only
        shell: bash
        run: |
          set -euo pipefail
          # These source filenames have legacy duplicate timestamps. The target versions
          # below match the read-only live Supabase migration ledger. Never rename source
          # migrations in Git; this normalization exists only on the disposable CI runner.
          rename_legacy_alias() {
            local source="$1"
            local target="$2"
            test -f "supabase/migrations/$source"
            if [[ -e "supabase/migrations/$target" ]]; then
              echo "P0 BLOCKED: canonical replay target already exists: $target" >&2
              exit 1
            fi
            mv "supabase/migrations/$source" "supabase/migrations/$target"
          }
          rename_legacy_alias "20260928020000_rc101_g6_rls_permissive_policy_hardening.sql" "20260928101022_rc101_g6_rls_permissive_policy_hardening.sql"
          rename_legacy_alias "20260928020000_rc102_g8_crm_notification_support_rls_hardening.sql" "20260928104107_rc102_g8_crm_notification_support_rls_hardening.sql"
          rename_legacy_alias "20260928060000_restore_registration_request_dml_grants.sql" "20260928034100_restore_registration_request_dml_grants.sql"
          rename_legacy_alias "20260928060000_rc109_harden_order_support_tenant_boundaries.sql" "20260928112420_rc109_harden_order_support_tenant_boundaries.sql"
          rename_legacy_alias "20260928190000_rc162_mantigo_trip_state_machine.sql" "20260928124303_rc162_mantigo_trip_state_machine.sql"
          rename_legacy_alias "20260928200000_rc164_mantigo_direct_delete_lockdown.sql" "20260928125655_rc164_mantigo_direct_delete_lockdown.sql"
          rename_legacy_alias "20260928200000_rc164_retire_legacy_mantigo_mutator.sql" "20260928125731_rc164_retire_legacy_mantigo_mutator.sql"
          rename_legacy_alias "20260928210000_rc172_restore_medical_booking_contract.sql" "20260928131753_rc172_restore_medical_booking_contract.sql"
          rename_legacy_alias "20260928190000_rc200_cross_tenant_customer_payment_authorization.sql" "20260928154527_rc200_cross_tenant_customer_payment_authorization.sql"
          rename_legacy_alias "20260928200000_rc206_geographic_ad_targeting_and_nearest_fallback.sql" "20260928161513_rc206_geographic_ad_targeting_and_nearest_fallback.sql"
          rename_legacy_alias "20260928210000_rc207_official_global_mnty_cover_ads.sql" "20260928174954_rc207_official_global_mnty_cover_ads.sql"
          node scripts/validate-migration-version-uniqueness.mjs
          echo "PASS: disposable replay uses the unique migration versions observed in the live ledger; repository history remains unchanged."

      - name: Replay every migration in repository timestamp order
        shell: bash
        run: |
          set -euo pipefail
          # The historical archive contains the EXECUTE-lockdown migration but not its
          # function's creation DDL. Keep the approved live-derived definition test-only:
          # replay up to its version, inject it into this disposable DB, then run the real
          # lockdown migration and assert its ACL contract before continuing the full chain.
          smm_bootstrap_baseline="supabase/tests/baselines/smm_bootstrap_first_admin.sql"
          test -f "$smm_bootstrap_baseline"

          # Supabase CLI's db reset --version did not stop before the next migration in
          # the observed CI run: it attempted 20260927033925 before the live-derived
          # function baseline was injected. Enforce the cutoff at the filesystem boundary:
          # temporarily remove every later migration from the disposable replay directory.
          # The EXIT trap restores every file even when reset fails.
          replay_migration_stash="$(mktemp -d)"
          restore_future_migrations() {
            shopt -s nullglob
            for file in "$replay_migration_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$replay_migration_stash" 2>/dev/null || true
          }
          trap restore_future_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{14}$ ]] && [[ "$version" > "20260927033924" ]]; then
              mv "$file" "$replay_migration_stash/"
            fi
          done
          test -f supabase/migrations/20260927033924_test_only_live_derived_smm_bootstrap_first_admin.sql
          if [[ -e supabase/migrations/20260927033925_harden_smm_bootstrap_trigger_execute_privilege.sql ]]; then
            echo "P0 BLOCKED: future SMM lockdown migration was not isolated before reset." >&2
            exit 1
          fi
          echo "Temporarily isolated $(find "$replay_migration_stash" -maxdepth 1 -type f -name '*.sql' | wc -l) future migrations; reset cutoff is enforced by file presence, not CLI version parsing."
          supabase db reset --local
          restore_future_migrations
          trap - EXIT

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          # This workflow writes its disposable Supabase config with db.port=54322
          # and the local default postgres password. Avoid depending on CLI env-output shape.
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          if ! pg_isready -d "$db_url"; then
            echo "P0 BLOCKED: disposable PostgreSQL is not reachable on the configured local port." >&2
            exit 1
          fi
          psql "$db_url" -v ON_ERROR_STOP=1 -f "$smm_bootstrap_baseline"
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT to_regprocedure('public.smm_bootstrap_first_admin()') IS NOT NULL" | grep -qx t

          # Apply the actual historical SQL directly for an isolated preflight assertion.
          # Supabase CLI's migration-up command has no target-version flag; after this direct
          # assertion, the ordinary migration runner reapplies the idempotent REVOKE and records
          # the migration in its own ledger.
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260927033925_harden_smm_bootstrap_trigger_execute_privilege.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT NOT has_function_privilege('anon', p.oid, 'EXECUTE') AND NOT has_function_privilege('authenticated', p.oid, 'EXECUTE') AND NOT EXISTS (SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a WHERE a.grantee = 0 AND a.privilege_type = 'EXECUTE') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'smm_bootstrap_first_admin' AND pg_get_function_identity_arguments(p.oid) = ''" | grep -qx t

          # Continue through every remaining migration in timestamp order. The targeted REVOKE
          # is safe to replay and will be recorded normally in the local migration ledger.
          # Prove that the disposable settlement-policy compatibility migration is actually
          # applied by Supabase's migration runner before allowing the later ALTER POLICY to run.
          # Earlier CI showed 40493 onward being applied while the injected 40492 policy migration
          # was absent from the log; stage the runner at this boundary and verify both ledger + catalog.
          policy_checkpoint_stash="$(mktemp -d)"
          restore_policy_checkpoint_migrations() {
            shopt -s nullglob
            for file in "$policy_checkpoint_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$policy_checkpoint_stash" 2>/dev/null || true
          }
          trap restore_policy_checkpoint_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{14}$ ]] && [[ "$version" > "20260927140492" ]]; then
              mv "$file" "$policy_checkpoint_stash/"
            fi
          done
          echo "Running staged migration checkpoint through 20260927140492."
          supabase migration up --local
          restore_policy_checkpoint_migrations
          trap - EXIT
          echo "Checkpoint ledger rows:"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT version, name FROM supabase_migrations.schema_migrations WHERE version >= '20260927140490' AND version <= '20260927140500' ORDER BY version;"
          echo "Checkpoint policy catalog:"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check FROM pg_policies WHERE schemaname = 'public' AND tablename = 'settlement_transactions' AND policyname = 'settlement_transactions_finance_read';"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_accounts' AND policyname = 'wallet_accounts_finance_read';"
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140492') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'settlement_transactions' AND policyname = 'settlement_transactions_finance_read') AND EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140486') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_accounts' AND policyname = 'wallet_accounts_finance_read') AND EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140485') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_transactions' AND policyname = 'wallet_transactions_finance_read')" | grep -qx t

          # Continue with the remaining migrations only after the staged baseline is present
          # in both the local migration ledger and PostgreSQL policy catalog.
          supabase migration up --local

      - name: Record local migration ledger
        run: supabase migration list --local

      - name: Verify replay completed
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
          echo "Full disposable Supabase migration replay completed."
