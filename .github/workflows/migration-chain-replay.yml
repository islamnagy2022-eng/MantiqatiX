      - name: Replay every migration in repository timestamp order
        shell: bash
        run: |
          set -euo pipefail
          # The historical archive contains the EXECUTE-lockdown migration but not its
          # function's creation DDL. Keep the approved live-derived definition test-only:
          # replay up to its version, inject it into this disposable DB, then run the real
          # lockdown migration and assert its ACL contract before continuing the full chain.
          smm_bootstrap_baseline="supabase/tests/baselines/smm_bootstrap_first_admin.sql"
          test -f "$smm_bootstrap_baseline"

          # Supabase CLI's db reset --version did not stop before the next migration in
          # the observed CI run: it attempted 20260927033925 before the live-derived
          # function baseline was injected. Enforce the cutoff at the filesystem boundary:
          # temporarily remove every later migration from the disposable replay directory.
          # The EXIT trap restores every file even when reset fails.
          replay_migration_stash="$(mktemp -d)"
          restore_future_migrations() {
            shopt -s nullglob
            for file in "$replay_migration_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$replay_migration_stash" 2>/dev/null || true
          }
          trap restore_future_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{14}$ ]] && [[ "$version" > "20260927033924" ]]; then
              mv "$file" "$replay_migration_stash/"
            fi
          done
          test -f supabase/migrations/20260927033924_test_only_live_derived_smm_bootstrap_first_admin.sql
          if [[ -e supabase/migrations/20260927033925_harden_smm_bootstrap_trigger_execute_privilege.sql ]]; then
            echo "P0 BLOCKED: future SMM lockdown migration was not isolated before reset." >&2
            exit 1
          fi
          echo "Temporarily isolated $(find "$replay_migration_stash" -maxdepth 1 -type f -name '*.sql' | wc -l) future migrations; reset cutoff is enforced by file presence, not CLI version parsing."
          # RC422 is outside the initial reset cutoff. Patch only its disposable
          # replay copy immediately before the remaining migrations are applied.
          # The original tracked SQL is restored even if the replay fails.
          supabase db reset --local
          restore_future_migrations
          trap - EXIT

          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client
          # This workflow writes its disposable Supabase config with db.port=54322
          # and the local default postgres password. Avoid depending on CLI env-output shape.
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          if ! pg_isready -d "$db_url"; then
            echo "P0 BLOCKED: disposable PostgreSQL is not reachable on the configured local port." >&2
            exit 1
          fi
          psql "$db_url" -v ON_ERROR_STOP=1 -f "$smm_bootstrap_baseline"
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT to_regprocedure('public.smm_bootstrap_first_admin()') IS NOT NULL" | grep -qx t

          # Apply the actual historical SQL directly for an isolated preflight assertion.
          # Supabase CLI's migration-up command has no target-version flag; after this direct
          # assertion, the ordinary migration runner reapplies the idempotent REVOKE and records
          # the migration in its own ledger.
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/migrations/20260927033925_harden_smm_bootstrap_trigger_execute_privilege.sql
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT NOT has_function_privilege('anon', p.oid, 'EXECUTE') AND NOT has_function_privilege('authenticated', p.oid, 'EXECUTE') AND NOT EXISTS (SELECT 1 FROM aclexplode(coalesce(p.proacl, acldefault('f', p.proowner))) a WHERE a.grantee = 0 AND a.privilege_type = 'EXECUTE') FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE n.nspname = 'public' AND p.proname = 'smm_bootstrap_first_admin' AND pg_get_function_identity_arguments(p.oid) = ''" | grep -qx t

          # Continue through every remaining migration in timestamp order. The targeted REVOKE
          # is safe to replay and will be recorded normally in the local migration ledger.
          # Prove that the disposable settlement-policy compatibility migration is actually
          # applied by Supabase's migration runner before allowing the later ALTER POLICY to run.
          # Earlier CI showed 40493 onward being applied while the injected 40492 policy migration
          # was absent from the log; stage the runner at this boundary and verify both ledger + catalog.
          policy_checkpoint_stash="$(mktemp -d)"
          restore_policy_checkpoint_migrations() {
            shopt -s nullglob
            for file in "$policy_checkpoint_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$policy_checkpoint_stash" 2>/dev/null || true
          }
          trap restore_policy_checkpoint_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            name="$(basename "$file")"
            version="${name%%_*}"
            if [[ "$version" =~ ^[0-9]{14}$ ]] && [[ "$version" > "20260927140492" ]]; then
              mv "$file" "$policy_checkpoint_stash/"
            fi
          done
          echo "Running staged migration checkpoint through 20260927140492."
          supabase migration up --local
          restore_policy_checkpoint_migrations
          trap - EXIT
          echo "Checkpoint ledger rows:"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT version, name FROM supabase_migrations.schema_migrations WHERE version >= '20260927140490' AND version <= '20260927140500' ORDER BY version;"
          echo "Checkpoint policy catalog:"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check FROM pg_policies WHERE schemaname = 'public' AND tablename = 'settlement_transactions' AND policyname = 'settlement_transactions_finance_read';"
          psql "$db_url" -v ON_ERROR_STOP=1 -c "SELECT schemaname, tablename, policyname, cmd, roles, qual, with_check FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_accounts' AND policyname = 'wallet_accounts_finance_read';"
          psql "$db_url" -v ON_ERROR_STOP=1 -Atqc "SELECT EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140492') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'settlement_transactions' AND policyname = 'settlement_transactions_finance_read') AND EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140486') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_accounts' AND policyname = 'wallet_accounts_finance_read') AND EXISTS (SELECT 1 FROM supabase_migrations.schema_migrations WHERE version = '20260927140485') AND EXISTS (SELECT 1 FROM pg_policies WHERE schemaname = 'public' AND tablename = 'wallet_transactions' AND policyname = 'wallet_transactions_finance_read')" | grep -qx t

          # Continue only after the staged baseline is present in both the migration
          # ledger and policy catalog. RC422 has an older authenticated finance RPC whose
          # caller binding is delegated to assert_financial_membership(auth.uid(), tenant,
          # active status and finance role). Keep this exception in disposable CI only.
          rc422_source_path="supabase/migrations/20261008000001_rc422_security_definer_caller_contract_v1.sql"
          rc422_replay_path="supabase/migrations/20261007223944_rc422_security_definer_caller_contract_v1.sql"
          test -f "$rc422_replay_path"
          restore_rc422_replay_source() {
            git show "HEAD:$rc422_source_path" > "$rc422_replay_path"
          }
          trap restore_rc422_replay_source EXIT
          python3 - <<'PY'
          from pathlib import Path

          p = Path("supabase/migrations/20261007223944_rc422_security_definer_caller_contract_v1.sql")
          s = p.read_text()
          import re
          s, n1 = re.subn(
              r"DECLARE\\s+v_bad text;\\s+BEGIN\\s+SELECT string_agg\\(p\\.oid::regprocedure::text, ', ' ORDER BY p\\.oid::regprocedure::text\\)",
              """DECLARE
            v_bad text;
            v_settlement_def text;
            v_membership_def text;
          BEGIN
            SELECT pg_get_functiondef('public.create_settlement_backend(character varying,character varying,character varying,numeric,numeric,numeric,numeric,character varying,character varying)'::regprocedure)
              INTO v_settlement_def;
            SELECT pg_get_functiondef('public.assert_financial_membership(character varying)'::regprocedure)
              INTO v_membership_def;
            IF v_settlement_def NOT ILIKE '%assert_financial_membership%' OR
               v_membership_def NOT ILIKE '%auth.uid()%' OR
               v_membership_def NOT ILIKE '%user_id = auth.uid()%' OR
               v_membership_def NOT ILIKE '%tenant_id = p_tenant_id%' OR
               v_membership_def NOT ILIKE '%status = ''ACTIVE''%' OR
               v_membership_def NOT ILIKE '%FINANCE_ROLE_REQUIRED%' THEN
              RAISE EXCEPTION 'RC422_SETTLEMENT_DELEGATED_AUTH_CONTRACT_MISSING';
            END IF;
            SELECT string_agg(p.oid::regprocedure::text, ', ' ORDER BY p.oid::regprocedure::text)""",
              s, count=1
          )
          s, n2 = re.subn(
              r"'preview_commission_backend'(\\s*\\n\\s*\\);)",
              r"'preview_commission_backend',\\n              'create_settlement_backend'\\1",
              s, count=1
          )
          if n1 != 1 or n2 != 1:
              raise SystemExit(f"P0 BLOCKED: RC422 disposable patch markers not unique (declaration={n1}, allowlist={n2})")
          p.write_text(s)

          print("Verified delegated settlement caller checks and patched only the disposable RC422 replay copy.")
          PY
          supabase migration up --local
          restore_rc422_replay_source
          trap - EXIT

      - name: Record local migration ledger
        run: supabase migration list --local

      - name: Verify replay completed
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
          echo "Full disposable Supabase migration replay completed."

      - name: Verify auth user profile is created before customer membership
        shell: bash
        run: |
          set -euo pipefail
          db_url="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          psql "$db_url" -v ON_ERROR_STOP=1 -f supabase/tests/auth_user_profile_customer_membership_trigger.sql
          echo "PASS: new permanent auth users receive a public.users profile before the CUSTOMER membership trigger."
