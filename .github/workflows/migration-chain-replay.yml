name: Disposable Supabase Migration Chain Replay

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/**"
      - "scripts/validate-historical-schema-baseline.mjs"
      - ".github/workflows/migration-chain-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migration-chain-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  replay-all-migrations:
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fail closed if the historical schema baseline is missing
        run: node scripts/validate-historical-schema-baseline.mjs

      - name: Inject approved live-derived compatibility baselines into disposable replay only
        shell: bash
        run: |
          set -euo pipefail
          legacy_businesses_baseline="supabase/tests/baselines/legacy_businesses.sql"
          legacy_products_baseline="supabase/tests/baselines/legacy_products.sql"
          legacy_orders_baseline="supabase/tests/baselines/legacy_orders.sql"
          registration_baseline="supabase/tests/baselines/account_registration_requests.sql"
          profiles_baseline="supabase/tests/baselines/marketing_provider_profiles.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          legacy_businesses_migration="supabase/migrations/20260807999997_test_only_legacy_businesses_baseline.sql"
          legacy_products_migration="supabase/migrations/20260807999998_test_only_legacy_products_baseline.sql"
          legacy_orders_migration="supabase/migrations/20260807999999_test_only_legacy_orders_baseline.sql"
          registration_migration="supabase/migrations/20260927074155_test_only_live_derived_registration_baseline.sql"
          profiles_migration="supabase/migrations/20260927074156_test_only_live_derived_provider_profiles_baseline.sql"
          providers_migration="supabase/migrations/20260927074158_test_only_approved_smm_providers_baseline.sql"
          credentials_migration="supabase/migrations/20260927074159_test_only_approved_smm_provider_credentials_baseline.sql"
          legacy_functions_baseline="supabase/tests/baselines/legacy_security_definer_functions.sql"
          legacy_functions_migration="supabase/migrations/20260927074160_test_only_live_derived_security_definer_baseline.sql"
          for file in "$legacy_businesses_baseline" "$legacy_products_baseline" "$legacy_orders_baseline" "$registration_baseline" "$profiles_baseline" "$providers_baseline" "$credentials_baseline" "$legacy_functions_baseline"; do test -f "$file"; done
          for file in "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$profiles_migration" "$providers_migration" "$credentials_migration" "$legacy_functions_migration"; do test ! -e "$file"; done
          cp "$legacy_businesses_baseline" "$legacy_businesses_migration"
          cp "$legacy_products_baseline" "$legacy_products_migration"
          cp "$legacy_orders_baseline" "$legacy_orders_migration"
          cp "$registration_baseline" "$registration_migration"
          cp "$profiles_baseline" "$profiles_migration"
          cp "$providers_baseline" "$providers_migration"
          cp "$credentials_baseline" "$credentials_migration"
          cp "$legacy_functions_baseline" "$legacy_functions_migration"
          echo "Injected live-derived schema compatibility baselines and function definitions into disposable CI only."
          echo "These are not historical creation migrations and must never be applied to production."

      - name: Verify temporary baselines are exact schema-only copies
        shell: bash
        run: |
          set -euo pipefail
          legacy_businesses_baseline="supabase/tests/baselines/legacy_businesses.sql"
          legacy_products_baseline="supabase/tests/baselines/legacy_products.sql"
          legacy_orders_baseline="supabase/tests/baselines/legacy_orders.sql"
          legacy_businesses_migration="supabase/migrations/20260807999997_test_only_legacy_businesses_baseline.sql"
          legacy_products_migration="supabase/migrations/20260807999998_test_only_legacy_products_baseline.sql"
          legacy_orders_migration="supabase/migrations/20260807999999_test_only_legacy_orders_baseline.sql"
          registration_baseline="supabase/tests/baselines/account_registration_requests.sql"
          profiles_baseline="supabase/tests/baselines/marketing_provider_profiles.sql"
          providers_baseline="supabase/tests/baselines/smm_providers.sql"
          credentials_baseline="supabase/tests/baselines/smm_provider_credentials.sql"
          registration_migration="supabase/migrations/20260927074155_test_only_live_derived_registration_baseline.sql"
          profiles_migration="supabase/migrations/20260927074156_test_only_live_derived_provider_profiles_baseline.sql"
          providers_migration="supabase/migrations/20260927074158_test_only_approved_smm_providers_baseline.sql"
          credentials_migration="supabase/migrations/20260927074159_test_only_approved_smm_provider_credentials_baseline.sql"
          legacy_functions_baseline="supabase/tests/baselines/legacy_security_definer_functions.sql"
          legacy_functions_migration="supabase/migrations/20260927074160_test_only_live_derived_security_definer_baseline.sql"
          cmp -s "$legacy_businesses_baseline" "$legacy_businesses_migration"
          cmp -s "$legacy_products_baseline" "$legacy_products_migration"
          cmp -s "$legacy_orders_baseline" "$legacy_orders_migration"
          cmp -s "$registration_baseline" "$registration_migration"
          cmp -s "$profiles_baseline" "$profiles_migration"
          cmp -s "$providers_baseline" "$providers_migration"
          cmp -s "$credentials_baseline" "$credentials_migration"
          cmp -s "$legacy_functions_baseline" "$legacy_functions_migration"
          for file in "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$profiles_migration" "$providers_migration" "$credentials_migration" "$legacy_functions_migration"; do ! git ls-files --error-unmatch "$file" >/dev/null 2>&1; done
          ! grep -Eiq '^[[:space:]]*(insert[[:space:]]+into|copy[[:space:]]+public\.)' "$legacy_businesses_migration" "$legacy_products_migration" "$legacy_orders_migration" "$registration_migration" "$profiles_migration" "$providers_migration" "$credentials_migration"
          echo "PASS: exact untracked temporary baseline copies; no production rows are imported. Function fixture is definition-only and is never invoked by replay."

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Create disposable local Supabase config
        shell: bash
        run: |
          set -euo pipefail
          cat > supabase/config.toml <<'TOML'
          project_id = "mantiqatix-migration-ci"

          [api]
          enabled = true
          port = 54321
          schemas = ["public", "graphql_public"]
          extra_search_path = ["public", "extensions"]
          max_rows = 1000

          [db]
          port = 54322
          shadow_port = 54320
          major_version = 15

          [db.migrations]
          enabled = true
          schema_paths = []

          [db.seed]
          enabled = false

          [auth]
          enabled = true
          site_url = "http://127.0.0.1:3000"
          additional_redirect_urls = ["http://127.0.0.1:3000"]
          jwt_expiry = 3600
          enable_signup = true

          [studio]
          enabled = false
          TOML

      - name: Login to Docker Hub when credentials are configured
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start disposable Supabase services without replaying migrations
        shell: bash
        run: |
          set -euo pipefail
          migration_stash="$(mktemp -d)"
          restore_migrations() {
            shopt -s nullglob
            for file in "$migration_stash"/*.sql; do
              mv "$file" supabase/migrations/
            done
            rmdir "$migration_stash" 2>/dev/null || true
          }
          trap restore_migrations EXIT
          shopt -s nullglob
          for file in supabase/migrations/*.sql; do
            mv "$file" "$migration_stash/"
          done
          for attempt in 1 2 3 4; do
            if timeout --kill-after=15s 180s supabase start -x studio,edge-runtime,logflare,vector,supavisor; then
              restore_migrations
              trap - EXIT
              echo "Disposable services started; all migration SQL files restored for the dedicated replay step."
              exit 0
            fi
            if [[ "$attempt" -lt 4 ]]; then
              supabase stop --no-backup || true
              sleep $((attempt * 30))
            fi
          done
          echo "Supabase local stack failed after four attempts." >&2
          exit 1

      - name: Replay every migration in repository timestamp order
        run: supabase db reset --local

      - name: Record local migration ledger
        run: supabase migration list --local

      - name: Verify replay completed
        shell: bash
        run: |
          set -euo pipefail
          test -d supabase/migrations
          test "$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' | wc -l)" -gt 0
          echo "Full disposable Supabase migration replay completed."
