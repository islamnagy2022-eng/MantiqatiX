                source_sql="$(sed '/^[[:space:]]*--/d' "$source_path" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
                target_sql="$(sed '/^[[:space:]]*--/d' "$target_path" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
                if [[ -n "$source_sql" && "$source_sql" == "$target_sql" ]]; then
