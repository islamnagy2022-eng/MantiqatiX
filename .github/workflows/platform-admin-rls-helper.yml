name: Platform Admin RLS Helper Registry Hardening
on:
  pull_request:
    paths:
      - "supabase/migrations/20261119040000_rc484_registry_backed_is_platform_admin.sql"
      - "supabase/tests/rc484_platform_admin_fixture.sql"
      - "supabase/tests/rc484_platform_admin_integration.sql"
      - "scripts/validate-rc484-platform-admin-rls-helper.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - ".github/workflows/platform-admin-rls-helper.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261119040000_rc484_registry_backed_is_platform_admin.sql"
      - "supabase/tests/rc484_platform_admin_fixture.sql"
      - "supabase/tests/rc484_platform_admin_integration.sql"
      - "scripts/validate-rc484-platform-admin-rls-helper.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - ".github/workflows/platform-admin-rls-helper.yml"
  workflow_dispatch: {}

jobs:
  rc484-platform-admin-rls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc484_platform_admin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rc484_platform_admin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate RC484 source and release-chain wiring
        run: node scripts/validate-rc484-platform-admin-rls-helper.mjs
      - name: Apply isolated RLS fixture, RC484 migration, and adversarial behavior tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc484_platform_admin_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261119040000_rc484_registry_backed_is_platform_admin.sql "$pg_container:/tmp/rc484.sql"
          docker cp supabase/tests/rc484_platform_admin_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d rc484_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d rc484_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/rc484.sql
          docker exec "$pg_container" psql -U postgres -d rc484_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
