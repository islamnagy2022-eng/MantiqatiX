name: S06 Payment Integrity Regressions
on:
  pull_request:
    branches: ['**']
    paths:
      - 'supabase/tests/s06_payment_integrity_regression.sql'
      - 'supabase/tests/s06_payment_integrity_concurrency_seed.sql'
      - 'supabase/tests/s06_payment_integrity_concurrency_assert.sql'
      - 'supabase/tests/s06_payment_conflicting_concurrency_seed.sql'
      - 'supabase/tests/s06_payment_conflicting_concurrency_assert.sql'
      - 'tests/s06-payment-integrity.test.mjs'
      - 'supabase/functions/paymob-webhook/**'
      - 'supabase/functions/digital-page-payment-intent/**'
      - '.github/workflows/s06-payment-integrity.yml'
      - 'supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql'
  push:
    branches: [main]
    paths:
      - 'supabase/tests/s06_payment_integrity_regression.sql'
      - 'tests/s06-payment-integrity.test.mjs'
      - 'supabase/functions/paymob-webhook/**'
      - 'supabase/functions/digital-page-payment-intent/**'
      - '.github/workflows/s06-payment-integrity.yml'
      - 'supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql'
permissions:
  contents: read
jobs:
  s06-payment-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_s06_payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_s06_payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Record exact tested source revision
        run: git rev-parse HEAD
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Paymob webhook runtime
        run: deno check --no-lock supabase/functions/paymob-webhook/index.ts
      - name: Run S06 webhook and payment-intent source regressions
        run: node --test tests/s06-payment-integrity.test.mjs
      - name: Prepare disposable PostgreSQL roles and fixture
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN'
          docker cp supabase/tests/rc431_digital_page_payment_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql "$pg_container:/tmp/migration.sql"
          docker cp supabase/tests/s06_payment_integrity_regression.sql "$pg_container:/tmp/test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
          docker cp supabase/tests/s06_payment_integrity_concurrency_seed.sql "$pg_container:/tmp/concurrency-seed.sql"
          docker cp supabase/tests/s06_payment_integrity_concurrency_assert.sql "$pg_container:/tmp/concurrency-assert.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/concurrency-seed.sql

          # Race two independent sessions against the same provider event and order.
          # Row locking must yield exactly one applied result and one idempotent replay.
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -At -c "begin; select pg_sleep(0.25); select public.process_verified_digital_page_payment_backend('10000000-0000-4000-8000-000000006063','paymob:s06-concurrent-tx','TRANSACTION','SUCCEEDED',true,249.50,'EGP','s06-concurrent-tx','s06-concurrency-provider-order','{}'::jsonb); commit;" > "$RUNNER_TEMP/s06-concurrency-a.log" &
          pid_a=$!
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -At -c "begin; select pg_sleep(0.25); select public.process_verified_digital_page_payment_backend('10000000-0000-4000-8000-000000006063','paymob:s06-concurrent-tx','TRANSACTION','SUCCEEDED',true,249.50,'EGP','s06-concurrent-tx','s06-concurrency-provider-order','{}'::jsonb); commit;" > "$RUNNER_TEMP/s06-concurrency-b.log" &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          cat "$RUNNER_TEMP/s06-concurrency-a.log" "$RUNNER_TEMP/s06-concurrency-b.log" > "$RUNNER_TEMP/s06-concurrency-combined.log"
          test "$(grep -c '"idempotent": false' "$RUNNER_TEMP/s06-concurrency-combined.log")" -eq 1
          test "$(grep -c '"idempotent": true' "$RUNNER_TEMP/s06-concurrency-combined.log")" -eq 1
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/concurrency-assert.sql
          docker cp supabase/tests/s06_payment_conflicting_concurrency_seed.sql "$pg_container:/tmp/conflicting-seed.sql"
          docker cp supabase/tests/s06_payment_conflicting_concurrency_assert.sql "$pg_container:/tmp/conflicting-assert.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/conflicting-seed.sql

          # Race SUCCEEDED and FAILED payloads using the same external event ID.
          # One may win; the other must fail with the explicit replay-status mismatch.
          if docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -At -c "begin; select pg_sleep(0.25); select public.process_verified_digital_page_payment_backend('10000000-0000-4000-8000-000000006064','paymob:s06-conflicting-race','TRANSACTION','SUCCEEDED',true,249.50,'EGP','s06-conflicting-race','s06-conflicting-race-order','{}'::jsonb); commit;" > "$RUNNER_TEMP/s06-conflict-a.log" 2>&1; then
            result_a=SUCCESS
          else
            result_a=REJECTED
            grep -q 'DIGITAL_PAGE_EVENT_REPLAY_STATUS_MISMATCH' "$RUNNER_TEMP/s06-conflict-a.log"
          fi &
          pid_a=$!
          if docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -At -c "begin; select pg_sleep(0.25); select public.process_verified_digital_page_payment_backend('10000000-0000-4000-8000-000000006064','paymob:s06-conflicting-race','TRANSACTION','FAILED',true,249.50,'EGP','s06-conflicting-race','s06-conflicting-race-order','{}'::jsonb); commit;" > "$RUNNER_TEMP/s06-conflict-b.log" 2>&1; then
            result_b=SUCCESS
          else
            result_b=REJECTED
            grep -q 'DIGITAL_PAGE_EVENT_REPLAY_STATUS_MISMATCH' "$RUNNER_TEMP/s06-conflict-b.log"
          fi &
          pid_b=$!
          wait "$pid_a"
          wait "$pid_b"
          if grep -q 'DIGITAL_PAGE_EVENT_REPLAY_STATUS_MISMATCH' "$RUNNER_TEMP/s06-conflict-a.log"; then
            conflict_a=1
          else
            conflict_a=0
          fi
          if grep -q 'DIGITAL_PAGE_EVENT_REPLAY_STATUS_MISMATCH' "$RUNNER_TEMP/s06-conflict-b.log"; then
            conflict_b=1
          else
            conflict_b=0
          fi
          test $((conflict_a + conflict_b)) -eq 1
          test "$(grep -l '"ok": true' "$RUNNER_TEMP/s06-conflict-a.log" "$RUNNER_TEMP/s06-conflict-b.log" | wc -l)" -eq 1
          docker exec "$pg_container" psql -U postgres -d mantiqatix_s06_payment_test -v ON_ERROR_STOP=1 -f /tmp/conflicting-assert.sql
