name: Public Directory Keyset Pagination
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/_shared/public-directory-pagination.mjs"
      - "supabase/functions/_shared/public-directory-pagination.test.mjs"
      - "supabase/functions/public-catalog-directory/index.ts"
      - "apps/catalog-frontend/src/lib/production.ts"
      - "apps/catalog-frontend/src/context/AppContext.tsx"
      - "apps/catalog-frontend/src/components/DirectoryView.tsx"
      - "scripts/validate-public-directory-pagination.mjs"
      - ".github/workflows/public-directory-keyset-pagination.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/_shared/public-directory-pagination.mjs"
      - "supabase/functions/_shared/public-directory-pagination.test.mjs"
      - "supabase/functions/public-catalog-directory/index.ts"
      - "apps/catalog-frontend/src/lib/production.ts"
      - "apps/catalog-frontend/src/context/AppContext.tsx"
      - "apps/catalog-frontend/src/components/DirectoryView.tsx"
      - "scripts/validate-public-directory-pagination.mjs"
      - ".github/workflows/public-directory-keyset-pagination.yml"
permissions:
  contents: read
jobs:
  keyset-pagination:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate keyset, cursor, contact, and gallery source contracts
        run: node scripts/validate-public-directory-pagination.mjs
      - name: Test HMAC cursor and public filter scope
        run: node --test supabase/functions/_shared/public-directory-pagination.test.mjs
      - name: Type-check public directory Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/public-catalog-directory/index.ts
