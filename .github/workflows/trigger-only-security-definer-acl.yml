name: Trigger-only SECURITY DEFINER ACL Integration

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/tests/trigger_only_security_definer_acl_integration.sql"
      - "supabase/migrations/20261031100000_rc463_trigger_only_security_definer_acl.sql"
      - ".github/workflows/trigger-only-security-definer-acl.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/tests/trigger_only_security_definer_acl_integration.sql"
      - ".github/workflows/trigger-only-security-definer-acl.yml"

permissions:
  contents: read

jobs:
  trigger-only-acl-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_trigger_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_trigger_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply trigger ACL and behavior integration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/trigger_only_security_definer_acl_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_trigger_acl_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
