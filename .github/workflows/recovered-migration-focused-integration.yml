      - 'supabase/migrations/20261009200000_rc434_atomic_erp_purchase_receiving.sql'
      - 'supabase/migrations/20261009210000_rc435_subscription_provider_intent_claim.sql'
      - 'supabase/migrations/20261009220000_rc436_atomic_financial_journal.sql'
      - 'supabase/migrations/20261010010000_rc439_encrypted_checkout_recovery.sql'
      - 'supabase/migrations/20261010020000_rc440_exposed_security_definer_search_path.sql'
      - 'supabase/tests/rc425_*'
      - 'supabase/tests/rc431_*'
      - 'supabase/tests/rc434_*'
      - 'supabase/tests/rc435_*'
      - 'supabase/tests/rc436_*'
      - 'supabase/tests/rc439_*'
      - 'supabase/tests/rc440_*'
      - 'supabase/migrations/20261011020000_rc457_financial_journal_idempotency_rpc_convergence.sql'
      - 'supabase/migrations/20261011030000_rc458_erp_branch_organization_scope.sql'
      - 'supabase/migrations/20261012040000_rc462_mantigo_platform_admin_guard_malformed_permissions.sql'
      - 'supabase/tests/rc441_*'
      - 'supabase/tests/rc437_*'
      - 'supabase/tests/rc458_*'
      - 'supabase/tests/rc450_*'
      - 'supabase/tests/rc457_*'
      - 'supabase/migrations/20261013200000_rc523_mantigo_financial_report_canonical_columns.sql'
      - 'supabase/tests/rc523_*'
      - '.github/workflows/recovered-migration-focused-integration.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261009120000_rc425_atomic_mantigo_paymob_payment.sql'
      - 'supabase/migrations/20261009180000_rc431_harden_deployed_digital_page_payment_rpc.sql'
      - 'supabase/migrations/20261009200000_rc434_atomic_erp_purchase_receiving.sql'
      - 'supabase/migrations/20261009210000_rc435_subscription_provider_intent_claim.sql'
      - 'supabase/migrations/20261009220000_rc436_atomic_financial_journal.sql'
      - 'supabase/migrations/20261010010000_rc439_encrypted_checkout_recovery.sql'
      - 'supabase/migrations/20261010020000_rc440_exposed_security_definer_search_path.sql'
      - 'supabase/tests/rc425_*'
      - 'supabase/tests/rc431_*'
      - 'supabase/tests/rc434_*'
      - 'supabase/tests/rc435_*'
      - 'supabase/tests/rc436_*'
      - 'supabase/tests/rc439_*'
      - 'supabase/tests/rc440_*'
      - 'supabase/migrations/20261011020000_rc457_financial_journal_idempotency_rpc_convergence.sql'
      - 'supabase/migrations/20261011030000_rc458_erp_branch_organization_scope.sql'
      - 'supabase/migrations/20261012040000_rc462_mantigo_platform_admin_guard_malformed_permissions.sql'
      - 'supabase/tests/rc441_*'
      - 'supabase/tests/rc437_*'
      - 'supabase/tests/rc458_*'
      - 'supabase/tests/rc450_*'
      - 'supabase/tests/rc457_*'
      - 'supabase/migrations/20261013200000_rc523_mantigo_financial_report_canonical_columns.sql'
      - 'supabase/tests/rc523_*'
      - '.github/workflows/recovered-migration-focused-integration.yml'
permissions:
  contents: read
jobs:
  mantigo-paymob-atomicity-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_mantigo_paymob_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_mantigo_paymob_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test RC425 atomic MantiGo Paymob processing
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN'
          docker cp supabase/tests/rc425_mantigo_paymob_fixture.sql "$pg_container:/tmp/rc425_fixture.sql"
          docker cp supabase/migrations/20261009120000_rc425_atomic_mantigo_paymob_payment.sql "$pg_container:/tmp/rc425_migration.sql"
          docker cp supabase/tests/rc425_mantigo_paymob_integration.sql "$pg_container:/tmp/rc425_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -f /tmp/rc425_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -f /tmp/rc425_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_mantigo_paymob_test -v ON_ERROR_STOP=1 -f /tmp/rc425_test.sql


