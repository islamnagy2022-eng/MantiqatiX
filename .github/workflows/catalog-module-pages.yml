name: Legacy Catalog Module Validation (No Pages Deployment)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/catalog-module-pages.yml'
      - 'scripts/validate-catalog-admin-cors-boundary.mjs'
      - 'scripts/validate-catalog-production-module.mjs'
      - 'supabase/config.toml'
      - 'supabase/functions/catalog-admin/index.ts'
      - 'supabase/functions/public-catalog/index.ts'
      - 'supabase/migrations/20261026092940_rc107_catalog_manager_business_branch_scope.sql'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/rbac.js'
      - 'web/catalog-module.js'
      - 'web/catalog/**'
      - 'web/preview/catalog-demo/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/catalog-module-pages.yml'
      - 'scripts/validate-catalog-admin-cors-boundary.mjs'
      - 'scripts/validate-catalog-production-module.mjs'
      - 'supabase/config.toml'
      - 'supabase/functions/catalog-admin/index.ts'
      - 'supabase/functions/public-catalog/index.ts'
      - 'supabase/migrations/20261026092940_rc107_catalog_manager_business_branch_scope.sql'
      - 'web/app.js'
      - 'web/index.html'
      - 'web/rbac.js'
      - 'web/catalog-module.js'
      - 'web/catalog/**'
      - 'web/preview/catalog-demo/**'

permissions:
  contents: read

concurrency:
  group: legacy-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate_legacy_catalog:
    name: Validate legacy catalog without publishing to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install validation dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Build browser Supabase SDK for source validation
        run: |
          set -euo pipefail
          mkdir -p web/vendor
          npx --yes esbuild build/supabase-entry.mjs --bundle --format=iife --global-name=MNTYSupabaseBundle --outfile=web/vendor/supabase.js --minify
          test -s web/vendor/supabase.js
      - name: Validate legacy catalog code and contracts
        run: |
          set -euo pipefail
          node --check web/rbac.js
          node --check web/app.js
          node --check web/catalog-module.js
          node --check web/catalog/catalog.js
          node scripts/validate-catalog-production-module.mjs
          node scripts/validate-catalog-admin-cors-boundary.mjs
          test -s web/catalog/index.html
          test -s web/catalog/catalog.css
          test -s web/catalog/catalog.js
          grep -Fq 'catalog-module.js?v=rc107-catalog-production' web/index.html
          grep -Fq 'signInWithGoogle' web/app.js
          grep -Fq 'id="google-auth"' web/app.js
          ! grep -Eq 'signInWithOtp|verifyOtp|signInWithPassword' web/app.js
      - name: Smoke test public catalog API contract
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('web/config.js','utf8');const m=s.match(/supabaseUrl:'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          SUPABASE_ANON_KEY="$(node -e "const s=require('fs').readFileSync('web/config.js','utf8');const m=s.match(/supabaseKey:'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/catalog-api-smoke.json --write-out '%{http_code}' \
            --header "apikey: ${SUPABASE_ANON_KEY}" \
            "${SUPABASE_URL}/functions/v1/public-catalog?businessId=00000000-0000-4000-8000-000000000000")"
          cat /tmp/catalog-api-smoke.json
          test "${HTTP_CODE}" = "404"
          grep -Fq '"error":"BUSINESS_NOT_PUBLIC"' /tmp/catalog-api-smoke.json
          echo "LEGACY_CATALOG_API_SMOKE=PASS"
