name: RC460 Taxonomy Definition Audit

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/20261030150000_rc460_taxonomy_definition_audit.sql"
      - "supabase/tests/rc460_taxonomy_definition_audit_fixture.sql"
      - "supabase/tests/rc460_taxonomy_definition_audit_integration.sql"
      - ".github/workflows/rc460-taxonomy-definition-audit.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261030150000_rc460_taxonomy_definition_audit.sql"
      - "supabase/tests/rc460_taxonomy_definition_audit_fixture.sql"
      - "supabase/tests/rc460_taxonomy_definition_audit_integration.sql"
      - ".github/workflows/rc460-taxonomy-definition-audit.yml"

permissions:
  contents: read

jobs:
  rc460-taxonomy-definition-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc460_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc460_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply isolated fixture, forward migration and regression assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc460_taxonomy_definition_audit_fixture.sql "$pg_container:/tmp/rc460_fixture.sql"
          docker cp supabase/migrations/20261030150000_rc460_taxonomy_definition_audit.sql "$pg_container:/tmp/rc460_migration.sql"
          docker cp supabase/tests/rc460_taxonomy_definition_audit_integration.sql "$pg_container:/tmp/rc460_integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc460_test -v ON_ERROR_STOP=1 -f /tmp/rc460_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc460_test -v ON_ERROR_STOP=1 -f /tmp/rc460_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc460_test -v ON_ERROR_STOP=1 -f /tmp/rc460_integration.sql
