name: Financial Journal Service-Role Boundary

on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/20261010180000_rc450_financial_journal_service_role_boundary.sql"
      - "supabase/functions/financial-journal/index.ts"
      - "supabase/functions/post-financial-journal/index.ts"
      - "supabase/tests/rc450_financial_journal_fixture.sql"
      - "supabase/tests/rc450_financial_journal_integration.sql"
      - "scripts/validate-financial-journal-service-role.mjs"
      - ".github/workflows/financial-journal-service-role-boundary.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/20261010180000_rc450_financial_journal_service_role_boundary.sql"
      - "supabase/functions/financial-journal/index.ts"
      - "supabase/functions/post-financial-journal/index.ts"
      - "supabase/tests/rc450_financial_journal_fixture.sql"
      - "supabase/tests/rc450_financial_journal_integration.sql"
      - "scripts/validate-financial-journal-service-role.mjs"
      - ".github/workflows/financial-journal-service-role-boundary.yml"

permissions:
  contents: read

jobs:
  financial-journal-service-role-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc450_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc450_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate service-role boundary source contract
        run: node scripts/validate-financial-journal-service-role.mjs
      - name: Apply disposable fixture, RC450, and behavioral regression
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc450_financial_journal_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261010180000_rc450_financial_journal_service_role_boundary.sql "$pg_container:/tmp/rc450.sql"
          docker cp supabase/tests/rc450_financial_journal_integration.sql "$pg_container:/tmp/test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc450_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc450_test -v ON_ERROR_STOP=1 -f /tmp/rc450.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc450_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
