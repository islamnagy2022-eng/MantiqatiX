name: Generate RC925 migration scaffold with pinned Supabase CLI

on:
  push:
    branches:
      - "fix/rc925-catalog-rpc-confirmed-auth-20261124"
    paths:
      - ".github/workflows/create-rc925-migration-scaffold.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Generate migration using Supabase CLI
        shell: bash
        run: |
          set -euo pipefail
          supabase --version
          supabase migration new rc925_catalog_rpc_confirmed_auth_boundary
          mapfile -t generated < <(find supabase/migrations -maxdepth 1 -type f -name '*_rc925_catalog_rpc_confirmed_auth_boundary.sql' -print)
          test "${#generated[@]}" -eq 1
          test -f "${generated[0]}"
          printf 'GENERATED_MIGRATION=%s\n' "${generated[0]}"
          cat "${generated[0]}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${generated[0]}"
          git commit -m "chore(db): generate RC925 scaffold with Supabase CLI"
          git push origin "HEAD:fix/rc925-catalog-rpc-confirmed-auth-20261124"
