name: Matrimony Profile Privacy Boundary
on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --check web/app.js
      - run: node scripts/validate-matrimony-profile-privacy.mjs
  matrimony-profile-privacy-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc565_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc565_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Run RC565 privacy boundary integration tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc565_matrimony_profile_fixture.sql "$pg_container:/tmp/rc565_fixture.sql"
          docker cp supabase/migrations/20261010070000_rc565_matrimony_public_profile_boundary.sql "$pg_container:/tmp/rc565_migration.sql"
          docker cp supabase/tests/rc565_matrimony_profile_integration.sql "$pg_container:/tmp/rc565_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc565_test -v ON_ERROR_STOP=1 -f /tmp/rc565_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc565_test -v ON_ERROR_STOP=1 -f /tmp/rc565_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc565_test -v ON_ERROR_STOP=1 -f /tmp/rc565_test.sql
