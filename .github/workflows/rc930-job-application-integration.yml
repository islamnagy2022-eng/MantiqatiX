name: RC930 job application deactivation serialization
on:
  pull_request:
    paths:
      - 'supabase/migrations/20261127010000_rc930_serialize_job_deactivation_and_application.sql'
      - 'supabase/tests/rc930_job_application_*.sql'
      - 'supabase/tests/rc930_job_application_*.sh'
      - '.github/workflows/rc930-job-application-integration.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc930_test
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U postgres -d rc930_test" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rc930_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Create disposable RC919 schema fixture
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rc919_job_application_fixture.sql
      - name: Apply RC919 inactive-job guard
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261125150000_rc919_reject_inactive_job_applications.sql
      - name: Apply RC930 row-lock serialization repair
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261127010000_rc930_serialize_job_deactivation_and_application.sql
      - name: Verify active, inactive, missing and duplicate application behavior
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/tests/rc930_job_application_integration.sql
      - name: Verify concurrent deactivation wins before a new submission
        run: bash supabase/tests/rc930_job_application_concurrency.sh
