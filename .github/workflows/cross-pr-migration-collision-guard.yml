name: Cross-PR Migration Collision Guard
on:
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/cross-pr-migration-collision-guard.yml"
permissions:
  contents: read
  pull-requests: read
jobs:
  cross-pr-migration-collisions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare migration versions across open PRs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: "open", per_page: 100
            });
            const candidates = pulls.filter(pr =>
              pr.base?.ref === "main" &&
              pr.base?.repo?.full_name?.toLowerCase() === `${owner}/${repo}`.toLowerCase()
            );
            const byVersion = new Map();
            for (const pr of candidates) {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner, repo, pull_number: pr.number, per_page: 100
              });
              for (const file of files) {
                const match = file.filename.match(/^supabase\/migrations\/(\d{14})_.+\.sql$/);
                if (!match) continue;
                const version = match[1];
                if (!byVersion.has(version)) byVersion.set(version, []);
                byVersion.get(version).push({
                  pr: pr.number,
                  title: pr.title,
                  path: file.filename,
                  sha: file.sha
                });
              }
            }

            const failures = [];
            for (const [version, entries] of byVersion) {
              const paths = new Set(entries.map(entry => entry.path));
              const shasByPath = new Map();
              for (const entry of entries) {
                if (!shasByPath.has(entry.path)) shasByPath.set(entry.path, new Set());
                shasByPath.get(entry.path).add(entry.sha);
              }
              const divergentSamePath = [...shasByPath.entries()].filter(([, shas]) => shas.size > 1);
              if (paths.size > 1 || divergentSamePath.length > 0) {
                failures.push({ version, entries });
              }
            }

            if (failures.length) {
              core.error("Migration version collisions detected across open PRs targeting main:");
              for (const failure of failures) {
                core.error(`Version ${failure.version}:`);
                for (const entry of failure.entries) {
                  core.error(`  PR #${entry.pr} — ${entry.path} — ${entry.title}`);
                }
              }
              core.setFailed("Coordinate migration version allocation and migration history before merging any conflicting PR.");
            } else {
              core.info(`Cross-PR migration collision check passed across ${candidates.length} open PRs targeting main.`);
            }
