name: Business Branch Admin Source Integrity
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/functions/business-branch-admin/index.ts"
      - "supabase/functions/_shared/branch-coordinates.mjs"
      - "supabase/functions/_shared/branch-authorization.mjs"
      - "supabase/functions/_shared/bearer-token.mjs"
      - "scripts/test-branch-authorization.mjs"
      - "scripts/test-bearer-token.mjs"
      - "scripts/test-branch-coordinate-normalization.mjs"
      - "scripts/validate-business-branch-admin-source.mjs"
      - ".github/workflows/business-branch-admin-source-integrity.yml"
  pull_request:
    branches:
      - "**"
    paths:
      - "supabase/functions/business-branch-admin/index.ts"
      - "supabase/functions/_shared/branch-coordinates.mjs"
      - "supabase/functions/_shared/branch-authorization.mjs"
      - "scripts/test-branch-authorization.mjs"
      - "scripts/test-branch-coordinate-normalization.mjs"
      - "scripts/validate-business-branch-admin-source.mjs"
      - ".github/workflows/business-branch-admin-source-integrity.yml"
      - "supabase/functions/_shared/bearer-token.mjs"
      - "scripts/test-bearer-token.mjs"
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check business branch admin Edge Function
        run: deno check --node-modules-dir=auto supabase/functions/business-branch-admin/index.ts
      - name: Runtime-test branch input and authorization policies
        run: node --test scripts/test-branch-coordinate-normalization.mjs scripts/test-branch-authorization.mjs scripts/test-bearer-token.mjs
      - name: Validate business branch admin source
        run: node scripts/validate-business-branch-admin-source.mjs
