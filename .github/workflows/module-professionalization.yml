name: Module Professionalization Validation
on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  smm-wallet-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mantiqatix_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Run migration tests inside disposable PostgreSQL service
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN'
          docker cp supabase/tests/rc432_smm_wallet_idempotency_fixture.sql "$pg_container:/tmp/rc432_fixture.sql"
          docker cp supabase/migrations/20261009190000_rc432_smm_wallet_transaction_idempotency.sql "$pg_container:/tmp/rc432_migration.sql"
          docker cp supabase/tests/rc432_smm_wallet_idempotency_integration.sql "$pg_container:/tmp/rc432_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -f /tmp/rc432_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -f /tmp/rc432_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_test -v ON_ERROR_STOP=1 -f /tmp/rc432_test.sql

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: JavaScript syntax
        run: |
          node --check web/app.js
          node --check web/module-blueprints.js
          node --check web/smm.js
      - name: Module runtime contract
        run: |
          grep -q "window.MNTYModuleRuntime" web/app.js
          grep -q "syncModuleRuntime" web/app.js
          grep -q "MNTYModuleRuntime" web/module-blueprints.js
      - name: Production security validators
        run: |
          node scripts/validate-production-security.mjs
          node scripts/validate-rbac-contract.mjs
          node scripts/validate-security-definer-contract.mjs
          node scripts/validate-module-runtime-coverage.mjs
          node scripts/validate-restaurant-rbac-contract.mjs
          node scripts/validate-membership-refresh-contract.mjs
          node scripts/validate-smm-payment-safety.mjs
