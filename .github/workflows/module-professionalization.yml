          node scripts/validate-restaurant-menu-catalog-sync.mjs
          node scripts/validate-membership-refresh-contract.mjs
          node scripts/validate-erp-receiving-release-contract.mjs
          node scripts/validate-erp-receiving-contract.mjs
          node scripts/test-checkout-secret-crypto.mjs
          node scripts/validate-financial-journal-service-role.mjs
          node scripts/validate-erp-purchase-order-lines.mjs

          node scripts/validate-checkout-recovery.mjs
