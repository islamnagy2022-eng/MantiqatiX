          docker cp supabase/migrations/20261031064300_rc462_platform_admin_registry_authority_convergence.sql "$pg_container:/tmp/rc462.sql"
          docker cp supabase/tests/r7_platform_admin_helper_callers_fixture.sql "$pg_container:/tmp/r7-callers.sql"
          docker cp supabase/migrations/20261117190000_rc471_mantigo_platform_admin_forward_hardening.sql "$pg_container:/tmp/rc471.sql"
          docker cp supabase/tests/rc449_mantigo_platform_admin_integration.sql "$pg_container:/tmp/rc449-test.sql"
          docker cp supabase/tests/mantigo_financial_report_live_columns.sql "$pg_container:/tmp/financial-report-test.sql"
          docker cp supabase/tests/r7_platform_admin_helper_callers_integration.sql "$pg_container:/tmp/r7-helper-callers-test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/rc449.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/rc462.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/r7-callers.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/rc471.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/rc449-test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/financial-report-test.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc471_platform_admin_test -v ON_ERROR_STOP=1 -f /tmp/r7-helper-callers-test.sql

