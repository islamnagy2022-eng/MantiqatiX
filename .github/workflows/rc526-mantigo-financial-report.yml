name: RC526 MantiGO Financial Report Contract
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/20261016170000_rc526_mantigo_financial_report_column_contract.sql"
      - "supabase/tests/rc526_mantigo_financial_report_integration.sql"
      - ".github/workflows/rc526-mantigo-financial-report.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261016170000_rc526_mantigo_financial_report_column_contract.sql"
      - "supabase/tests/rc526_mantigo_financial_report_integration.sql"
      - ".github/workflows/rc526-mantigo-financial-report.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - name: Prepare disposable canonical production-schema fixture
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          create role anon nologin;
          create role authenticated nologin;
          create schema auth;
          create or replace function auth.uid()
          returns uuid language sql stable
          as $function$
            select nullif(current_setting('request.jwt.claim.sub',true),'')::uuid
          $function$;
          create table public.user_memberships (
            id text primary key,
            user_id uuid not null,
            tenant_id text not null,
            role text not null,
            status text not null,
            permissions jsonb not null default '{}'::jsonb
          );
          create table public.mantigo_financial_ledger (
            id text primary key,
            ride_id text not null,
            captain_id uuid not null,
            gross_amount numeric not null,
            commission_amount numeric not null,
            captain_net_amount numeric not null,
            payment_status text not null,
            settlement_status text,
            created_at timestamptz not null
          );
          create or replace function public.mnty_can_platform_admin()
          returns boolean language sql stable security definer set search_path=''
          as $function$
            select exists (
              select 1 from public.user_memberships m
              where m.user_id=auth.uid()
                and m.tenant_id='MNTY-PLATFORM'
                and m.status='ACTIVE'
                and upper(m.role)='SUPER_ADMIN'
                and coalesce(m.permissions->>'scope'='PLATFORM',false)
                and coalesce((m.permissions->>'full_control')::boolean,false)
            )
          $function$;
          SQL
      - name: Apply candidate forward migration to disposable PostgreSQL only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261016170000_rc526_mantigo_financial_report_column_contract.sql
      - name: Verify report totals, platform authorization, date range, and grants
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/rc526_mantigo_financial_report_integration.sql
