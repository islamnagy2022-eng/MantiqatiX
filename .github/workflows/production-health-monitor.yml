name: Production Health Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub Pages
        run: |
          set -euo pipefail
          URL="https://islamnagy2022-eng.github.io/MantiqatiX/"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq "MantiqatiX" <<<"$BODY"

      - name: Check Supabase health function
        id: supabase_health
        run: |
          set -euo pipefail
          URL="https://moyhiluyhjsujhwlyeuu.supabase.co/functions/v1/health"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq '"status":"ok"' <<<"$BODY"
          grep -Fq '"service":"mantiqatix-health"' <<<"$BODY"
          if grep -Fq '"database":{"status":"ok","mode":"service_role_read_only"}' <<<"$BODY"; then
            echo "database_probe_mode=service_role" >> "$GITHUB_OUTPUT"
          else
            # Backward-compatible rollout: keep the existing anon REST probe
            # until the DB-aware Edge Function is deployed. Once deployed,
            # RC479 no longer depends on anonymous provider-profile table access.
            echo "database_probe_mode=legacy_anon" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Supabase database with a read-only probe
        shell: bash
        env:
          DATABASE_PROBE_MODE: ${{ steps.supabase_health.outputs.database_probe_mode }}
        run: |
          set -euo pipefail
          if [[ "$DATABASE_PROBE_MODE" == "service_role" ]]; then
            echo "SUPABASE_DATABASE_READ_ONLY_PROBE=PASS (Edge service-role)"
            exit 0
          fi

          CONFIG_URL="https://islamnagy2022-eng.github.io/MantiqatiX/config.js"
          CONFIG="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$CONFIG_URL")"
          SUPABASE_URL="$(sed -nE "s/.*supabaseUrl: '([^']+)'.*/\\1/p" <<<"$CONFIG" | head -n1)"
          SUPABASE_ANON_KEY="$(sed -nE "s/.*supabaseKey: '([^']+)'.*/\\1/p" <<<"$CONFIG" | head -n1)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          HTTP_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --get "${SUPABASE_URL%/}/rest/v1/marketing_provider_profiles" --data-urlencode 'select=business_id' --data-urlencode 'limit=1' -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Supabase legacy database read probe failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
          echo "SUPABASE_DATABASE_READ_ONLY_PROBE=PASS (legacy anon fallback)"

      - name: Check V6 production root and retained legacy catalog
        run: |
          set -euo pipefail
          SITE_ROOT="https://islamnagy2022-eng.github.io/MantiqatiX"
          ROOT="${SITE_ROOT}/"
          HTML="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$ROOT")"
          grep -Fq "MantiqaTix" <<<"$HTML"
          grep -Fq "/MantiqatiX/assets/" <<<"$HTML"
          grep -Fq "/MantiqatiX/config.js" <<<"$HTML"
          ! grep -Fq "home.js" <<<"$HTML"
          ROOT_ASSETS="$(grep -oE '(src|href)="/MantiqatiX/assets/[^" ]+\\.(js|css)"' <<<"$HTML" | sed -E 's/^(src|href)="([^"]+)"/\\2/' | sort -u)"
          test -n "$ROOT_ASSETS"
          while IFS= read -r asset; do curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --head "https://islamnagy2022-eng.github.io$asset" >/dev/null; done <<<"$ROOT_ASSETS"

          LEGACY_URL="${SITE_ROOT}/legacy/"
          LEGACY_HTML="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$LEGACY_URL")"
          grep -Fq "MantiqaTix | منصة إدارة الأنشطة والكتالوجات" <<<"$LEGACY_HTML"
          grep -Fq "/MantiqatiX/legacy/assets/" <<<"$LEGACY_HTML"
          LEGACY_ASSETS="$(grep -oE '(src|href)="/MantiqatiX/legacy/assets/[^" ]+\\.(js|css)"' <<<"$LEGACY_HTML" | sed -E 's/^(src|href)="([^"]+)"/\\2/' | sort -u)"
          test -n "$LEGACY_ASSETS"
          while IFS= read -r asset; do curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --head "https://islamnagy2022-eng.github.io$asset" >/dev/null; done <<<"$LEGACY_ASSETS"
          echo "V6_PRODUCTION_ROOT_AND_LEGACY_ASSETS=PASS"

      - name: Health summary
        run: |
          echo "Production health checks passed."
          echo "Pages: reachable"
          echo "Edge Function /health: runtime and database contract checked"
          echo "Database: read-only"
          echo "Core web assets: reachable"
