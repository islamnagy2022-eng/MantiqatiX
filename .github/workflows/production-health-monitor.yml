name: Production Health Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub Pages
        run: |
          set -euo pipefail
          URL="https://islamnagy2022-eng.github.io/MantiqatiX/"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq "MantiqatiX" <<<"$BODY"

      - name: Check Supabase health function
        run: |
          set -euo pipefail
          URL="https://moyhiluyhjsujhwlyeuu.supabase.co/functions/v1/health"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq '"status":"ok"' <<<"$BODY"
          grep -Fq '"service":"mantiqatix-health"' <<<"$BODY"

      - name: Check Supabase database with a read-only REST probe
        shell: bash
        run: |
          set -euo pipefail
          CONFIG_URL="https://islamnagy2022-eng.github.io/MantiqatiX/config.js"
          CONFIG="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$CONFIG_URL")"
          SUPABASE_URL="$(sed -nE "s/.*supabaseUrl: '([^']+)'.*/\\1/p" <<<"$CONFIG" | head -n1)"
          SUPABASE_ANON_KEY="$(sed -nE "s/.*supabaseKey: '([^']+)'.*/\\1/p" <<<"$CONFIG" | head -n1)"
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_ANON_KEY"
          HTTP_CODE="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --get "${SUPABASE_URL%/}/rest/v1/marketing_provider_profiles" --data-urlencode 'select=business_id' --data-urlencode 'limit=1' -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY")"
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Supabase database read probe failed with HTTP $HTTP_CODE" >&2
            exit 1
          fi
          echo "SUPABASE_DATABASE_READ_ONLY_PROBE=PASS"
      - name: Check primary electronic catalog root and assets
        run: |
          set -euo pipefail
          SITE_ROOT="https://islamnagy2022-eng.github.io/MantiqatiX"
          ROOT="${SITE_ROOT}/"
          HTML="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$ROOT")"
          grep -Fq "MantiqatiX | منصة إدارة الأنشطة والكتالوجات" <<<"$HTML"
          grep -Fq "/MantiqatiX/assets/" <<<"$HTML"
          grep -Fq "/MantiqatiX/config.js" <<<"$HTML"
          ! grep -Fq "home.js" <<<"$HTML"
          ASSETS="$(grep -oE '(src|href)="/MantiqatiX/assets/[^" ]+\.(js|css)"' <<<"$HTML" | sed -E 's/^(src|href)="([^"]+)"/\2/' | sort -u)"
          test -n "$ASSETS"
          while IFS= read -r asset; do curl --fail --silent --show-error --location --retry 4 --retry-delay 2 --head "https://islamnagy2022-eng.github.io$asset" >/dev/null; done <<<"$ASSETS"
          echo "PRIMARY_CATALOG_ROOT_AND_ASSETS=PASS"
      - name: Health summary
        run: |
          echo "Production health checks passed."
          echo "Pages: reachable"
          echo "Edge Function /health: OK (runtime only)"
          echo "Database REST read probe: PASS"
          echo "Core web assets: reachable"
