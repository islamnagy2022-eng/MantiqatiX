name: Production Health Monitor

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check GitHub Pages
        run: |
          set -euo pipefail
          URL="https://islamnagy2022-eng.github.io/MantiqatiX/"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq "MantiqatiX" <<<"$BODY"

      - name: Check Supabase health function
        run: |
          set -euo pipefail
          URL="https://moyhiluyhjsujhwlyeuu.supabase.co/functions/v1/health"
          BODY="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$URL")"
          grep -Fq '"status":"ok"' <<<"$BODY"
          grep -Fq '"service":"mantiqatix-health"' <<<"$BODY"

      - name: Check platform root and catalog module assets
        run: |
          set -euo pipefail
          BASE="https://islamnagy2022-eng.github.io"
          ROOT="$BASE/MantiqatiX/"
          ROOT_HTML="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$ROOT")"
          grep -Fq "MantiqatiX | منصة الخدمات ومقدميها" <<<"$ROOT_HTML"
          grep -Fq "home.js" <<<"$ROOT_HTML"
          grep -Fq "config.js" <<<"$ROOT_HTML"

          CATALOG_URL="$ROOT/catalog-app/"
          CATALOG_HTML="$(curl --fail --silent --show-error --location --retry 4 --retry-delay 2 "$CATALOG_URL")"
          grep -Fq "/MantiqatiX/catalog-app/assets/" <<<"$CATALOG_HTML"
          grep -Fq "/MantiqatiX/config.js" <<<"$CATALOG_HTML"
          ASSETS="$(grep -oE '/MantiqatiX/catalog-app/assets/[^"]+\.(js|css)' <<<"$CATALOG_HTML" | sort -u)"
          test -n "$ASSETS"
          while IFS= read -r asset; do
            test -n "$asset"
            REACHABLE=0
            # GitHub Pages may publish its new artifact moments after the push-triggered monitor starts.
            for ATTEMPT in $(seq 1 8); do
              if curl --fail --silent --show-error --location --head "$BASE$asset" >/dev/null; then
                REACHABLE=1
                break
              fi
              echo "Asset not reachable yet (attempt $ATTEMPT/8): $asset"
              sleep 5
            done
            if [ "$REACHABLE" -ne 1 ]; then
              echo "Catalog asset remained unreachable after retries: $asset"
              exit 1
            fi
          done <<<"$ASSETS"
          # Retry the catalog entrypoint too, avoiding a false failure during CDN propagation.
          CATALOG_READY=0
          for ATTEMPT in $(seq 1 8); do
            if curl --fail --silent --show-error --location "$CATALOG_URL" -o /tmp/catalog-health.html &&
               grep -Fq "/MantiqatiX/catalog-app/assets/" /tmp/catalog-health.html; then
              CATALOG_READY=1
              break
            fi
            echo "Catalog entrypoint not propagated yet (attempt $ATTEMPT/8)"
            sleep 5
          done
          test "$CATALOG_READY" -eq 1
          echo "Platform root preserved and catalog module JavaScript/CSS assets reachable"

      - name: Health summary
        run: |
          echo "Production health checks passed."
          echo "Pages: reachable"
          echo "API /health: OK"
          echo "Core web assets: reachable"
