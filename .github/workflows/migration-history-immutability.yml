name: Migration History Immutability
on:
  push:
    branches:
      - main
      - reconcile/rc425-458-current-main-20261011
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/baselines/production_schema_migration_versions.txt"
      - "supabase/tests/baselines/production_schema_snapshot.manifest.json"
      - "scripts/validate-migration-history-immutability.mjs"
      - ".github/workflows/migration-history-immutability.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-migration-history-immutability.mjs"
      - ".github/workflows/migration-history-immutability.yml"
permissions:
  contents: read
jobs:
  migration-history-immutability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout full history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Test migration immutability guard
        run: node scripts/validate-migration-history-immutability.mjs --self-test
      - name: Reject edits to existing migrations
        env:
          MIGRATION_BASE_REF: ${{ github.base_ref || 'main' }}
        run: node scripts/validate-migration-history-immutability.mjs
