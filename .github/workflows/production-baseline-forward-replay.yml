name: Reviewed Production Baseline Forward Replay

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/tests/baselines/production_schema_snapshot.sql"
      - "supabase/tests/baselines/production_schema_snapshot.manifest.json"
      - "scripts/replay-from-production-schema-baseline.sh"
      - "scripts/validate-production-schema-baseline.mjs"
      - "scripts/tests/validate-production-schema-baseline.test.mjs"
      - ".github/workflows/production-baseline-forward-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-baseline-forward-replay-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Test baseline validator fail-closed contract
        run: node --test scripts/tests/validate-production-schema-baseline.test.mjs

      - name: Verify baseline provenance and explicit review
        env:
          REQUIRE_BASELINE_REVIEW: "1"
        run: node scripts/validate-production-schema-baseline.mjs --verify

      - name: Create isolated Supabase stack matching source PostgreSQL major version
        shell: bash
        run: |
          set -euo pipefail
          PG_MAJOR="$(node -e 'const m=require(process.env.GITHUB_WORKSPACE + "/supabase/tests/baselines/production_schema_snapshot.manifest.json"); process.stdout.write(String(m.postgres_major_version))')"
          [[ "$PG_MAJOR" =~ ^[0-9]+$ ]]
          mkdir -p /tmp/mantiqatix-baseline-project
          cd /tmp/mantiqatix-baseline-project
          supabase init
          grep -Eq '^[[:space:]]*major_version[[:space:]]*=' supabase/config.toml
          sed -E -i "s/^([[:space:]]*major_version[[:space:]]*=[[:space:]]*).*/\1$PG_MAJOR/" supabase/config.toml
          supabase start
          supabase status -o env > /tmp/mantiqatix-baseline-supabase.env
          grep -q '^DB_URL=' /tmp/mantiqatix-baseline-supabase.env

      - name: Restore reviewed schema and replay forward migrations only
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source /tmp/mantiqatix-baseline-supabase.env
          set +a
          test -n "${DB_URL:-}"
          cd "$GITHUB_WORKSPACE"
          LOCAL_DB_URL="$DB_URL" bash scripts/replay-from-production-schema-baseline.sh

      - name: Upload exact-run replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-baseline-forward-replay-${{ github.run_id }}
          path: artifacts/baseline-forward-replay/
          if-no-files-found: warn
          retention-days: 14

      - name: Stop isolated Supabase stack
        if: always()
        shell: bash
        run: |
          if [[ -d /tmp/mantiqatix-baseline-project/supabase ]]; then
            cd /tmp/mantiqatix-baseline-project
            supabase stop --no-backup || true
          fi
