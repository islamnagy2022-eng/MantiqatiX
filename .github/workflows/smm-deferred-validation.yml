name: SMM Deferred Module Validation
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/smm-deferred-validation.yml"
      - ".github/workflows/module-professionalization.yml"
      - "web/smm.*"
      - "supabase/functions/smm-gateway/**"
      - "supabase/migrations/*smm*"
      - "supabase/tests/*smm*"
      - "scripts/validate-smm-*.mjs"
  pull_request:
    paths:
      - ".github/workflows/smm-deferred-validation.yml"
      - ".github/workflows/module-professionalization.yml"
      - "web/smm.*"
      - "supabase/functions/smm-gateway/**"
      - "supabase/migrations/*smm*"
      - "supabase/tests/*smm*"
      - "scripts/validate-smm-*.mjs"
permissions:
  contents: read
jobs:
  smm-deferred-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_smm_deferred_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_smm_deferred_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: mantiqatix_smm_deferred_test
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Test SMM wallet idempotency in disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE anon NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE authenticated NOLOGIN'
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -c 'CREATE ROLE service_role NOLOGIN'
          docker cp supabase/tests/rc432_smm_wallet_idempotency_fixture.sql "$pg_container:/tmp/rc432_fixture.sql"
          docker cp supabase/migrations/20261009190000_rc432_smm_wallet_transaction_idempotency.sql "$pg_container:/tmp/rc432_migration.sql"
          docker cp supabase/tests/rc432_smm_wallet_idempotency_integration.sql "$pg_container:/tmp/rc432_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -f /tmp/rc432_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -f /tmp/rc432_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_smm_deferred_test -v ON_ERROR_STOP=1 -f /tmp/rc432_test.sql
      - name: Verify SMM page is quarantined from the launch UI
        shell: bash
        run: |
          set -euo pipefail
          node --check web/smm.js
          grep -q "خارج نطاق الإطلاق الأول" web/smm.html
          ! grep -Eq '<script[^>]+src=["'\'']smm\.js' web/smm.html
          grep -q "خدمات التسويق الرقمي SMM — قيد التطوير" web/app.js
          echo "PASS: browser storefront is deferred; this does not disable the deployed Edge Function."
      - name: Run SMM-specific security checks (not a core-launch acceptance check)
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-smm-service-role-boundary.mjs
          node scripts/validate-smm-payment-safety.mjs
      - name: Record scope
        if: always()
        run: |
          echo "SMM is deferred and must remain unavailable to customers during the initial platform launch."
          echo "This workflow is separate from the core module gate; a green core gate does not certify SMM."
          echo "Do not make this workflow a required check for the initial launch while SMM is intentionally deferred."
          echo "The live smm-gateway Edge Function must be independently disabled or proven safe before launch; no production change is performed by this workflow."
