name: RC490 Private CRM Notification Read Isolation

on:
  pull_request:
    paths:
      - "supabase/migrations/20261120250000_rc490_private_crm_notification_read_guards.sql"
      - "supabase/tests/rc490_private_crm_notification_read_guards_fixture.sql"
      - "supabase/tests/rc490_private_crm_notification_read_guards_integration.sql"
      - "scripts/validate-rc490-private-crm-notification-read-guards.mjs"
      - ".github/workflows/rc490-private-crm-notification-read-guards.yml"
  push:
    branches:
      - "security/rc490-private-crm-notification-read-guards"
    paths:
      - "supabase/migrations/20261120250000_rc490_private_crm_notification_read_guards.sql"
      - "supabase/tests/rc490_private_crm_notification_read_guards_fixture.sql"
      - "supabase/tests/rc490_private_crm_notification_read_guards_integration.sql"
      - "scripts/validate-rc490-private-crm-notification-read-guards.mjs"
      - ".github/workflows/rc490-private-crm-notification-read-guards.yml"

permissions:
  contents: read

jobs:
  rc490-private-read-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc490_private_read_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc490_private_read_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate RC490 static contract
        run: node scripts/validate-rc490-private-crm-notification-read-guards.mjs
      - name: Apply isolated private-read fixture and forward migration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc490_private_crm_notification_read_guards_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261120250000_rc490_private_crm_notification_read_guards.sql "$pg_container:/tmp/rc490.sql"
          docker cp supabase/tests/rc490_private_crm_notification_read_guards_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc490_private_read_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc490_private_read_test -v ON_ERROR_STOP=1 -f /tmp/rc490.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc490_private_read_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
