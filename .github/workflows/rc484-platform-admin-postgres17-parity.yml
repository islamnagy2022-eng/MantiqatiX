name: RC484 Platform Admin Registry RLS PostgreSQL 17 Parity

on:
  pull_request:
    branches: ["main"]
    paths:
      - "supabase/migrations/20261119040000_rc484_registry_backed_is_platform_admin.sql"
      - "supabase/tests/rc484_platform_admin_fixture.sql"
      - "supabase/tests/rc484_platform_admin_integration.sql"
      - ".github/workflows/rc484-platform-admin-postgres17-parity.yml"

permissions:
  contents: read

jobs:
  rc484-platform-admin-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc484_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc484_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Build disposable tenant and platform-admin fixture
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d mantiqatix_rc484_test -v ON_ERROR_STOP=1 -f supabase/tests/rc484_platform_admin_fixture.sql
      - name: Apply registry-backed platform-root migration
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d mantiqatix_rc484_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261119040000_rc484_registry_backed_is_platform_admin.sql
      - name: Verify all 57 RLS policies and tenant-versus-platform authorization behavior
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d mantiqatix_rc484_test -v ON_ERROR_STOP=1 -f supabase/tests/rc484_platform_admin_integration.sql
