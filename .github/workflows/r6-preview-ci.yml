name: R6 Preview Build

on:
  push:
    branches:
      - preview/bizcatalog-manager-6-isolated
    paths:
      - "apps/bizcatalog-manager-6-preview/**"
      - "scripts/**"
      - ".github/workflows/r6-preview-ci.yml"
      - "PREVIEW_DEPLOYMENT_STATUS.md"
  pull_request:
    branches:
      - preview/bizcatalog-manager-6-isolated
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-preview-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Require imported application source
        run: |
          test -f apps/bizcatalog-manager-6-preview/package.json || {
            echo "::error::R6 application ZIP has not been imported to apps/bizcatalog-manager-6-preview/. The source upload is the current blocker."
            exit 1
          }
          test -f apps/bizcatalog-manager-6-preview/server.ts
          test -f apps/bizcatalog-manager-6-preview/Dockerfile
          test -f apps/bizcatalog-manager-6-preview/bun.lock
          test ! -e apps/bizcatalog-manager-6-preview/.data
          test ! -e apps/bizcatalog-manager-6-preview/.data-preview
      - name: Set up Node.js for type checking
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up pinned Bun runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install dependencies from frozen lockfile
        working-directory: apps/bizcatalog-manager-6-preview
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: apps/bizcatalog-manager-6-preview
        run: bun run lint
      - name: Unit tests
        working-directory: apps/bizcatalog-manager-6-preview
        run: bunx tsx --test $(find src -type f -name '*.test.ts' -print)
      - name: Build frontend
        working-directory: apps/bizcatalog-manager-6-preview
        run: bun run build
      - name: Build container
        run: docker build -t mantiqatix-r6-preview:ci apps/bizcatalog-manager-6-preview

      - name: Run isolated Preview container smoke tests
        run: |
          set -euo pipefail
          docker run --detach --name mantiqatix-r6-preview-smoke \
            --publish 8080:8080 \
            --env NODE_ENV=production \
            --env PREVIEW_MODE=true \
            --env VITE_PREVIEW_MODE=true \
            mantiqatix-r6-preview:ci
          cleanup() {
            docker logs mantiqatix-r6-preview-smoke || true
            docker rm --force mantiqatix-r6-preview-smoke >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          ready=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" = "1" || {
            echo "::error::R6 Preview container did not become healthy."
            exit 1
          }
          bash scripts/smoke_test_r6_preview.sh
