name: R6 Preview Build

on:
  push:
    branches: [preview/bizcatalog-manager-6-isolated]
    paths:
      - "apps/bizcatalog-manager-6-preview/**"
      - ".github/workflows/r6-preview-ci.yml"
  pull_request:
    branches: [preview/bizcatalog-manager-6-isolated]
    paths:
      - "apps/bizcatalog-manager-6-preview/**"
      - ".github/workflows/r6-preview-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r6-preview-build
  cancel-in-progress: true

jobs:
  build:
    if: ${{ hashFiles('apps/bizcatalog-manager-6-preview/package.json') != '' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/bizcatalog-manager-6-preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/bizcatalog-manager-6-isolated
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Unit tests
        run: npx tsx --test $(find src -type f -name '*.test.ts' -print)
      - name: Build frontend
        run: npm run build
      - name: Verify preview-only API access
        run: |
          grep -q 'PREVIEW_ALLOWED_API_PATHS' server.ts
          grep -q "new Set(\['/health', '/businesses', '/products'\])" server.ts
          grep -q 'MANTIQATIX_PREVIEW_NOTICE' src/App.tsx
          grep -q 'const seededWallets' src/context/AppContext.tsx
          grep -q 'if (IS_PREVIEW_MODE) return [];' src/context/AppContext.tsx
          grep -q "VITE_PREVIEW_MODE !== 'true'" src/main.tsx
          test ! -e .data
          test ! -e .data-preview
      - name: Build container
        run: docker build -t mantiqatix-r6-preview:ci .
