name: Primary Catalog Frontend Release

on:
  push:
    branches: [main, production/new-catalog-frontend]
    paths:
      - ".release-transfer/parts/**"
      - "apps/catalog-frontend/**"
      - "supabase/functions/catalog-platform-admin/**"
      - "supabase/functions/public-catalog-directory/**"
      - "supabase/migrations/20261026133000_rc108_bizcatalog_platform_settings.sql"
      - ".github/workflows/primary-catalog-frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - ".release-transfer/parts/**"
      - "apps/catalog-frontend/**"
      - "supabase/functions/catalog-platform-admin/**"
      - "supabase/functions/public-catalog-directory/**"
      - "supabase/migrations/20261026133000_rc108_bizcatalog_platform_settings.sql"
      - ".github/workflows/primary-catalog-frontend.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: primary-catalog-frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Reassemble frontend and backend source archives
        run: |
          set -euo pipefail
          if [ -d .release-transfer/parts/frontend ]; then
            cat .release-transfer/parts/frontend/*.xz > /tmp/catalog-frontend.tar.xz
            tar -tJf /tmp/catalog-frontend.tar.xz >/dev/null
            mkdir -p apps/catalog-frontend
            tar -xJf /tmp/catalog-frontend.tar.xz -C apps/catalog-frontend
          fi
          if [ -d .release-transfer/parts/backend ]; then
            cat .release-transfer/parts/backend/*.xz > /tmp/catalog-backend.tar.xz
            tar -tJf /tmp/catalog-backend.tar.xz >/dev/null
            mkdir -p /tmp/catalog-backend-unpacked
            tar -xJf /tmp/catalog-backend.tar.xz -C /tmp/catalog-backend-unpacked
            mkdir -p supabase/functions supabase/migrations
            cp -a /tmp/catalog-backend-unpacked/catalog-platform-admin supabase/functions/
            cp -a /tmp/catalog-backend-unpacked/public-catalog-directory supabase/functions/
            cp -a /tmp/catalog-backend-unpacked/supabase/migrations/20261026133000_rc108_bizcatalog_platform_settings.sql supabase/migrations/
          fi
          test -s apps/catalog-frontend/package.json
          test -s apps/catalog-frontend/public/config.js
          test -s supabase/functions/catalog-platform-admin/index.ts
          test -s supabase/functions/public-catalog-directory/index.ts
          test -s supabase/migrations/20261026133000_rc108_bizcatalog_platform_settings.sql
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Align esbuild with Vite 8 peer requirements
        working-directory: apps/catalog-frontend
        run: npm pkg set "devDependencies.esbuild=^0.28.2"
      - name: Install dependencies
        working-directory: apps/catalog-frontend
        run: npm install --no-audit --no-fund
      - name: TypeScript check
        working-directory: apps/catalog-frontend
        run: npm run lint
      - name: Build production assets
        working-directory: apps/catalog-frontend
        run: npm run build
      - name: Verify release files
        run: |
          test -s apps/catalog-frontend/dist/index.html
          test -s apps/catalog-frontend/dist/config.js
          grep -q '/MantiqatiX/' apps/catalog-frontend/dist/index.html
      - name: Smoke test deployed public catalog directory
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseUrl:\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          SUPABASE_ANON_KEY="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseKey:\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/catalog-directory-smoke.json --write-out '%{http_code}' --header "apikey: ${SUPABASE_ANON_KEY}" --header 'Accept: application/json' "${SUPABASE_URL}/functions/v1/public-catalog-directory")"
          cat /tmp/catalog-directory-smoke.json
          test "${HTTP_CODE}" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/catalog-directory-smoke.json','utf8'));if(!Array.isArray(d.businesses)||d.accessMode!=='PUBLIC_DIRECTORY_READ_ONLY')process.exit(1);const s=JSON.stringify(d).toUpperCase();if(s.includes('MNTY-TEST-B')||s.includes('ISOLATION TEST'))process.exit(2);console.log('PUBLIC_DIRECTORY_SMOKE=PASS; businesses='+d.businesses.length)"
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: primary-catalog-frontend-dist
          path: apps/catalog-frontend/dist
          if-no-files-found: error
      - name: Materialize tested sources and remove transport chunks
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        run: |
          set -euo pipefail
          if [ -d .release-transfer/parts ]; then
            git add apps/catalog-frontend supabase/functions/catalog-platform-admin supabase/functions/public-catalog-directory supabase/migrations/20261026133000_rc108_bizcatalog_platform_settings.sql
            git rm -r .release-transfer/parts
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build(catalog): materialize validated frontend and backend source"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: primary-catalog-frontend-dist
          path: dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy primary catalog frontend
        id: deployment
        uses: actions/deploy-pages@v4
