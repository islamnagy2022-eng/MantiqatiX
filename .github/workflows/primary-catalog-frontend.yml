name: Primary Catalog Frontend Validation

on:
  push:
    branches: [main, production/new-catalog-frontend]
    paths:
      - ".release-transfer/parts/**"
      - "apps/catalog-frontend/**"
      - "scripts/validate-catalog-google-auth-contract.mjs"
      - "scripts/validate-facebook-page-import.mjs"
      - "scripts/validate-business-social-links.mjs"
      - "scripts/validate-catalog-geographic-search.mjs"
      - "scripts/validate-paid-subscription-gate.mjs"
      - "scripts/validate-business-create-inflight-guard.mjs"
      - "scripts/validate-catalog-membership-bootstrap.mjs"
      - "scripts/validate-directory-listings-origin-allowlist.mjs"
      - "scripts/validate-production-catalog-real-state.mjs"
      - "scripts/validate-canonical-activity-taxonomy.mjs"
      - "scripts/production/verify-catalog-pilot.mjs"
      - "docs/release/production-migration-reconciliation.json"
      - "scripts/validate-production-gate-contract.mjs"
      - "scripts/validate-pages-production-deploy-gate.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/primary-catalog-frontend.yml"
      - "supabase/functions/catalog-platform-admin/**"
      - "supabase/functions/catalog-admin/**"
      - "supabase/functions/public-catalog/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/public-catalog-directory/**"
      - "supabase/functions/facebook-page-import/**"
      - "supabase/migrations/20261026123825_rc108_bizcatalog_platform_settings.sql"
      - "supabase/migrations/20261026130450_rc109_bizcatalog_settings_service_policy.sql"
      - "supabase/migrations/20261027030000_rc113_super_admin_control_center_foundation.sql"
      - "supabase/migrations/20261027040000_rc114_business_employee_hiring_system.sql"
      - "supabase/migrations/20261027050000_rc115_control_center_integration.sql"
      - "supabase/migrations/20261027060000_rc116_business_subscriber_admin.sql"
      - "supabase/migrations/20261027070000_rc117_default_images_and_activity_admin.sql"
      - "supabase/migrations/20261028225000_rc457_business_employee_permission_ceiling.sql"
      - "supabase/tests/rc113_super_admin_control_center_contract.sql"
      - "supabase/tests/rc114_employee_hiring_contract.sql"
      - "supabase/tests/rc115_control_center_integration_contract.sql"
      - "supabase/tests/rc116_business_subscriber_admin_contract.sql"
      - "supabase/tests/rc117_default_images_and_activity_admin_contract.sql"
      - "supabase/tests/professional_dashboard_permission_fixture.sql"
      - "supabase/tests/professional_dashboard_permission_integration.sql"
  pull_request:
    branches: [main]
    paths:
      - ".release-transfer/parts/**"
      - "apps/catalog-frontend/**"
      - "scripts/validate-catalog-google-auth-contract.mjs"
      - "scripts/validate-facebook-page-import.mjs"
      - "scripts/validate-business-social-links.mjs"
      - "scripts/validate-catalog-geographic-search.mjs"
      - "scripts/validate-paid-subscription-gate.mjs"
      - "scripts/validate-business-create-inflight-guard.mjs"
      - "scripts/validate-catalog-membership-bootstrap.mjs"
      - "scripts/validate-directory-listings-origin-allowlist.mjs"
      - "scripts/production/verify-catalog-pilot.mjs"
      - "docs/release/production-migration-reconciliation.json"
      - "scripts/validate-production-gate-contract.mjs"
      - "scripts/validate-pages-production-deploy-gate.mjs"
      - ".github/workflows/pages.yml"
      - ".github/workflows/primary-catalog-frontend.yml"
      - "supabase/functions/catalog-platform-admin/**"
      - "supabase/functions/catalog-admin/**"
      - "supabase/functions/public-catalog/**"
      - "supabase/functions/_shared/**"
      - "supabase/functions/public-catalog-directory/**"
      - "supabase/functions/facebook-page-import/**"
      - "supabase/migrations/20261026123825_rc108_bizcatalog_platform_settings.sql"
      - "supabase/migrations/20261026130450_rc109_bizcatalog_settings_service_policy.sql"
      - "supabase/migrations/20261027030000_rc113_super_admin_control_center_foundation.sql"
      - "supabase/migrations/20261027040000_rc114_business_employee_hiring_system.sql"
      - "supabase/migrations/20261027050000_rc115_control_center_integration.sql"
      - "supabase/migrations/20261027060000_rc116_business_subscriber_admin.sql"
      - "supabase/migrations/20261027070000_rc117_default_images_and_activity_admin.sql"
      - "supabase/migrations/20261028225000_rc457_business_employee_permission_ceiling.sql"
      - "supabase/tests/rc113_super_admin_control_center_contract.sql"
      - "supabase/tests/rc114_employee_hiring_contract.sql"
      - "supabase/tests/rc115_control_center_integration_contract.sql"
      - "supabase/tests/rc116_business_subscriber_admin_contract.sql"
      - "supabase/tests/rc117_default_images_and_activity_admin_contract.sql"
      - "supabase/tests/professional_dashboard_permission_fixture.sql"
      - "supabase/tests/professional_dashboard_permission_integration.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primary-catalog-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: apps/catalog-frontend
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        working-directory: apps/catalog-frontend
        run: npm run lint
      - name: Validate canonical activity/profession taxonomy
        run: node scripts/validate-canonical-activity-taxonomy.mjs
      - name: Validate geographic catalog search and GPS contract
        run: node scripts/validate-catalog-geographic-search.mjs
      - name: Validate Google OAuth session and role contract
        run: node scripts/validate-catalog-google-auth-contract.mjs
      - name: Validate Facebook page import ownership and token handling
        run: node scripts/validate-facebook-page-import.mjs
      - name: Validate activity social links and click-to-call
        run: node scripts/validate-business-social-links.mjs
      - name: Verify paid subscription activation gate
        run: node scripts/validate-paid-subscription-gate.mjs
      - name: Verify duplicate-safe activity creation requests
        run: node scripts/validate-business-create-inflight-guard.mjs
      - name: Verify membership bootstrap fails closed
        run: node scripts/validate-catalog-membership-bootstrap.mjs
      - name: Verify production catalog uses real persisted state
        run: node scripts/validate-production-catalog-real-state.mjs
      - name: Verify directory CORS origins exclude retired domain
        run: node scripts/validate-directory-listings-origin-allowlist.mjs
      - name: Verify scoped catalog pilot release prerequisites
        run: node scripts/production/verify-catalog-pilot.mjs
      - name: Validate that the platform root is preserved
        run: node scripts/validate-pages-production-deploy-gate.mjs
      - name: Build primary catalog at the public root
        working-directory: apps/catalog-frontend
        run: npm run build
      - name: Verify primary root assets and PWA scope
        run: |
          set -euo pipefail
          test -s apps/catalog-frontend/dist/index.html
          test -s apps/catalog-frontend/dist/config.js
          grep -Fq '/MantiqatiX/assets/' apps/catalog-frontend/dist/index.html
          grep -Fq '/MantiqatiX/config.js' apps/catalog-frontend/dist/index.html
          ! grep -Fq 'home.js' apps/catalog-frontend/dist/index.html
          grep -Fq '/MantiqatiX/' apps/catalog-frontend/dist/manifest.webmanifest
          grep -Fq 'mantiqatix-primary-catalog-shell-' apps/catalog-frontend/dist/sw.js
      - name: Smoke test allowlisted Google OAuth root callback relay
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseUrl:\\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          SUPABASE_ANON_KEY="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseKey:\\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          REDIRECT_URL="https://islamnagy2022-eng.github.io/MantiqatiX/"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/catalog-oauth-smoke.json --dump-header /tmp/catalog-oauth-smoke.headers --write-out '%{http_code}' --get --data-urlencode 'provider=google' --data-urlencode "redirect_to=${REDIRECT_URL}" --header "apikey: ${SUPABASE_ANON_KEY}" "${SUPABASE_URL}/auth/v1/authorize")"
          if [ "${HTTP_CODE}" != "302" ] && [ "${HTTP_CODE}" != "303" ]; then
            echo "Google OAuth initiation failed with HTTP ${HTTP_CODE}"
            cat /tmp/catalog-oauth-smoke.json
            exit 1
          fi
          grep -Eiq '^location: https://accounts\.google\.com/' /tmp/catalog-oauth-smoke.headers
          echo "CATALOG_OAUTH_ROOT_RELAY_HANDSHAKE=PASS"
      - name: Smoke test production public catalog directory
        run: |
          set -euo pipefail
          SUPABASE_URL="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseUrl:\\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          SUPABASE_ANON_KEY="$(node -e "const s=require('fs').readFileSync('apps/catalog-frontend/public/config.js','utf8');const m=s.match(/supabaseKey:\\s*'([^']+)'/);if(!m)process.exit(1);process.stdout.write(m[1])")"
          HTTP_CODE="$(curl --silent --show-error --output /tmp/catalog-directory-smoke.json --write-out '%{http_code}' --header "apikey: ${SUPABASE_ANON_KEY}" --header 'Accept: application/json' "${SUPABASE_URL}/functions/v1/public-catalog-directory")"
          test "${HTTP_CODE}" = "200"
          node -e "const d=JSON.parse(require('fs').readFileSync('/tmp/catalog-directory-smoke.json','utf8'));if(!Array.isArray(d.businesses)||d.accessMode!=='PUBLIC_DIRECTORY_READ_ONLY')process.exit(1);const q=d.businesses.find(b=>b.slug==='qadam-alsaad-homewares');if(!q||!Array.isArray(q.items)||q.items.length===0||q.accessMode!=='PUBLIC_READ_ONLY'||q.paymentsEnabled!==false)process.exit(3);const s=JSON.stringify(d).toUpperCase();if(s.includes('MNTY-TEST-B')||s.includes('ISOLATION TEST'))process.exit(2);console.log('PUBLIC_DIRECTORY_SMOKE=PASS; businesses='+d.businesses.length+'; qadam_items='+q.items.length)"
      - name: Upload catalog build for review (no deployment)
        uses: actions/upload-artifact@v4
        with:
          name: catalog-frontend-subpath-build
          path: apps/catalog-frontend/dist
          if-no-files-found: error

  professional_dashboard_employee_rbac_postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: professional_dashboard_rbac_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d professional_dashboard_rbac_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply isolated Supabase auth/base fixture, real employee migrations, and behavior tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          for role in anon authenticated service_role; do
            docker exec "$pg_container" psql -U postgres -d professional_dashboard_rbac_test -v ON_ERROR_STOP=1 -c "CREATE ROLE ${role} NOLOGIN"
          done
          for file in \
            supabase/tests/professional_dashboard_permission_fixture.sql \
            supabase/migrations/20261027030000_rc113_super_admin_control_center_foundation.sql \
            supabase/migrations/20261027040000_rc114_business_employee_hiring_system.sql \
            supabase/migrations/20261027050000_rc115_control_center_integration.sql \
            supabase/migrations/20261028225000_rc457_business_employee_permission_ceiling.sql \
            supabase/tests/professional_dashboard_permission_integration.sql; do
            name="$(basename "$file")"
            docker cp "$file" "$pg_container:/tmp/$name"
            docker exec "$pg_container" psql -U postgres -d professional_dashboard_rbac_test -v ON_ERROR_STOP=1 -f "/tmp/$name"
          done
          echo "PROFESSIONAL_DASHBOARD_EMPLOYEE_RBAC_POSTGRES=PASS"

  professional_dashboard_browser_e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Build primary catalog for local production-preview tests
        working-directory: apps/catalog-frontend
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run lint
          npm run build
      - name: Install pinned Playwright and Chromium outside the app dependency tree
        run: |
          set -euo pipefail
          mkdir -p /tmp/playwright-runner
          npm install --prefix /tmp/playwright-runner --no-audit --no-fund playwright@1.64.1
          /tmp/playwright-runner/node_modules/.bin/playwright install --with-deps chromium
      - name: Run dashboard browser checks against the built app
        shell: bash
        run: |
          set -euo pipefail
          cd apps/catalog-frontend
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/catalog-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=false
          for _ in $(seq 1 45); do
            if curl --fail --silent http://127.0.0.1:4173/MantiqatiX/ >/dev/null; then ready=true; break; fi
            sleep 1
          done
          if [ "$ready" != true ]; then cat /tmp/catalog-preview.log; exit 1; fi
          PLAYWRIGHT_MODULE=/tmp/playwright-runner/node_modules/playwright/index.mjs node tests/professional-dashboard.browser.e2e.mjs
