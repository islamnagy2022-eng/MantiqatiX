name: RC501 Platform Admin Caller Search Path
on:
  pull_request:
    paths:
      - "supabase/migrations/20261124150000_rc501_is_platform_admin_caller_search_path.sql"
      - "supabase/tests/rc501_is_platform_admin_caller_search_path_fixture.sql"
      - "supabase/tests/rc501_is_platform_admin_caller_search_path_integration.sql"
      - "scripts/validate-rc501-is-platform-admin-caller-search-path.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/production/verify-production.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - ".github/workflows/rc501-is-platform-admin-caller-search-path.yml"
  push:
    branches:
      - "main"
    paths:
      - "supabase/migrations/20261124150000_rc501_is_platform_admin_caller_search_path.sql"
      - "supabase/tests/rc501_is_platform_admin_caller_search_path_fixture.sql"
      - "supabase/tests/rc501_is_platform_admin_caller_search_path_integration.sql"
      - "scripts/validate-rc501-is-platform-admin-caller-search-path.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/production/verify-production.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - ".github/workflows/rc501-is-platform-admin-caller-search-path.yml"

permissions:
  contents: read

jobs:
  rc501-platform-admin-caller-search-path-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rc501_caller_path_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d rc501_caller_path_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate RC501 static source and release contract
        run: node scripts/validate-rc501-is-platform-admin-caller-search-path.mjs
      - name: Apply isolated PostgreSQL 17 fixture, migration and assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc501_is_platform_admin_caller_search_path_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261124150000_rc501_is_platform_admin_caller_search_path.sql "$pg_container:/tmp/rc501.sql"
          docker cp supabase/tests/rc501_is_platform_admin_caller_search_path_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d rc501_caller_path_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d rc501_caller_path_test -v ON_ERROR_STOP=1 -f /tmp/rc501.sql
          docker exec "$pg_container" psql -U postgres -d rc501_caller_path_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
