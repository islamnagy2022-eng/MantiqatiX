name: Digital Page Payment Finalization Isolation
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/functions/digital-page-payment-intent/index.ts"
      - "supabase/migrations/20261016100000_digital_page_payment_intent_server_only_finalization.sql"
      - "supabase/tests/digital_page_payment_intent_server_only_finalization.sql"
      - "supabase/tests/digital_page_payment_intent_server_only_finalization_setup.sql"
      - "scripts/validate-digital-pages-boundaries.mjs"
      - "scripts/production/verify-production.mjs"
      - ".github/workflows/digital-page-payment-finalization-isolation.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/digital-page-payment-intent/index.ts"
      - "supabase/migrations/20261016100000_digital_page_payment_intent_server_only_finalization.sql"
      - "supabase/tests/digital_page_payment_intent_server_only_finalization.sql"
      - "supabase/tests/digital_page_payment_intent_server_only_finalization_setup.sql"
      - "scripts/validate-digital-pages-boundaries.mjs"
      - "scripts/production/verify-production.mjs"
      - ".github/workflows/digital-page-payment-finalization-isolation.yml"
permissions:
  contents: read
jobs:
  isolated-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Prepare minimal disposable schema fixture
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/digital_page_payment_intent_server_only_finalization_setup.sql
      - name: Apply candidate migration to disposable PostgreSQL only
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/migrations/20261016100000_digital_page_payment_intent_server_only_finalization.sql
      - name: Verify grants and authenticated denial plus trusted success
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/digital_page_payment_intent_server_only_finalization.sql
      - name: Validate source contract
        run: node scripts/validate-digital-pages-boundaries.mjs
      - name: Verify release gate records safe finalization while preserving global block
        run: |
          node scripts/production/verify-production.mjs
          node --input-type=module -e 'import fs from "node:fs"; const report=JSON.parse(fs.readFileSync("artifacts/production-verification/production-verification.json","utf8")); const gate=report.results.find((r)=>r.id==="DIG-FINALIZE-TRUST-BOUNDARY"); const live=report.results.find((r)=>r.id==="DIG-FINALIZE-LIVE-PARITY"); if(gate?.status!=="PASS") throw new Error("Digital finalization source gate did not pass: "+JSON.stringify(gate)); if(live?.status!=="BLOCKED") throw new Error("Live finalization parity must remain blocked until timestamped production evidence exists: "+JSON.stringify(live)); if(report.production_gate!=="BLOCKED") throw new Error("Production must remain blocked until independent runtime evidence is complete"); console.log("PASS: source finalization boundary verified; live parity and global production gate correctly remain BLOCKED");'
