name: Provider Profile Anonymous Column ACL
on:
  push:
    branches: ["**"]
    paths:
      - "supabase/tests/rc110_provider_profile_anon_column_acl_*.sql"
      - ".github/workflows/provider-profile-anon-column-acl.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/tests/rc110_provider_profile_anon_column_acl_*.sql"
      - ".github/workflows/provider-profile-anon-column-acl.yml"
permissions:
  contents: read
jobs:
  provider-profile-anon-column-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc110_provider_acl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc110_provider_acl_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply disposable fixture and assert anonymous column boundary
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc110_provider_profile_anon_column_acl_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/tests/rc110_provider_profile_anon_column_acl_integration.sql "$pg_container:/tmp/test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc110_provider_acl_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc110_provider_acl_test -v ON_ERROR_STOP=1 -f /tmp/test.sql
