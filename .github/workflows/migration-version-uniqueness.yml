name: Migration Version Uniqueness
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-migration-version-uniqueness.mjs"
      - ".github/workflows/migration-version-uniqueness.yml"
  pull_request:
    branches:
      - main
    paths:
      - "supabase/migrations/**"
      - "scripts/validate-migration-version-uniqueness.mjs"
      - ".github/workflows/migration-version-uniqueness.yml"
permissions:
  contents: read
jobs:
  validate-migration-versions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Reject new migration version collisions
        run: node scripts/validate-migration-version-uniqueness.mjs
