name: RC465 Orders Read Scope
on:
  push:
    branches:
      - "**"
    paths:
      - "supabase/migrations/20261114010000_rc465_orders_read_scope_hardening.sql"
      - "supabase/tests/rc465_orders_read_scope_*.sql"
      - "scripts/validate-rc465-orders-read-scope.mjs"
      - ".github/workflows/rc465-orders-read-scope.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261114010000_rc465_orders_read_scope_hardening.sql"
      - "supabase/tests/rc465_orders_read_scope_*.sql"
      - "scripts/validate-rc465-orders-read-scope.mjs"
      - ".github/workflows/rc465-orders-read-scope.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-rc465-orders-read-scope.mjs

  orders-read-scope-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc465_orders_scope_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc465_orders_scope_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Reproduce old policy, apply RC465, and run behavioral tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc465_orders_read_scope_fixture.sql "$pg_container:/tmp/rc465_fixture.sql"
          docker cp supabase/tests/rc465_orders_read_scope_baseline.sql "$pg_container:/tmp/rc465_baseline.sql"
          docker cp supabase/migrations/20261114010000_rc465_orders_read_scope_hardening.sql "$pg_container:/tmp/rc465_migration.sql"
          docker cp supabase/tests/rc465_orders_read_scope_integration.sql "$pg_container:/tmp/rc465_integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc465_orders_scope_test -v ON_ERROR_STOP=1 -f /tmp/rc465_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc465_orders_scope_test -v ON_ERROR_STOP=1 -f /tmp/rc465_baseline.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc465_orders_scope_test -v ON_ERROR_STOP=1 -f /tmp/rc465_migration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc465_orders_scope_test -v ON_ERROR_STOP=1 -f /tmp/rc465_integration.sql
