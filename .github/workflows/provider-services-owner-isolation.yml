name: Provider Services Owner Isolation
on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths:
      - "docs/release/production-migration-reconciliation.json"
      - "supabase/migrations/20260928010000_rc99_g5_provider_services_rls_hardening.sql"
      - "supabase/migrations/20261023020000_rc102_provider_services_owner_write_grants.sql"
      - "supabase/tests/rc102_provider_services_*.sql"
      - "scripts/validate-provider-services-contract.mjs"
      - ".github/workflows/provider-services-owner-isolation.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/release/production-migration-reconciliation.json"
      - "supabase/migrations/20260928010000_rc99_g5_provider_services_rls_hardening.sql"
      - "supabase/migrations/20261023020000_rc102_provider_services_owner_write_grants.sql"
      - "supabase/tests/rc102_provider_services_*.sql"
      - "scripts/validate-provider-services-contract.mjs"
      - ".github/workflows/provider-services-owner-isolation.yml"
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node scripts/validate-provider-services-contract.mjs

  provider-services-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc102_provider_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc102_provider_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply isolated fixture, ownership policy, grants, and behavior tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc102_provider_services_fixture.sql "$pg_container:/tmp/rc102_fixture.sql"
          docker cp supabase/migrations/20260928010000_rc99_g5_provider_services_rls_hardening.sql "$pg_container:/tmp/rc99_policy.sql"
          docker cp supabase/migrations/20261023020000_rc102_provider_services_owner_write_grants.sql "$pg_container:/tmp/rc102_grants.sql"
          docker cp supabase/tests/rc102_provider_services_integration.sql "$pg_container:/tmp/rc102_test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc102_provider_test -v ON_ERROR_STOP=1 -f /tmp/rc102_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc102_provider_test -v ON_ERROR_STOP=1 -f /tmp/rc99_policy.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc102_provider_test -v ON_ERROR_STOP=1 -f /tmp/rc102_grants.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc102_provider_test -v ON_ERROR_STOP=1 -f /tmp/rc102_test.sql
