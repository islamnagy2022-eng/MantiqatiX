name: Matrimony Request Lifecycle Authority

on:
  pull_request:
    paths:
      - "supabase/migrations/20261010161000_rc448_matrimony_request_lifecycle_authority.sql"
      - "supabase/tests/rc448_matrimony_request_lifecycle_integration.sql"
      - "supabase/tests/rc448_matrimony_request_lifecycle_grants_fixture.sql"
      - ".github/workflows/matrimony-request-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261010161000_rc448_matrimony_request_lifecycle_authority.sql"
      - "supabase/tests/rc448_matrimony_request_lifecycle_integration.sql"
      - "supabase/tests/rc448_matrimony_request_lifecycle_grants_fixture.sql"
      - ".github/workflows/matrimony-request-lifecycle.yml"

jobs:
  request-lifecycle-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_matrimony_lifecycle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_matrimony_lifecycle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Apply RC447 schema baseline
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc447_matrimony_privacy_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261010150000_rc447_matrimony_profile_privacy_boundary.sql "$pg_container:/tmp/rc447.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_matrimony_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_matrimony_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/rc447.sql
      - name: Apply RC448 and lifecycle integration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc448_matrimony_request_lifecycle_grants_fixture.sql "$pg_container:/tmp/rc448-grants.sql"
          docker cp supabase/migrations/20261010161000_rc448_matrimony_request_lifecycle_authority.sql "$pg_container:/tmp/rc448.sql"
          docker cp supabase/tests/rc448_matrimony_request_lifecycle_integration.sql "$pg_container:/tmp/rc448-test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_matrimony_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/rc448-grants.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_matrimony_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/rc448.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_matrimony_lifecycle_test -v ON_ERROR_STOP=1 -f /tmp/rc448-test.sql
