name: Deploy R6 Preview to Cloud Run

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: r6-preview-cloud-run
  cancel-in-progress: true

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Require the isolated Preview branch
        run: |
          test "$GITHUB_REF_NAME" = "preview/bizcatalog-manager-6-isolated" || {
            echo "::error::Deploy workflow may run only from the isolated Preview branch."
            exit 1
          }
      - name: Require successful CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUNS="$(curl --fail --silent --show-error \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/r6-preview-ci.yml/runs?branch=preview%2Fbizcatalog-manager-6-isolated&per_page=100")"
          echo "$RUNS" | jq -e --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] | select(
              .head_sha == $sha and
              .status == "completed" and
              .conclusion == "success" and
              .head_branch == "preview/bizcatalog-manager-6-isolated"
            )] | length > 0
          ' >/dev/null || {
            echo "::error::No successful R6 Preview Build exists for this exact commit SHA."
            exit 1
          }

  deploy:
    needs: verify-build
    runs-on: ubuntu-latest
    environment: r6-preview
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify deployed source matches the tested commit
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Require imported application source
        run: |
          test -f apps/bizcatalog-manager-6-preview/Dockerfile || {
            echo "::error::R6 application source is not yet present in this branch. Import the verified archive before deployment."
            exit 1
          }
      - name: Validate isolated Cloud Run deployment secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" || (echo "::error::Missing r6-preview environment secret GCP_PROJECT_ID" && exit 1)
          test -n "$GCP_WIF_PROVIDER" || (echo "::error::Missing r6-preview environment secret GCP_WIF_PROVIDER" && exit 1)
          test -n "$GCP_DEPLOYER_SERVICE_ACCOUNT" || (echo "::error::Missing r6-preview environment secret GCP_DEPLOYER_SERVICE_ACCOUNT" && exit 1)
      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy isolated Preview service
        working-directory: apps/bizcatalog-manager-6-preview
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
        run: |
          REGION="${REGION:-europe-west1}"
          SERVICE="${SERVICE:-mantiqatix-r6-preview}"
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,PREVIEW_MODE=true,VITE_PREVIEW_MODE=true,DISABLE_HMR=true" \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min 0 \
            --max 3 \
            --timeout 60s
      - name: Verify service URL and health
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
        run: |
          REGION="${REGION:-europe-west1}"
          SERVICE="${SERVICE:-mantiqatix-r6-preview}"
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$URL"
          echo "Preview URL: $URL"
          curl --fail --retry 8 --retry-delay 5 "$URL/api/health"
          BASE_URL="$URL" bash scripts/smoke_test_r6_preview.sh
