name: Deploy R6 Preview to Cloud Run

on:
  workflow_run:
    workflows:
      - "R6 Preview Build"
    types:
      - completed
    branches:
      - preview/bizcatalog-manager-6-isolated

permissions:
  contents: read
  id-token: write

concurrency:
  group: r6-preview-cloud-run
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'preview/bizcatalog-manager-6-isolated' }}
    runs-on: ubuntu-latest
    environment: r6-preview
    steps:
      - name: Checkout isolated preview branch
        uses: actions/checkout@v4
        with:
          ref: preview/bizcatalog-manager-6-isolated
      - name: Require imported application source
        run: |
          test -f apps/bizcatalog-manager-6-preview/Dockerfile || {
            echo "::error::R6 application source is not yet present in this branch. Import the verified archive before deployment."
            exit 1
          }
      - name: Validate isolated Cloud Run deployment secrets
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_WIF_PROVIDER: ${{ secrets.GCP_WIF_PROVIDER }}
          GCP_DEPLOYER_SERVICE_ACCOUNT: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" || (echo "::error::Missing r6-preview environment secret GCP_PROJECT_ID" && exit 1)
          test -n "$GCP_WIF_PROVIDER" || (echo "::error::Missing r6-preview environment secret GCP_WIF_PROVIDER" && exit 1)
          test -n "$GCP_DEPLOYER_SERVICE_ACCOUNT" || (echo "::error::Missing r6-preview environment secret GCP_DEPLOYER_SERVICE_ACCOUNT" && exit 1)
      - name: Authenticate to Google Cloud using Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
      - name: Deploy isolated Preview service
        working-directory: apps/bizcatalog-manager-6-preview
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
        run: |
          REGION="${REGION:-europe-west1}"
          SERVICE="${SERVICE:-mantiqatix-r6-preview}"
          gcloud run deploy "$SERVICE" \
            --source . \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --platform managed \
            --allow-unauthenticated \
            --set-env-vars "NODE_ENV=production,PREVIEW_MODE=true,VITE_PREVIEW_MODE=true,DISABLE_HMR=true" \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --min 0 \
            --max 3 \
            --timeout 60s
      - name: Verify service URL and health
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          SERVICE: ${{ vars.CLOUD_RUN_PREVIEW_SERVICE }}
        run: |
          REGION="${REGION:-europe-west1}"
          SERVICE="${SERVICE:-mantiqatix-r6-preview}"
          URL="$(gcloud run services describe "$SERVICE" --project "$PROJECT_ID" --region "$REGION" --format='value(status.url)')"
          test -n "$URL"
          echo "Preview URL: $URL"
          curl --fail --retry 8 --retry-delay 5 "$URL/api/health"
