name: S08 Auth Contract Tests
on:
  pull_request:
    branches: [main]
    paths:
      - "web/app.js"
      - "web/smm.js"
      - "supabase/functions/mnty-customer-registration/**"
      - "supabase/functions/mnty-registration-review/**"
      - "scripts/test-s08-auth-flows.mjs"
      - ".github/workflows/s08-auth-contracts.yml"
      - "docs/S08_AUTH_MEMBERSHIP_AUDIT.md"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: s08-auth-contracts-${{ github.ref }}
  cancel-in-progress: true
jobs:
  auth-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Syntax check
        run: node --check scripts/test-s08-auth-flows.mjs
      - name: Run S08 static contract tests
        run: node scripts/test-s08-auth-flows.mjs
