name: RC462 Platform Admin Malformed-Permission Regression

on:
  pull_request:
    paths:
      - "supabase/migrations/20261010170000_rc449_mantigo_platform_admin_scope_hardening.sql"
      - "supabase/migrations/20261012040000_rc462_mantigo_platform_admin_guard_malformed_permissions.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_fixture.sql"
      - "supabase/tests/rc462_mantigo_platform_admin_malformed_permissions.sql"
      - ".github/workflows/rc462-platform-admin-regression.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/20261010170000_rc449_mantigo_platform_admin_scope_hardening.sql"
      - "supabase/migrations/20261012040000_rc462_mantigo_platform_admin_guard_malformed_permissions.sql"
      - "supabase/tests/rc449_mantigo_platform_admin_fixture.sql"
      - "supabase/tests/rc462_mantigo_platform_admin_malformed_permissions.sql"
      - ".github/workflows/rc462-platform-admin-regression.yml"

permissions:
  contents: read

jobs:
  rc462-platform-admin-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc462_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc462_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Prepare disposable PostgreSQL roles
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc462_test -v ON_ERROR_STOP=1 -c "CREATE ROLE anon; CREATE ROLE authenticated;"
      - name: Apply isolated fixture and forward-only migrations
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc449_mantigo_platform_admin_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261010170000_rc449_mantigo_platform_admin_scope_hardening.sql "$pg_container:/tmp/rc449.sql"
          docker cp supabase/migrations/20261012040000_rc462_mantigo_platform_admin_guard_malformed_permissions.sql "$pg_container:/tmp/rc462.sql"
          docker cp supabase/tests/rc462_mantigo_platform_admin_malformed_permissions.sql "$pg_container:/tmp/rc462-test.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc462_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc462_test -v ON_ERROR_STOP=1 -f /tmp/rc449.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc462_test -v ON_ERROR_STOP=1 -f /tmp/rc462.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc462_test -v ON_ERROR_STOP=1 -f /tmp/rc462-test.sql
