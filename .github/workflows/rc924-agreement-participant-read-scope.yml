name: RC924 Agreement Participant Read Scope

on:
  pull_request:
    paths:
      - "supabase/migrations/20261124140000_rc924_agreement_participant_read_scope.sql"
      - "supabase/migrations/20261119020000_rc482_legal_platform_admin_registry_guard.sql"
      - "supabase/tests/rc482_legal_platform_admin_registry_integration.sql"
      - "scripts/validate-rc482-legal-platform-admin-registry.mjs"
      - "supabase/tests/rc924_agreement_participant_read_scope_fixture.sql"
      - "supabase/tests/rc924_agreement_participant_read_scope_integration.sql"
      - "scripts/validate-rc924-agreement-participant-read-scope.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/production/verify-production.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - "docs/release/production-migration-reconciliation.json"
      - ".github/workflows/forward-migration-chain-replay.yml"
      - ".github/workflows/rc924-agreement-participant-read-scope.yml"
  push:
    branches:
      - "feat/mntx-bp001-rc924-ordered-rc482-20261124"
      - "fix/rc924-81-migration-release-contract-20261124"
    paths:
      - "supabase/migrations/20261124140000_rc924_agreement_participant_read_scope.sql"
      - "supabase/migrations/20261119020000_rc482_legal_platform_admin_registry_guard.sql"
      - "supabase/tests/rc482_legal_platform_admin_registry_integration.sql"
      - "scripts/validate-rc482-legal-platform-admin-registry.mjs"
      - "supabase/tests/rc924_agreement_participant_read_scope_fixture.sql"
      - "supabase/tests/rc924_agreement_participant_read_scope_integration.sql"
      - "scripts/validate-rc924-agreement-participant-read-scope.mjs"
      - "scripts/production/live-reconciliation-contract.mjs"
      - "scripts/production/verify-production.mjs"
      - "scripts/validate-production-migration-chain-gate.mjs"
      - "docs/release/production-migration-reconciliation.json"
      - ".github/workflows/forward-migration-chain-replay.yml"
      - ".github/workflows/rc924-agreement-participant-read-scope.yml"

permissions:
  contents: read

jobs:
  rc924-agreement-read-scope-postgres17:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc924_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc924_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Validate RC482 registry-backed legal authorization
        run: node scripts/validate-rc482-legal-platform-admin-registry.mjs
      - name: Validate RC924 static contract
        run: node scripts/validate-rc924-agreement-participant-read-scope.mjs
      - name: Apply isolated fixture, migration and adversarial assertions
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:17' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc924_agreement_participant_read_scope_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261119020000_rc482_legal_platform_admin_registry_guard.sql "$pg_container:/tmp/rc482.sql"
          docker cp supabase/tests/rc482_legal_platform_admin_registry_integration.sql "$pg_container:/tmp/rc482-integration.sql"
          docker cp supabase/migrations/20261124140000_rc924_agreement_participant_read_scope.sql "$pg_container:/tmp/rc924.sql"
          docker cp supabase/tests/rc924_agreement_participant_read_scope_integration.sql "$pg_container:/tmp/integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          if docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/rc924.sql > /tmp/rc924-overload-preflight.log 2>&1; then
            echo "RC924 unexpectedly accepted the ambiguous pre-RC482 zero-argument helper"
            exit 1
          else
            grep -Fq 'RC924_REQUIRES_RC482_REMOVAL_OF_ZERO_ARGUMENT_LEGAL_ADMIN_OVERLOAD' /tmp/rc924-overload-preflight.log
            echo "RC924_BLOCKS_ZERO_ARGUMENT_LEGAL_ADMIN_OVERLOAD=PASS"
          fi
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -c 'DROP FUNCTION private.legal_is_admin();'
          if docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/rc924.sql > /tmp/rc924-membership-preflight.log 2>&1; then
            echo "RC924 unexpectedly accepted the membership-derived UUID legal helper"
            exit 1
          else
            grep -Fq 'RC924_LEGAL_ADMIN_HELPER_IS_NOT_REGISTRY_BACKED' /tmp/rc924-membership-preflight.log
            echo "RC924_BLOCKS_MEMBERSHIP_DERIVED_LEGAL_HELPER=PASS"
          fi
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/rc482.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/rc482-integration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/rc924.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc924_test -v ON_ERROR_STOP=1 -f /tmp/integration.sql
