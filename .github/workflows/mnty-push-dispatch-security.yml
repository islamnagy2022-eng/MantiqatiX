name: MantiGO Push Dispatch Security Contract

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/mnty-push-dispatch/**"
      - "supabase/functions/_shared/push-dispatch-security.mjs"
      - "supabase/tests/mnty-push-dispatch-security.test.mjs"
      - ".github/workflows/mnty-push-dispatch-security.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/functions/mnty-push-dispatch/**"
      - "supabase/functions/_shared/push-dispatch-security.mjs"
      - "supabase/tests/mnty-push-dispatch-security.test.mjs"
      - ".github/workflows/mnty-push-dispatch-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run push dispatch security regression tests
        run: node --test supabase/tests/mnty-push-dispatch-security.test.mjs
