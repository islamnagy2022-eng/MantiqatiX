name: RC468 Digital Page Payment Claim Hardening

on:
  push:
    branches: ["**"]
    paths:
      - "supabase/migrations/20261115030000_rc468_digital_page_payment_claim_hardening.sql"
      - "supabase/tests/rc468_digital_page_payment_claim_precondition.sql"
      - "supabase/tests/rc468_digital_page_payment_claim_integration.sql"
      - ".github/workflows/rc468-digital-page-payment-claim-hardening.yml"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/20261115030000_rc468_digital_page_payment_claim_hardening.sql"
      - "supabase/tests/rc468_digital_page_payment_claim_precondition.sql"
      - "supabase/tests/rc468_digital_page_payment_claim_integration.sql"
      - ".github/workflows/rc468-digital-page-payment-claim-hardening.yml"

permissions:
  contents: read

jobs:
  rc468-payment-claim:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc468_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc468_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - name: Create isolated Supabase role stand-ins
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc468_test -v ON_ERROR_STOP=1 -c "create role anon nologin; create role authenticated nologin; create role service_role nologin;"
      - name: Apply RC458 baseline fixture and RC468 disposable precondition
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          docker cp supabase/tests/rc458_digital_page_payment_rpc_fixture.sql "$pg_container:/tmp/rc458_fixture.sql"
          docker cp supabase/tests/rc468_digital_page_payment_claim_precondition.sql "$pg_container:/tmp/rc468_precondition.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc468_test -v ON_ERROR_STOP=1 -f /tmp/rc458_fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc468_test -v ON_ERROR_STOP=1 -f /tmp/rc468_precondition.sql
      - name: Apply RC468 candidate migration
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          docker cp supabase/migrations/20261115030000_rc468_digital_page_payment_claim_hardening.sql "$pg_container:/tmp/rc468_migration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc468_test -v ON_ERROR_STOP=1 -f /tmp/rc468_migration.sql
      - name: Run RC468 behavioral and ACL regression tests
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          docker cp supabase/tests/rc468_digital_page_payment_claim_integration.sql "$pg_container:/tmp/rc468_integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc468_test -v ON_ERROR_STOP=1 -f /tmp/rc468_integration.sql
