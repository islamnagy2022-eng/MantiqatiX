name: RC479 Anonymous Auth Session Boundary

on:
  pull_request:
    paths:
      - "supabase/migrations/20261118190000_rc479_revoke_anon_provider_profile_base_read.sql"
      - "supabase/tests/rc479_provider_profile_anon_read_fixture.sql"
      - "supabase/tests/rc479_provider_profile_anon_read_integration.sql"
      - "supabase/tests/rc479_anonymous_auth_session_boundary_integration.sql"
      - "scripts/validate-rc479-anonymous-auth-session-boundary.mjs"
      - ".github/workflows/rc479-anonymous-auth-session-boundary.yml"
  push:
    branches:
      - "fix/rc479-anonymous-auth-profile-boundary-tests-20261120"
    paths:
      - "supabase/migrations/20261118190000_rc479_revoke_anon_provider_profile_base_read.sql"
      - "supabase/tests/rc479_provider_profile_anon_read_fixture.sql"
      - "supabase/tests/rc479_provider_profile_anon_read_integration.sql"
      - "supabase/tests/rc479_anonymous_auth_session_boundary_integration.sql"
      - "scripts/validate-rc479-anonymous-auth-session-boundary.mjs"
      - ".github/workflows/rc479-anonymous-auth-session-boundary.yml"

permissions:
  contents: read

jobs:
  rc479-anonymous-auth-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mantiqatix_rc479_anon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mantiqatix_rc479_anon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Verify anonymous Auth-session source contract
        run: node scripts/validate-rc479-anonymous-auth-session-boundary.mjs
      - name: Reproduce residual anonymous Auth read, then test restrictive boundary
        shell: bash
        run: |
          set -euo pipefail
          pg_container="$(docker ps --filter 'ancestor=postgres:16' --format '{{.ID}}' | head -n 1)"
          test -n "$pg_container"
          docker cp supabase/tests/rc479_provider_profile_anon_read_fixture.sql "$pg_container:/tmp/fixture.sql"
          docker cp supabase/migrations/20261118190000_rc479_revoke_anon_provider_profile_base_read.sql "$pg_container:/tmp/rc479.sql"
          docker cp supabase/tests/rc479_provider_profile_anon_read_integration.sql "$pg_container:/tmp/raw-anon-integration.sql"
          docker cp supabase/tests/rc479_anonymous_auth_session_boundary_integration.sql "$pg_container:/tmp/anonymous-auth-integration.sql"
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc479_anon_test -v ON_ERROR_STOP=1 -f /tmp/fixture.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc479_anon_test -v ON_ERROR_STOP=1 -f /tmp/rc479.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc479_anon_test -v ON_ERROR_STOP=1 -f /tmp/raw-anon-integration.sql
          docker exec "$pg_container" psql -U postgres -d mantiqatix_rc479_anon_test -v ON_ERROR_STOP=1 -f /tmp/anonymous-auth-integration.sql
