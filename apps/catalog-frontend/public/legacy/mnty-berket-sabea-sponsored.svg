<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" role="img" aria-labelledby="title desc"><title id="title">MantiqatiX — مقدم خدمات بركة السبع</title><desc id="desc">إعلان ممول تجريبي لمقدم خدمات في بركة السبع</desc><rect width="1200" height="628" rx="36" fill="#160809"/><circle cx="110" cy="570" r="220" fill="#F6C453" opacity=".16"/><text x="80" y="150" fill="#F6C453" font-family="Arial,sans-serif" font-size="50" font-weight="700">MantiqatiX</text><text x="80" y="250" fill="#fff" font-family="Arial,sans-serif" font-size="46" font-weight="700">مقدم خدمات بركة السبع</text><text x="80" y="325" fill="#F8E9C5" font-family="Arial,sans-serif" font-size="30">اكتشف النشاط والخدمات المتاحة</text></svg>