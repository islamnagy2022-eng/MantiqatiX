<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#0750c9">
  <title>MantiqatiX | بدء المعاينة</title>
  <style>
    :root{color-scheme:light;--ink:#241113;--muted:#6b7280;--blue:#0750c9;--line:#e5e7eb}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#f7f9ff,#fbf8f2);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}
    main{width:min(100%,560px);text-align:center;background:#fff;border:1px solid var(--line);border-radius:24px;padding:clamp(24px,5vw,42px);box-shadow:0 18px 55px #17255412}
    .mark{display:grid;place-items:center;width:58px;height:58px;margin:0 auto 16px;border-radius:18px;background:linear-gradient(135deg,#0750c9,#63d8c0);color:#fff;font-size:29px;font-weight:900}
    h1{font-size:clamp(25px,4vw,34px);margin:0}.sub{color:var(--muted);line-height:1.9;margin:12px 0 24px}
    .actions{display:grid;gap:10px}.btn{display:block;padding:13px 16px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid var(--line);color:var(--ink)}
    .primary{background:var(--blue);color:#fff;border-color:var(--blue)}.note{font-size:12px;color:var(--muted);margin-top:18px}
  </style>
  <script>
    // Preview URL should enter the real public landing page, not the dashboard mock.
    window.setTimeout(function(){ window.location.replace('../'); }, 1200);
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <h1>MantiqatiX</h1>
    <p class="sub">جاري فتح الصفحة الرئيسية للمنصة. من هناك يمكنك استعراض الخدمات وتسجيل الدخول ثم الانتقال إلى مساحة حسابك حسب صلاحياته.</p>
    <div class="actions">
      <a class="btn primary" href="../">فتح الصفحة الرئيسية الآن</a>
      <a class="btn" href="dashboard.html">فتح لوحة المعاينة التجريبية</a>
    </div>
    <p class="note">لو لم يتم التحويل تلقائيا استخدم زر الصفحة الرئيسية. لوحة المعاينة مستقلة ولا تحفظ بيانات تشغيل حقيقية.</p>
  </main>
</body>
</html>
