<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#111827">
  <title>MantiqaTix — التسويق الإلكتروني</title>
  <style>
    :root{color-scheme:light;font-family:Tahoma,Arial,sans-serif;background:#f3f5f9;color:#172033}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);background:#fff;border:1px solid #e2e7ef;border-radius:24px;padding:clamp(24px,5vw,48px);box-shadow:0 18px 60px #15213b12}
    .brand{font-size:14px;font-weight:800;letter-spacing:.04em;color:#4656a5}
    .status{display:inline-block;margin-top:28px;padding:7px 12px;border-radius:999px;background:#fff2d8;color:#865400;font-size:13px;font-weight:700}
    h1{font-size:clamp(26px,5vw,38px);line-height:1.45;margin:16px 0}
    p{font-size:16px;line-height:2;color:#536078;margin:0 0 24px}
    a{display:inline-block;text-decoration:none;background:#263b8e;color:#fff;padding:12px 18px;border-radius:12px;font-weight:700}
  </style>
</head>
<body>
  <main>
    <div class="brand">MNTY · MantiqaTix</div>
    <div class="status">قيد التطوير — مؤجل لما بعد الإطلاق</div>
    <h1>خدمات التسويق الإلكتروني</h1>
    <p>نعمل على استكمال اختبارات الأمان والعمليات المالية والتكاملات قبل إتاحة هذا القسم. لن تتمكن الصفحة من إنشاء طلبات أو تنفيذ عمليات مالية أو الاتصال بمزودي الخدمات خلال فترة التأجيل.</p>
    <a href="./">العودة إلى المنصة</a>
  </main>
</body>
</html>
