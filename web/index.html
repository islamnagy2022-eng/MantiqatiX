<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MantiqatiX | منصة الخدمات ومقدميها</title><meta name="author" content="MantiqatiX"><meta name="description" content="MANTIQATIX (Mantiqati X) منصة رقمية متكاملة تربط العملاء بمقدمي الخدمات والأنشطة المسجلة، وتسهّل اكتشاف الخدمات ومقارنتها وطلبها ومتابعة تنفيذها عبر قطاعات متعددة، مع استخدام الموقع فقط عند الحاجة التشغيلية وبحسب الإذن. MANTIQATIX ليست وسيطًا ماديًا بين العميل ومقدم الخدمة، ولا تتولى تقديم الخدمة أو تنفيذها ماديًا نيابةً عن مقدم الخدمة؛ يقتصر دورها على توفير البنية الرقمية للاكتشاف والمطابقة والتواصل وإدارة الطلبات والمتابعة، بينما يظل مقدم الخدمة هو المسؤول عن تقديم الخدمة وتنفيذها فعليًا." /><meta name="robots" content="index,follow,max-image-preview:large"><meta name="referrer" content="origin"><meta name="color-scheme" content="light"><meta name="application-name" content="MantiqatiX"><meta name="msapplication-TileColor" content="#160809"><meta name="format-detection" content="telephone=no"><meta property="og:type" content="website"><meta property="og:site_name" content="MantiqatiX"><meta property="og:title" content="MantiqatiX | منصة الخدمات ومقدميها"><meta property="og:description" content="منصة رقمية لاكتشاف الخدمات وربط العملاء بمقدمي الخدمات وإدارة الطلبات والمتابعة."><meta property="og:url" content="https://islamnagy2022-eng.github.io/MantiqatiX/"><meta property="og:image" content="https://islamnagy2022-eng.github.io/MantiqatiX/assets/mantiqatix-logo.svg"><meta name="twitter:card" content="summary_large_image"><link rel="canonical" href="https://islamnagy2022-eng.github.io/MantiqatiX/"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-touch-icon" content="icons/icon-192.svg"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="MantiqatiX"><meta name="theme-color" content="#160809"><link rel="manifest" href="manifest.webmanifest?v=mnty116"><link rel="icon" href="assets/mantiqatix-mark.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="assets/mantiqatix-mark.svg"><link rel="stylesheet" href="styles.css?v=rc340"><link rel="stylesheet" href="brand.css?v=rc347"><link rel="stylesheet" href="home.css?v=rc354"></head><body><div id="app"><main style="min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Tajawal,Arial,sans-serif;background:#FBF8F2;color:#241113;direction:rtl"><section style="max-width:520px;text-align:center;background:#fff;border:1px solid #E9DCC4;border-radius:20px;padding:32px;box-shadow:0 10px 30px rgba(16,24,40,.08)"><strong style="font-size:28px">MantiqatiX</strong><small style="display:block;margin-top:6px;color:#8D0D16">منصة الخدمات والاكتشاف</small><p id="boot-status" style="margin:12px 0 0;color:#8D0D16">جارٍ تحميل منصة MantiqatiX…</p></section></main></div><noscript><div style="padding:24px;text-align:center;font-family:Tajawal,Arial,sans-serif;direction:rtl">يرجى تفعيل JavaScript لتشغيل منصة MantiqatiX.</div></noscript><script>
(function(){
  var status=document.getElementById('boot-status');
  function fail(msg){
    if(status){status.textContent=msg;status.style.color='#b42318'}
  }
  function load(src,timeoutMs){
    timeoutMs=timeoutMs||12000;
    return new Promise(function(resolve,reject){
      var el=document.createElement('script');
      var settled=false;
      var timer=setTimeout(function(){
        if(settled)return;
        settled=true;
        window.removeEventListener('error',onError,true);
        reject(new Error('SCRIPT_TIMEOUT:'+src));
      },timeoutMs);
      var onError=function(event){
        if(settled)return;
        if(event && event.filename && event.filename.indexOf(src.split('?')[0])===-1)return;
        settled=true;
        clearTimeout(timer);
        window.removeEventListener('error',onError,true);
        reject(new Error('SCRIPT_RUNTIME_FAILED:'+src));
      };
      el.src=src;
      el.onload=function(){
        if(settled)return;
        settled=true;
        clearTimeout(timer);
        window.removeEventListener('error',onError,true);
        resolve();
      };
      el.onerror=function(){
        if(settled)return;
        settled=true;
        clearTimeout(timer);
        window.removeEventListener('error',onError,true);
        reject(new Error('LOAD_FAILED:'+src));
      };
      window.addEventListener('error',onError,true);
      document.head.appendChild(el);
    });
  }
  window.addEventListener('error',function(e){
    if(e?.error || e?.message) console.error('[MantiqatiX boot error]',e.error||e.message);
  });
  window.addEventListener('unhandledrejection',function(e){
    console.error('[MantiqatiX boot rejection]',e.reason);
  });
  async function boot(){
    try{
      // Open the public website shell first. The landing page is intentionally
      // independent from authenticated app boot so a transient SDK/network
      // failure can never leave the user on a blank/error-only screen.
      await load('config.js?v=mnty116');
      await load('location-adapter.js?v=mnty116');
      await load('sector-registry.js?v=rc367');
      await load('home.js?v=rc370');
      try{
        if(typeof window.MXHomeLanding==='function') window.MXHomeLanding();
      }catch(homeError){
        console.error('[MantiqatiX home] landing initialization failed',homeError);
      }
      // Last-resort public controls: the public page must remain navigable even
      // if a later home-module enhancement fails. These handlers are deliberately
      // limited to navigation/focus and never fabricate backend state.
      if(typeof window.MNTYHomeEmergencyControls!=='function'){
        window.MNTYHomeEmergencyControls=function(){
          const bind=(id,fn)=>{const el=document.getElementById(id);if(el&&!el.dataset.mntyEmergencyBound){el.dataset.mntyEmergencyBound='1';el.addEventListener('click',fn)}};
          const auth=()=>{if(typeof window.authView==='function')return window.authView();if(typeof window.openPlatform==='function')return window.openPlatform();};
          const account=()=>{if(typeof window.accountView==='function')return window.accountView();auth();};
          bind('mx-hero-search',()=>document.getElementById('mx-home-search')?.focus());
          bind('mx-search-btn',()=>document.getElementById('mx-home-search')?.focus());
          bind('mx-login',account);
          bind('mx-add',auth);
          bind('mx-bottom-account',account);
          bind('mx-bottom-add',auth);
          bind('mx-bottom-search',()=>document.getElementById('mx-home-search')?.focus());
          document.querySelectorAll('[data-scroll]').forEach(el=>{if(!el.dataset.mntyEmergencyBound){el.dataset.mntyEmergencyBound='1';el.addEventListener('click',()=>document.getElementById(el.dataset.scroll)?.scrollIntoView({behavior:'smooth',block:'start'}))}});
        };
      }
      window.MNTYHomeEmergencyControls();

      var supabaseReady=false;
      try{
        try{
          await load('vendor/supabase.js?v=supabase21172');
          if(!window.supabase?.createClient) throw new Error('SUPABASE_GLOBAL_MISSING');
        }catch(_){
          try{
            await load('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2');
            if(!window.supabase?.createClient) throw new Error('SUPABASE_GLOBAL_MISSING');
          }catch(__){
            var mod=await Promise.race([
              import('https://esm.sh/@supabase/supabase-js@2.117.2?bundle'),
              new Promise(function(_,reject){setTimeout(function(){reject(new Error('SUPABASE_MODULE_TIMEOUT'))},12000)})
            ]);
            if(!mod || typeof mod.createClient!=='function') throw new Error('SUPABASE_MODULE_MISSING');
            window.supabase=mod;
          }
        }
        supabaseReady=true;
      }catch(sdkError){
        console.error('[MantiqatiX boot] Supabase SDK unavailable; public mode remains open',sdkError);
        var publicStatus=document.getElementById('mx-live-status');
        if(publicStatus) publicStatus.textContent='وضع العرض — الخدمات الحية ستتوفر عند استعادة الاتصال';
      }

      if(supabaseReady){
        await load('rbac.js?v=mnty120');
        await load('android-parity-catalog.js?v=mnty116');
        await load('app.js?v=rc310');
        await load('module-blueprints.js?v=rc308');
        await load('restaurant-module.js?v=rc314');
        await load('sector-modules.js?v=mnty116');
        await load('reverse-bidding-module.js?v=mnty116');
        await load('operations-modules.js?v=mnty116');
        await load('provider-onboarding-module.js?v=mnty116');
        await load('brand.js?v=rc354');
        if(typeof window.MNTYBootAuth==='function') window.MNTYBootAuth();
      }
      if("serviceWorker" in navigator){
        navigator.serviceWorker.register("./sw.js?v=rc367").catch(function(){});
      }
    }catch(e){
      console.error('[MantiqatiX boot fatal]',e);
      fail('تعذر تحميل واجهة المنصة. أعد المحاولة من فضلك.');
    }
  }
  boot();
})();
</script></body></html>
