<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MantiqatiX | محرر الصفحات الرقمية</title><link rel="stylesheet" href="digital-page-editor.css?v=rc248"><script src="config.js?v=mnty116"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header><h1>محرر Portfolio / Menu</h1><p>إنشاء الصفحة وإدارتها ونشرها. الصلاحيات الفعلية يفرضها Supabase RLS.</p></header><section id="auth" class="card">جارٍ التحقق من الدخول…</section><section id="editor" hidden><div class="grid"><form id="pageForm" class="card"><h2>بيانات الصفحة</h2><label>نوع الصفحة<select id="pageType"><option value="PORTFOLIO">Portfolio</option><option value="MENU">Menu</option></select></label><label>المالك<select id="owner"></select></label><label>العنوان<input id="title" required maxlength="160"></label><label>Slug<input id="slug" required pattern="[A-Za-z0-9-]+" maxlength="100"></label><label>طلب مدفوع مرتبط بالنشر<select id="orderId"><option value="">اختر طلبًا مدفوعًا عند النشر</option></select></label><label>وصف قصير<textarea id="description" maxlength="500"></textarea></label><label>SEO Title<input id="seoTitle" maxlength="160"></label><label>SEO Description<textarea id="seoDescription" maxlength="300"></textarea></label><div class="actions"><button type="submit">حفظ مسودة</button><button type="button" id="publish">نشر</button><button type="button" id="unpublish">إلغاء النشر</button></div></form><aside class="card"><h2>الصفحات الحالية</h2><div id="pages"></div></aside></div><section class="card"><h2>الأقسام</h2><form id="sectionForm" class="grid"><label>النوع<select id="sectionType"><option>HERO</option><option>ABOUT</option><option>SERVICES</option><option>MENU</option><option>PORTFOLIO</option><option>CONTACT</option><option>CTA</option><option>CUSTOM</option></select></label><label>العنوان<input id="sectionTitle" maxlength="160"></label><label>المحتوى<textarea id="sectionContent"></textarea></label><label>البيانات JSON<textarea id="sectionData">{}</textarea></label><button type="submit">إضافة قسم</button></form><div id="sections"></div></section><p id="status" class="status"></p></section></main><script src="digital-page-editor.js?v=rc248"></script></body></html>
